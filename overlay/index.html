<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Monitor Overlay</title>
    <script>
      try {
        document.documentElement.dataset.amoTheme = localStorage.getItem("amo.theme") === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.amoTheme = "dark";
      }
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .amo-html-boot {
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        justify-items: center;
        gap: 9px;
        color: #8fc4ff;
        background:
          radial-gradient(circle at 50% 42%, rgba(143, 196, 255, 0.09), transparent 34%),
          linear-gradient(145deg, rgba(18, 24, 28, 0.99), rgba(21, 28, 32, 0.99)),
          #12191d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      .amo-html-boot-spinner {
        width: 21px;
        height: 21px;
        border: 2px solid rgba(143, 196, 255, 0.2);
        border-top-color: #8fc4ff;
        border-radius: 50%;
        animation: amo-html-boot-spin 0.8s linear infinite;
      }

      .amo-html-boot strong {
        color: #eaf5f1;
        font-size: 12px;
        line-height: 16px;
      }

      .amo-html-boot span {
        color: #879b94;
        font-size: 9px;
        line-height: 13px;
      }

      :root[data-amo-theme="light"] .amo-html-boot {
        color: #3976a9;
        background:
          radial-gradient(circle at 50% 42%, rgba(57, 118, 169, 0.08), transparent 34%),
          linear-gradient(145deg, rgba(246, 250, 248, 0.99), rgba(237, 245, 242, 0.99)),
          #f1f7f5;
      }

      :root[data-amo-theme="light"] .amo-html-boot-spinner {
        border-color: rgba(57, 118, 169, 0.18);
        border-top-color: #3976a9;
      }

      :root[data-amo-theme="light"] .amo-html-boot strong {
        color: #203a32;
      }

      :root[data-amo-theme="light"] .amo-html-boot span {
        color: #6a7e77;
      }

      @keyframes amo-html-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="amo-html-boot" role="status" aria-live="polite">
        <div class="amo-html-boot-spinner" aria-hidden="true"></div>
        <strong>Opening AMO</strong>
        <span>Loading window interface</span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
