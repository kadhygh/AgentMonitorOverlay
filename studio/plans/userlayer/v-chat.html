<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消息列表 · userlayer 原型</title>
<style>
/*@amo-style*/
/* Claude 风格 · 单文件 HTML 基础样式
   用法：整段内联进 <style>，之后只追加本页专用样式。
   来源：2026-10-26 AIWork HTML 展示（推进总览 / 方案图解）。图表系列色 --s1..--s3 已过色盲与对比度校验（浅 / 深两套）。
   深色切换：<button class="theme" onclick="toggleTheme()">切换深浅色</button>
   function toggleTheme(){const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark'} */

/* ---------- 变量 ---------- */
:root{color-scheme:light;--bg:#faf9f5;--surface:#ffffff;--surface-2:#f0eee6;--line:#e8e6dc;--text:#141413;--text-2:#5e5d59;--text-3:#87867f;--accent:#c96442;--accent-fill:#d97757;--accent-soft:#f6e9e1;--good:#2e7d5b;--good-soft:#e5efe8;--warn:#c28a1e;--warn-soft:#f6ecd6;--crit:#b5443a;--crit-soft:#f5e1dd;--neutral:#b0aea5;--code:#f0eee6;--s1:#d97757;--s2:#4a86c8;--s3:#5e8c3a;--lane-v:#f5f3ec;--lane-l:#f8eee8;--tip-bg:#141413;--tip-fg:#faf9f5;--shadow:0 1px 2px rgba(20,20,19,.04),0 6px 18px rgba(20,20,19,.04);--serif:"Tiempos Text","Noto Serif SC","Source Han Serif SC",Georgia,serif;--sans:"Styrene B",Inter,"Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;--mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:30px 28px 80px}
nav.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3);margin-bottom:30px}
nav.top a{color:var(--text-2);text-decoration:none}
nav.top a:hover{color:var(--accent)}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:8px;padding:5px 12px;font-size:13px}
.theme:hover{border-color:var(--accent-fill)}
h1{font:500 31px/1.3 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
h1 code{font-size:.66em;vertical-align:4px}
h2{font:500 22px/1.4 var(--serif);margin:52px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font:400 13px var(--sans);color:var(--text-3)}
h3{font:500 17px/1.4 var(--serif);margin:0 0 8px}
.lead{color:var(--text-2);margin:0 0 16px;font:15.5px/1.75 var(--serif)}
code{font-family:var(--mono);font-size:.84em;background:var(--code);padding:1px 6px;border-radius:5px;color:var(--text);word-break:break-word}
a{color:var(--accent)}
footer{margin-top:56px;font-size:12.5px;color:var(--text-3);border-top:1px solid var(--line);padding-top:16px}

/* ---------- 容器 ---------- */
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card p,.prose{font-family:var(--serif)}
.prose{font-size:15px;line-height:1.8;color:var(--text-2)}
.prose li::marker{color:var(--accent-fill)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.twocol{grid-template-columns:1fr}}

/* 一句话结论：<div class="tldr"><b class="h">一句话结论</b><ul><li>…</li></ul></div> */
.tldr{margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 26px;box-shadow:var(--shadow);font:16px/1.8 var(--serif)}
.tldr b.h{display:block;font:600 12px var(--sans);letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.tldr ul{margin:0;padding-left:20px}
.tldr li{margin:5px 0}
.tldr li::marker{color:var(--accent-fill)}
.tldr code{font-size:.78em}

/* 标签：<span class="pill good"><span class="dot" style="background:var(--good)"></span>✓ 已完成</span> */
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.pill.good{background:var(--good-soft);color:var(--text)}
.pill.warn{background:var(--warn-soft);color:var(--text)}
.pill.crit{background:var(--crit-soft);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* 数字卡片：<div class="tiles"><div class="tile"><div class="k">标签</div><div class="v">68<small> 项</small></div><div class="d">说明</div></div></div> */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--text-3)}
.tile .v{font:500 34px/1.15 var(--serif);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .v small{font:400 14px var(--sans);color:var(--text-3);margin-left:2px}
.tile .d{font-size:12px;color:var(--text-3);line-height:1.5}

/* 时间线：<ol class="tl"><li><span class="node">✓</span><details class="stage"><summary><div class="sname">P1 标题<span>副标题</span></div><div class="sone">一句话</div><div><span class="commit">abc1234</span><span class="chev">▸</span></div></summary><div class="sbody">…</div></details></li></ol>
   节点：.node（完成）/ .node.warn（停过或待处理）/ .node.todo（未开始） */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:1.5px;background:var(--line)}
.tl li{position:relative;padding-left:42px;margin-bottom:10px}
.tl .node{position:absolute;left:3px;top:15px;width:22px;height:22px;border-radius:50%;background:var(--good);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700;box-shadow:0 0 0 4px var(--bg)}
.tl .node.warn{background:var(--warn)}
.tl .node.todo{background:var(--surface);border:1.5px solid var(--neutral);color:var(--text-3)}
details.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
details.stage>summary{list-style:none;cursor:pointer;padding:12px 18px;display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center}
details.stage>summary::-webkit-details-marker{display:none}
details.stage>summary:hover .sname{color:var(--accent)}
details.stage[open]>summary{border-bottom:1px solid var(--line)}
@media (max-width:820px){details.stage>summary{grid-template-columns:1fr}}
.sname{font:500 16px/1.35 var(--serif)}
.sname span{display:block;font:400 12px var(--sans);color:var(--text-3);margin-top:2px}
.sone{color:var(--text-2);font-size:14px;line-height:1.6}
.commit{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.commit.none{color:var(--text-3);background:var(--surface-2)}
.chev{display:inline-block;transition:transform .15s;color:var(--text-3);margin-left:8px}
details[open] .chev{transform:rotate(90deg)}
.sbody{padding:12px 22px 16px;font:15px/1.75 var(--serif);color:var(--text-2)}
.sbody ul{margin:0;padding-left:18px}
.sbody li{margin:4px 0}
.sbody li::marker{color:var(--accent-fill)}
.sbody b{color:var(--text);font-weight:600}
.sbody code{font-size:.8em}

/* 折叠块：<details class="fold"><summary>展开 8 条</summary>…</details> */
details.fold>summary{cursor:pointer;color:var(--accent);font-size:14px}

/* ---------- 表格 / 图例 / 提示 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--text-3);font-weight:500;font-size:12.5px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.s-ico{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.hatch{background:repeating-linear-gradient(45deg,var(--neutral) 0 2px,transparent 2px 6px);border:1px solid var(--neutral)}
.tip{position:fixed;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;line-height:1.55;padding:8px 11px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;max-width:290px}

/* ---------- 控件 ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 13px;font-size:13.5px}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;color:var(--text-2);font-size:13.5px}
.chips button.on{border-color:var(--accent-fill);background:var(--accent-soft);color:var(--text)}

/* ---------- 流程图（内联 SVG） ---------- */
svg text{font-family:var(--sans)}
.node-g{cursor:pointer}
.node-g rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:stroke .15s}
.node-g:hover rect,.node-g.sel rect{stroke:var(--accent-fill);stroke-width:2.2}
.node-g .t{font-size:13px;font-weight:600;fill:var(--text)}
.node-g .s{font-size:11px;fill:var(--text-3)}
.node-g.bad rect{stroke:var(--crit);stroke-dasharray:5 4;fill:var(--crit-soft)}
.edge{fill:none;stroke:var(--text-3);stroke-width:1.5}
.elab{font-size:11px;fill:var(--text-2)}

/* 风险卡：<div class="risks"><div class="risk"><b>标题</b><p>说明</p><div class="m">缓解</div></div></div> */
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.risk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.risk b{display:block;margin-bottom:6px;font:500 16px var(--serif)}
.risk p{margin:0;font:14.5px/1.75 var(--serif);color:var(--text-2)}
.risk .m{font-size:12.5px;color:var(--text-3);margin-top:8px}

/*@/amo-style*/
/* ---- 本页专用样式：消息列表 ---- */
:root{--c-purple:#8a6fb8;--chat-bg:#f3f1ea;--bub-in:#ffffff;--bub-me:#f6e1d5;--bub-me-line:#ecc9b6;--sel:#ebe8de;--hl:rgba(217,119,87,.22)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--c-purple:#9a82c6;--chat-bg:#232321;--bub-in:#30302e;--bub-me:#4a3429;--bub-me-line:#5e4134;--sel:#3a3a37;--hl:rgba(224,139,107,.28)}}
:root[data-theme="dark"]{--c-purple:#9a82c6;--chat-bg:#232321;--bub-in:#30302e;--bub-me:#4a3429;--bub-me-line:#5e4134;--sel:#3a3a37;--hl:rgba(224,139,107,.28)}
html,body{height:100%}
body{overflow:hidden}
.app{display:grid;grid-template-columns:330px 1fr;height:100vh}
/* 左栏 */
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface);min-height:0}
.side-top{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.who{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.who b{font:500 17px var(--serif)}
.who button{border:0;background:none;color:var(--text-3);font-size:12.5px;padding:2px 4px}
.who button:hover{color:var(--accent)}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;padding:7px 30px 7px 11px;font:13.5px var(--sans);outline:none}
.search input:focus{border-color:var(--accent-fill)}
.search .x{position:absolute;right:6px;top:5px;border:0;background:none;color:var(--text-3);font-size:15px;display:none}
.search.on .x{display:block}
.list{flex:1;overflow-y:auto;min-height:0}
.conv{display:grid;grid-template-columns:44px 1fr auto;gap:0 11px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid transparent}
.conv:hover{background:var(--surface-2)}
.conv.sel{background:var(--sel)}
.conv .nm{font-size:14.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .nm small{font-size:11.5px;color:var(--text-3);margin-left:6px}
.conv .pv{grid-column:2;font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.conv.unread .pv{color:var(--text-2)}
.conv .tm{font-size:11.5px;color:var(--text-3);align-self:start;margin-top:3px;white-space:nowrap}
.conv .bd{grid-column:3;justify-self:end;min-width:19px;height:19px;border-radius:10px;background:var(--crit);color:#fff;font-size:11.5px;display:grid;place-items:center;padding:0 5px;font-weight:600}
.conv .dotnew{grid-column:3;justify-self:end;width:8px;height:8px;border-radius:50%;background:var(--accent-fill);margin-right:5px}
.conv.pin{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.conv.pin.sel{box-shadow:inset 3px 0 0 var(--accent-fill)}
.conv.pin .nm{font-weight:600}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font:500 18px var(--serif);grid-row:span 2;flex:none;position:relative}
.av.sm{width:34px;height:34px;border-radius:10px;font-size:15px}
.av.xs{width:22px;height:22px;border-radius:7px;font-size:11.5px;display:inline-grid;vertical-align:-6px}
.av .st{position:absolute;right:-3px;bottom:-3px;width:15px;height:15px;border-radius:50%;border:2px solid var(--surface);font:700 8.5px/11px var(--sans);text-align:center;color:#fff}
.av.grp{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;padding:4px;background:var(--surface-2);place-items:stretch}
.av.grp i{border-radius:4px;font:500 9.5px/1 var(--serif);font-style:normal;display:grid;place-items:center;color:#fff}
.sec{padding:10px 14px 4px;font-size:11.5px;color:var(--text-3);letter-spacing:.05em}
.res{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.res:hover{background:var(--surface-2)}
.res .rh{font-size:12px;color:var(--text-3);display:flex;gap:6px;align-items:center}
.res .rt{font-size:13px;color:var(--text-2);line-height:1.55;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:var(--hl);color:var(--text);border-radius:3px;padding:0 1px}
.side-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--text-3);line-height:1.5}
.side-foot button{border:0;background:none;color:var(--text-3);font-size:11px;padding:0;text-decoration:underline;text-underline-offset:2px}
/* 右侧聊天窗 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chat-bg);position:relative;overflow:hidden}
.head{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);min-height:62px}
.head .t{flex:1;min-width:0}
.head .t b{font:500 16.5px var(--serif);display:block;line-height:1.35}
.head .t span{font-size:12.5px;color:var(--text-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.tools .btn,.tools .theme{font-size:12.5px;padding:5px 11px}
.notice{margin:12px auto 0;max-width:720px;width:calc(100% - 40px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:13.5px/1.6 var(--serif);color:var(--text-2)}
.notice b{font:600 11.5px var(--sans);color:var(--accent);margin-right:8px;letter-spacing:.05em}
.msgs{flex:1;overflow-y:auto;padding:14px 0 30px;min-height:0;scroll-behavior:smooth}
.row{display:flex;gap:10px;padding:6px 24px;max-width:900px;margin:0 auto;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.row .body{max-width:min(560px,78%);display:flex;flex-direction:column;gap:4px}
.row.me .body{align-items:flex-end}
.row .from{font-size:11.5px;color:var(--text-3)}
.bub{background:var(--bub-in);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;font:14.5px/1.7 var(--serif);color:var(--text);box-shadow:var(--shadow);transition:box-shadow .3s,background .3s}
.row.me .bub{background:var(--bub-me);border-color:var(--bub-me-line);border-radius:14px 4px 14px 14px}
.bub .lab{display:block;font:500 11.5px var(--sans);color:var(--text-3);margin-bottom:2px}
.bub .lab .s{margin-left:6px}
.bub .more{display:block;margin-top:5px;font:12px var(--sans);color:var(--accent);cursor:pointer;border:0;background:none;padding:0}
.bub .note{display:block;margin-top:3px;color:var(--text-2);font-size:13.5px}
.bub p{margin:0}
.flash .bub,.flash .card{box-shadow:0 0 0 3px var(--hl),var(--shadow);background-image:linear-gradient(var(--hl),var(--hl))}
.quote{display:block;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 8px 8px 0;padding:5px 10px;margin-top:6px;font:12.5px/1.55 var(--sans);color:var(--text-2);cursor:pointer;text-align:left;width:100%;border-top:0;border-right:0;border-bottom:0}
.quote:hover{border-left-color:var(--accent-fill);color:var(--text)}
.quote .r{color:var(--accent);margin-right:6px;font-weight:500}
.quote .s{color:var(--text-3);margin-left:6px;white-space:nowrap}
.sys{text-align:center;padding:5px 24px;font-size:12px;color:var(--text-3)}
.sys span{display:inline-block;background:color-mix(in srgb,var(--neutral) 18%,transparent);border-radius:8px;padding:3px 11px;max-width:620px;line-height:1.6}
.sys.ok span{color:var(--good)}
.sys.work span{color:var(--s2)}
.tline{text-align:center;font-size:11.5px;color:var(--text-3);padding:10px 0 2px}
.newline{display:flex;align-items:center;gap:12px;max-width:860px;margin:10px auto;padding:0 24px;color:var(--accent);font-size:12px}
.newline::before,.newline::after{content:"";flex:1;height:1px;background:var(--accent-fill);opacity:.5}
/* 卡片消息 */
.card{background:var(--bub-in);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:0;overflow:hidden;box-shadow:var(--shadow);width:min(520px,100%);transition:box-shadow .3s}
.card.hi{border-color:var(--accent-fill)}
.card .ch{display:flex;gap:8px;align-items:center;padding:9px 14px;background:var(--accent-soft);font-size:12px;color:var(--text-2)}

<script>
/*@amo-lib*/
// userlayer 各表达共用的读写层（2026-11-01 原型）。
// 读 <script id="amo-data"> 里的 datalayer；人的操作记在 localStorage，所有表达共用一份，
// 所以在一种表达里回答了，换一种表达打开也能看到——这正是「表现随便换」要验证的。
window.AMO = (() => {
  const raw = JSON.parse(document.getElementById("amo-data").textContent);
  const KEY = "amo-userlayer:" + raw.context.id;
  const NOW = raw.now || "2026-11-01T08:30:00+08:00"; // 假数据的「现在」，让各表达的相对时间一致
  const subs = [];
  // 人的操作按假数据的「现在」往后排（第 n 次操作 = NOW + n 分钟），写成和数据一样的 +08:00 格式，
  // 这样字符串比较、排序、「上次以来」都和假数据对得上（B、C 组 11-01 的建议）
  function fakeNow(n) {
    const d = new Date(new Date(NOW).getTime() + n * 60000 + 8 * 3600000);
    return d.toISOString().slice(0, 19) + "+08:00";
  }

  const TYPE = {
    decision: { label: "决定", hint: "要你拍板" },
    question: { label: "问题", hint: "要你回答" },
    bug: { label: "bug", hint: "出错的地方" },
    finding: { label: "发现", hint: "值得注意" },
    task: { label: "事项", hint: "要做的事" },
    conclusion: { label: "结论", hint: "已经定了" },
    milestone: { label: "节点", hint: "发布、开工、交接" },
  };
  // 状态不能只靠颜色：每个都带符号和文字
  const STATUS = {
    needs_you: { label: "等你", sym: "!", color: "var(--accent-fill)", soft: "var(--accent-soft)" },
    working: { label: "进行中", sym: "◐", color: "var(--s2)", soft: "var(--surface-2)" },
    waiting: { label: "等别人", sym: "○", color: "var(--warn)", soft: "var(--warn-soft)" },
    settled: { label: "已定", sym: "✓", color: "var(--good)", soft: "var(--good-soft)" },
    parked: { label: "搁置", sym: "–", color: "var(--neutral)", soft: "var(--surface-2)" },
  };
  const REL = {
    depends: { out: "要等", in: "被它卡住的" },
    affects: { out: "会影响", in: "受它影响" },
    answers: { out: "回答了", in: "被回答" },
    supersedes: { out: "取代了", in: "被取代" },
    part_of: { out: "属于", in: "包含" },
  };
  const EVIDENCE = { file: "文件", commit: "提交", session: "会话", url: "网址", log: "记录" };
  const IMPORTANCE = { high: 3, normal: 2, low: 1 };

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { ops: [], seenAt: null }; } catch { return { ops: [], seenAt: null }; } };
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  let state = load();
  let data;

  function build() {
    data = JSON.parse(JSON.stringify(raw));
    // 0.2 的条目只写 at：补齐 0.1 的时间和重要程度字段，各表达不用分两套
    for (const i of data.items) { i.createdAt ||= i.at; i.updatedAt ||= i.at; i.importance ||= "normal"; i.evidence ||= []; }
    data.events ||= []; data.areas ||= []; data.links ||= [];
    if (state.seenAt) data.viewer.lastSeenAt = state.seenAt;
    for (const op of state.ops) applyOp(op);
  }
  function applyOp(op) {
    const it = data.items.find((i) => i.id === op.item);
    if (!it) return;
    const ev = { at: op.at, item: it.id, actor: "human", kind: op.kind, text: "" };
    if (op.kind === "answered") {
      const opt = it.ask.options.find((o) => o.id === op.option);
      it.ask.answer = { option: op.option, note: op.note || "", at: op.at };
      it.status = "working";
      it.owner = it.source;
      // 球交回提问的 agent：它的状态和在做的事跟着变
      const ag = data.agents.find((a) => a.id === it.source);
      if (ag) { ag.status = "running"; ag.item = it.id; ag.doing = `按你选的「${opt ? opt.label : op.option}」处理 #${it.num}`; }
      ev.text = `你选了「${opt ? opt.label : op.option}」${op.note ? "：" + op.note : ""}，交回${ownerName(it.source)}`;
    } else if (op.kind === "parked") {
      it.status = "parked"; it.owner = "human";
      ev.kind = "status"; ev.text = "你搁置了" + (op.note ? "：" + op.note : "");
    } else if (op.kind === "reopened") {
      const orig = raw.items.find((i) => i.id === it.id);
      it.status = orig.status === "parked" ? "needs_you" : orig.status; it.owner = orig.status === "parked" ? "human" : orig.owner;
      if (it.ask && orig.ask && !orig.ask.answer) { delete it.ask.answer; it.status = "needs_you"; it.owner = "human"; }
      ev.kind = "status"; ev.text = "你重新打开了";
    } else if (op.kind === "comment") {
      ev.text = "你批注：" + op.note;
    }
    it.updatedAt = op.at;
    data.events.push(ev);
  }
  function commit(op) {
    op.at = fakeNow(state.ops.length + 1);
    state.ops.push(op); save(); build(); emit();
  }
  const emit = () => subs.forEach((f) => f(data));

  // ---------- 查询 ----------
  const items = (pred) => data.items.filter(pred || (() => true));
  const item = (key) => data.items.find((i) => i.id === key || i.num === key || "#" + i.num === key);
  const agent = (id) => data.agents.find((a) => a.id === id);
  const area = (id) => data.areas.find((a) => a.id === id);
  function ownerName(owner) {
    if (!owner) return "";
    if (owner === "human") return "你";
    if (owner.startsWith("team:")) return owner.slice(5);
    const a = agent(owner); return a ? a.name : owner;
  }
  // 站在当前这一条说话：「要先等 #5」「#10 在等这条」，比 label 的「被它卡住的」好懂（A 组 11-01 的建议）
  const SAY = {
    depends: { out: (n) => `要先等 #${n}`, in: (n) => `#${n} 在等这条` },
    affects: { out: (n) => `会影响 #${n}`, in: (n) => `#${n} 会影响这条` },
    answers: { out: (n) => `回答了 #${n}`, in: (n) => `#${n} 回答了这条` },
    supersedes: { out: (n) => `取代了 #${n}`, in: (n) => `#${n} 取代了这条` },
    part_of: { out: (n) => `属于 #${n}`, in: (n) => `#${n} 是这条的一部分` },
  };
  function links(id) {
    return {
      out: data.links.filter((l) => l.from === id).map((l) => ({ ...l, item: item(l.to), label: REL[l.rel].out, say: SAY[l.rel].out(item(l.to).num) })),
      in: data.links.filter((l) => l.to === id).map((l) => ({ ...l, item: item(l.from), label: REL[l.rel].in, say: SAY[l.rel].in(item(l.from).num) })),
    };
  }
  const lastSeen = () => data.viewer.lastSeenAt;
  // 「上次以来」只算 agent 那边的变化，人自己的操作不算
  const isNew = (it) => { const r = raw.items.find((i) => i.id === it.id) || it; return (r.updatedAt || r.at) > lastSeen(); };
  const changesSince = (t) => data.events.filter((e) => e.at > (t || lastSeen())).sort((a, b) => a.at.localeCompare(b.at));
  const byWeight = (a, b) => IMPORTANCE[b.importance] - IMPORTANCE[a.importance] || a.createdAt.localeCompare(b.createdAt);
  const needsYou = () => items((i) => i.status === "needs_you").sort(byWeight);
  function counts() {
    const c = { total: data.items.length };
    for (const s of Object.keys(STATUS)) c[s] = data.items.filter((i) => i.status === s).length;
    return c;
  }

  // ---------- 文字 ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/#(\d+)/g, '<a href="#" class="amo-ref" data-num="$1">#$1</a>');
  }
  function md(text) {
    if (!text) return "";
    return text.split(/\n{2,}/).map((p) => {
      const lines = p.split("\n");
      if (lines.every((l) => /^\s*[-*] /.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";
    }).join("");
  }
  function fmtTime(iso) {
    const d = new Date(iso), now = new Date(NOW);
    const hm = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Shanghai" });
    const day = (x) => x.toLocaleDateString("zh-CN", { timeZone: "Asia/Shanghai" });
    if (day(d) === day(now)) return "今天 " + hm;
    if (day(new Date(d.getTime() + 864e5)) === day(now)) return "昨天 " + hm;
    return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit", timeZone: "Asia/Shanghai" }) + " " + hm;
  }
  function ago(iso) {
    const m = Math.round((new Date(NOW) - new Date(iso)) / 60000);
    if (m < 1) return "刚才"; if (m < 60) return m + " 分钟前";
    const h = Math.round(m / 60); return h < 24 ? h + " 小时前" : Math.round(h / 24) + " 天前";
  }

  // ---------- 外观 ----------
  function applyTheme() { const t = localStorage.getItem("amo-userlayer:theme"); if (t) document.documentElement.dataset.theme = t; }
  function toggleTheme() {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    localStorage.setItem("amo-userlayer:theme", r.dataset.theme);
  }
  function toast(msg) {
    let el = document.getElementById("amo-toast");
    if (!el) {
      el = document.createElement("div"); el.id = "amo-toast";
      el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-fg);padding:9px 16px;border-radius:10px;font:13.5px var(--sans);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none";
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity = 1;
    clearTimeout(el._t); el._t = setTimeout(() => (el.style.opacity = 0), 2200);
  }

  applyTheme();
  build();
  addEventListener("storage", (e) => { if (e.key === KEY) { state = load(); build(); emit(); } });

  return {
    raw, get data() { return data; }, NOW, TYPE, STATUS, REL, EVIDENCE, IMPORTANCE,
    items, item, agent, area, ownerName, links, lastSeen, isNew, changesSince, needsYou, counts, byWeight,
    esc, md, inline, fmtTime, ago, toggleTheme, toast,
    now: () => fakeNow(state.ops.length),
    // 各表达自己的布局（纸摆在哪、区画在哪），按表达分开存，人摆过的位置不会被别的表达改掉
    layout: (view, value) => { const k = "amo-userlayer:layout:" + view; if (value === undefined) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } } localStorage.setItem(k, JSON.stringify(value)); },
    on: (f) => { subs.push(f); return () => subs.splice(subs.indexOf(f), 1); },
    // 人的操作：都写成事件，球交回提问的 agent
    answer: (id, option, note) => { commit({ kind: "answered", item: id, option, note }); toast("已发回" + ownerName(item(id).source)); },
    park: (id, note) => { commit({ kind: "parked", item: id, note }); toast("已搁置 #" + item(id).num); },
    reopen: (id) => { commit({ kind: "reopened", item: id }); toast("已重新打开 #" + item(id).num); },
    comment: (id, note) => { commit({ kind: "comment", item: id, note }); toast("批注已记下，整理员会归档"); },
    markSeen: () => { state.seenAt = fakeNow(state.ops.length + 1); save(); build(); emit(); toast("已标为看过"); },
    reset: () => { state = { ops: [], seenAt: null }; save(); build(); emit(); toast("已恢复成初始假数据"); },
  };
})();

/*@/amo-lib*/
</script>
<script>
// 消息列表：每个 agent 是一个联系人，条目按时间排成它发来的消息；要你拍板的是卡片消息。
// 消息由 events 推出来：created → 文字气泡或卡片，status → agent 的话，concluded/搁置 → 居中的系统消息。
const E = AMO.esc;
const AV = {
  duty: { ch: "值", c: "var(--s2)" }, iter: { ch: "维", c: "var(--s3)" }, android: { ch: "安", c: "var(--s1)" },
  curator: { ch: "整", c: "var(--c-purple)" }, presenter: { ch: "表", c: "var(--neutral)" },
  "team:测试同事": { ch: "测", c: "var(--warn)" }, human: { ch: "你", c: "var(--text-2)" },
};
const ORDER = ["group", "duty", "iter", "android", "curator", "team:测试同事"];
const ui = { sel: "pin", q: "", flash: null, detail: null, notes: {} };

const T = (iso) => new Date(iso).getTime();
function shortTime(m) {
  if (m.op) return "刚刚";
  const s = AMO.fmtTime(m.at);
  return s.startsWith("今天 ") ? s.slice(3) : s;
}
function avatar(id, cls = "") {
  if (id === "group") return `<div class="av grp ${cls}">${["duty", "iter", "android", "curator"].map((a) => `<i style="background:${AV[a].c}">${AV[a].ch}</i>`).join("")}</div>`;
  const a = AV[id] || { ch: "?", c: "var(--neutral)" };
  const ag = AMO.agent(id);
  let st = "";
  if (ag && !cls.includes("xs")) {
    const m = ag.status === "running" ? ["◐", "var(--s2)"] : ag.status === "waiting" ? ["!", "var(--accent-fill)"] : null;
    if (m) st = `<span class="st" style="background:${m[1]}" title="${ag.status === "running" ? "在跑" : "在等"}">${m[0]}</span>`;
  }
  return `<div class="av ${cls}" style="background:${a.c}">${a.ch}${st}</div>`;
}
const convName = (id) => id === "group" ? AMO.data.context.title : id === "pin" ? "等你回复" : AMO.ownerName(id);
const stTag = (it) => { const s = AMO.STATUS[it.status]; return `<span style="color:${s.color}">${s.sym} ${s.label}</span>`; };
const typeNum = (it) => `${AMO.TYPE[it.type].label} #${it.num}`;

// ---------- 由 events 推出每个会话的消息 ----------
function build() {
  const d = AMO.data;
  const convs = Object.fromEntries(ORDER.map((k) => [k, []]));
  const home = {};
  const nRaw = AMO.raw.events.length;
  // 人刚做的操作排在假数据之后（假数据的「现在」是 08:30，真实时钟可能更早）
  const evs = d.events.map((e, i) => ({ ...e, op: i >= nRaw, i })).sort((a, b) => (a.op - b.op) || (a.op ? a.i - b.i : T(a.at) - T(b.at)));
  const seen = T(AMO.lastSeen());
  const add = (cid, m) => { m.isNew = !m.op && T(m.at) > seen; m.mid = cid + ":" + convs[cid].length; convs[cid].push(m); return m; };
  for (const ev of evs) {
    const it = ev.item && AMO.item(ev.item);
    const base = { at: ev.at, op: ev.op };
    if (!it) { add("group", { ...base, kind: "text", from: ev.actor, text: ev.text }); continue; }
    if (ev.actor !== "human") {
      const cid = convs[ev.actor] ? ev.actor : "group";
      if (ev.kind === "created") {
        home[it.id] = cid;
        add(cid, { ...base, kind: it.ask ? "card" : "text", from: ev.actor, item: it, text: it.summary, created: true });
        if (it.owner.startsWith("team:") && convs[it.owner]) {
          add(it.owner, { ...base, kind: "fwd", from: ev.actor, item: it, text: it.body || it.summary });
          if (it.status === "waiting") add(it.owner, { ...base, kind: "sys", cls: "", text: `○ 等${AMO.ownerName(it.owner)}回复 #${it.num}（已 ${AMO.ago(ev.at).replace("前", "")}）` });
        }
      } else if (ev.kind === "concluded") {
        add(cid, { ...base, kind: "sys", cls: "ok", text: `✓ #${it.num} 已定：${it.conclusion || ev.text}` });
        add("group", { ...base, kind: "sys", cls: "ok", text: `✓ #${it.num} 已定 · ${AMO.ownerName(ev.actor)}：${ev.text}` });
      } else {
        add(cid, { ...base, kind: "text", from: ev.actor, item: it, text: ev.text, quote: home[it.id] !== cid });
      }
    } else {
      const cid = home[it.id] || (convs[it.source] ? it.source : "group");
      const opt = it.ask && it.ask.answer && it.ask.options.find((o) => o.id === (ev.kind === "answered" ? it.ask.answer.option : ""));
      if (ev.kind === "answered") {
        const raw = AMO.raw.items.find((x) => x.id === it.id);
        const a = ev.op ? it.ask.answer : raw.ask.answer;
        const o = it.ask.options.find((x) => x.id === a.option);
        add(cid, { ...base, kind: "me", item: it, text: "选：" + (o ? o.label : a.option), note: a.note });
        if (ev.op) add(cid, { ...base, kind: "sys", cls: "work", text: `${AMO.ownerName(it.source)} 已收到，在处理 ◐` });
        add("group", { ...base, kind: "sys", text: `你回答了 #${it.num}：${o ? o.label : ""}，交回${AMO.ownerName(it.source)}` });
      } else if (ev.kind === "comment") {
        add(cid, { ...base, kind: "me", item: it, text: ev.text.replace(/^你批注：/, "批注：") });
        add(cid, { ...base, kind: "sys", text: "整理员会把这条批注归档" });
      } else {
        const t = ev.text.startsWith("你搁置了") ? `– 你搁置了 #${it.num}${ev.text.slice(4)}` : `你重新打开了 #${it.num}`;
        add(cid, { ...base, kind: "sys", text: t });
        add("group", { ...base, kind: "sys", text: t });
      }
    }
  }
  return { convs, home };
}
let M;

// ---------- 左栏 ----------
function lastMsg(list) { return list[list.length - 1]; }
function preview(m) {
  if (!m) return "";
  if (m.kind === "card") return `[要你拍板] ${m.item.title}`;
  if (m.kind === "me") return "你：" + m.text;
  if (m.kind === "fwd") return `${AMO.ownerName(m.from)}代你问：${m.item.title}`;
  if (m.kind === "sys") return m.text;
  return (m.from && m.from !== "curator" && M.convs.group.includes(m) ? AMO.ownerName(m.from) + "：" : "") + m.text;
}
const pending = (cid) => M.convs[cid].filter((m) => m.kind === "card" && m.item.status === "needs_you").length;
function renderList() {
  const el = document.getElementById("list");
  if (ui.q) { el.innerHTML = renderResults(); return; }
  const ny = AMO.needsYou();
  const top = ny[0];
  let h = `<div class="conv pin ${ui.sel === "pin" ? "sel" : ""}" data-conv="pin">
    <div class="av" style="background:var(--accent-fill)">!</div>
    <div class="nm">等你回复（${ny.length}）</div><div class="tm">置顶</div>
    <div class="pv">${top ? "最要紧：" + E(top.title) : "都回完了"}</div>${ny.length ? `<div class="bd">${ny.length}</div>` : ""}</div>`;
  const rows = ORDER.map((cid) => ({ cid, last: lastMsg(M.convs[cid]) }));
  rows.sort((a, b) => !!(b.last && b.last.op) - !!(a.last && a.last.op) || (b.last ? T(b.last.at) : 0) - (a.last ? T(a.last.at) : 0));
  for (const { cid, last } of rows) {
    const n = pending(cid), nw = M.convs[cid].some((m) => m.isNew);
    const tag = cid === "group" ? "群" : cid.startsWith("team:") ? "同事" : AMO.agent(cid).model;
    h += `<div class="conv ${ui.sel === cid ? "sel" : ""} ${nw ? "unread" : ""}" data-conv="${cid}">${avatar(cid)}
      <div class="nm">${E(convName(cid))}<small>${E(tag)}</small></div><div class="tm">${last ? shortTime(last).replace(/^昨天 .*/, "昨天") : ""}</div>
      <div class="pv">${E(preview(last))}</div>${n ? `<div class="bd" title="${n} 件等你回">${n}</div>` : nw ? `<div class="dotnew" title="有新消息"></div>` : ""}</div>`;
  }
  el.innerHTML = h;
}
function renderResults() {
  const q = ui.q.toLowerCase();
  const hits = [];
  for (const cid of ORDER) for (const m of M.convs[cid]) {
    const txt = [m.text, m.note, m.item && m.item.title, m.item && "#" + m.item.num, m.item && m.item.ask && m.item.ask.question].filter(Boolean).join(" ");
    if (txt.toLowerCase().includes(q)) hits.push({ cid, m, txt });
  }
  const mark = (s) => E(s).replace(new RegExp(ui.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (x) => `<mark>${x}</mark>`);
  if (!hits.length) return `<div class="sec">没有找到「${E(ui.q)}」</div>`;
  return `<div class="sec">${hits.length} 条消息</div>` + hits.map(({ cid, m }) => {
    const body = m.item && m.kind === "card" ? m.item.title + "：" + m.item.ask.question : (m.item && m.kind === "text" && m.created ? m.item.title + "：" : "") + m.text + (m.note ? "（" + m.note + "）" : "");
    return `<div class="res" data-conv="${cid}" data-mid="${m.mid}"><div class="rh">${avatar(cid === "group" ? (m.from || "curator") : cid, "xs")}${E(convName(cid))} · ${shortTime(m)}</div><div class="rt">${mark(body)}</div></div>`;
  }).join("");
}

// ---------- 聊天窗 ----------
function renderHead() {
  const cid = ui.sel, el = document.getElementById("head");
  let av, sub;
  if (cid === "pin") {
    av = `<div class="av sm" style="background:var(--accent-fill)">!</div>`;
    sub = "所有要你拍板的事，最要紧的在最上面";
  } else if (cid === "group") {
    av = avatar("group", "sm");
    sub = "群 · 值守、维护迭代、安卓任务、整理员、表达员、你";
  } else if (cid.startsWith("team:")) {
    av = avatar(cid, "sm");
    const w = AMO.items((i) => i.owner === cid && i.status === "waiting");
    sub = `团队里的人 · 我们在等对方回 ${w.length} 件：${w.map((i) => "#" + i.num).join("、")}`;
  } else {
    const ag = AMO.agent(cid);
    av = avatar(cid, "sm");
    const asking = pending(cid);
    const state = asking ? `! 有 ${asking} 件等你回` : ag.status === "running" ? "◐ 在跑" : ag.status === "waiting" ? "○ 在等" : "空闲";
    sub = `${ag.model} · ${state} · ${doingOf(ag)}`;
  }
  el.innerHTML = `${av}<div class="t"><b>${E(convName(cid))}</b><span>${E(sub)}</span></div>
    <div class="tools"><a class="btn" href="index.html">← 全部表达</a><button class="theme" onclick="AMO.toggleTheme()">切换深浅色</button></div>`;
}
// agent 在干什么：人刚回答过它的问题时，就是在按回答处理
function doingOf(ag) {
  const back = AMO.items((i) => i.owner === ag.id && i.status === "working" && i.ask && i.ask.answer).pop();
  if (back && !AMO.raw.items.find((r) => r.id === back.id).ask.answer) {
    const o = back.ask.options.find((x) => x.id === back.ask.answer.option);
    return `按你选的「${o ? o.label : ""}」处理 #${back.num}`;
  }
  return ag.doing;
}
function quoteFor(it, rel) {
  return `<button class="quote" data-jump="${it.id}">${rel ? `<span class="r">${E(rel)}</span>` : ""}#${it.num} ${E(it.title)}<span class="s">${stTag(it)}</span></button>`;
}
function linkQuotes(it) {
  const L = AMO.links(it.id);
  return L.out.map((l) => quoteFor(l.item, l.label + (l.note ? "（" + l.note + "）" : ""))).join("");
}
function cardHTML(it, showFrom) {
  const a = it.ask, ans = a.answer, done = it.status !== "needs_you";
  const hi = it.importance === "high";
  const opts = a.options.map((o) => {
    const rec = o.id === a.recommend, chosen = ans && ans.option === o.id;
    return `<button class="opt ${rec ? "rec" : ""} ${chosen ? "chosen" : ""}" data-ans="${it.id}" data-opt="${o.id}" ${done ? "disabled" : ""}>
      <b>${chosen ? "✓ " : ""}${E(o.label)}</b>${rec ? `<span class="rt">推荐</span>` : chosen ? `<span class="rt">你选的</span>` : "<span></span>"}${o.detail ? `<small>${E(o.detail)}</small>` : ""}</button>${rec && !done ? `<div class="why">推荐理由：${E(a.why)}</div>` : ""}`;
  }).join("");
  let foot;
  if (it.status === "needs_you") foot = `<span class="state">${stTag(it)}</span><button class="btn" data-park="${it.id}">搁置</button><button class="btn" data-detail="${it.id}">看详情</button>`;
  else if (it.status === "parked") foot = `<span class="state">– 已搁置${it.conclusion ? "：" + E(it.conclusion) : ""}</span><button class="btn" data-reopen="${it.id}">重新打开</button><button class="btn" data-detail="${it.id}">看详情</button>`;
  else if (it.status === "settled") foot = `<span class="state ok">✓ 已定</span><button class="btn" data-detail="${it.id}">看详情</button>`;
  else foot = `<span class="state">已交回${E(AMO.ownerName(it.owner))} · ${stTag(it)}</span><button class="btn" data-detail="${it.id}">看详情</button>`;
  const note = ui.notes[it.id] || "";
  return `<div class="card ${hi && !done ? "hi" : ""} ${done ? "done" : ""}">
    <div class="ch"><span class="tp">${typeNum(it)}</span><span>${showFrom ? E(AMO.ownerName(it.source)) + " 提的 · " : ""}${AMO.TYPE[it.type].hint}</span>${hi && !done ? `<span class="imp">重要</span>` : ""}</div>
    <div class="cb"><div class="ct">${E(it.title)}</div><div class="cs">${AMO.inline(it.summary)}</div>
      ${it.status === "settled" && it.conclusion ? `<div class="concl">✓ ${E(it.conclusion)}</div>` : ""}
      <div class="cq">${E(a.question)}</div><div class="opts">${opts}</div>
      ${done ? "" : `<textarea data-note="${it.id}" placeholder="附一句话（可不填），选的时候一起发过去">${E(note)}</textarea>`}</div>
    <div class="cf">${foot}</div>
    ${linkQuotes(it) ? `<div class="cl">${linkQuotes(it)}</div>` : ""}</div>`;
}
function msgHTML(m, cid) {
  const it = m.item;
  if (m.kind === "sys") return `<div class="sys ${m.cls || ""}" data-mid="${m.mid}"><span>${AMO.inline(m.text)}</span></div>`;
  if (m.kind === "me") return `<div class="row me" data-mid="${m.mid}">${avatar("human", "sm")}<div class="body"><div class="bub">${it ? `<span class="lab">回复 #${it.num}</span>` : ""}${E(m.text)}${m.note ? `<span class="note">${E(m.note)}</span>` : ""}</div></div></div>`;
  if (m.kind === "fwd") return `<div class="row me" data-mid="${m.mid}">${avatar(m.from, "sm")}<div class="body"><div class="from">${E(AMO.ownerName(m.from))} 代你发 · ${shortTime(m)}</div><div class="bub"><span class="lab">${typeNum(it)} · ${E(it.title)}</span>${AMO.md(m.text)}${quoteFor(it, "原条目")}</div></div></div>`;
  const from = m.from;
  const showFrom = cid === "group" || cid === "pin";
  let inner;
  if (m.kind === "card") inner = cardHTML(it, cid === "pin");
  else inner = `<div class="bub">${it ? `<span class="lab">${typeNum(it)}${m.created ? " · " + E(it.title) : ""}<span class="s">${stTag(it)}</span></span>` : ""}${AMO.inline(m.text)}${m.quote && it ? quoteFor(it, "说的是") : ""}${m.created && it ? linkQuotes(it) : ""}${it ? `<button class="more" data-detail="${it.id}">看详情 ›</button>` : ""}</div>`;
  return `<div class="row" data-mid="${m.mid}">${avatar(from, "sm")}<div class="body"><div class="from">${showFrom ? E(AMO.ownerName(from)) + " · " : ""}${shortTime(m)}</div>${inner}</div></div>`;
}
function renderMsgs(keepScroll) {
  const el = document.getElementById("msgs"), cid = ui.sel;
  const prev = el.scrollTop;
  const nt = document.getElementById("notice");
  nt.innerHTML = cid === "group" ? `<div class="notice"><b>群公告</b>${E(AMO.data.context.goal)}</div>` : "";
  let h = "";
  if (cid === "pin") {
    const ny = AMO.needsYou();
    if (!ny.length) {
      const back = AMO.items((i) => i.ask && i.ask.answer && !AMO.raw.items.find((r) => r.id === i.id).ask.answer);
      h = `<div class="empty"><b>✓ 都回完了</b>${back.length ? "刚交回去的：" + back.map((i) => `#${i.num} → ${E(AMO.ownerName(i.owner))}（${stTag(i)}）`).join("，") : "现在没有等你拍板的事。"}</div>`;
    } else {
      h = ny.map((it) => {
        const cidH = M.home[it.id];
        return `<div class="row" data-mid="pin:${it.id}">${avatar(it.source, "sm")}<div class="body"><div class="from">${E(AMO.ownerName(it.source))} · ${shortTime({ at: it.createdAt })} · <a href="#" data-goconv="${cidH}" data-gomid="${it.id}">去${E(convName(cidH))}的对话</a>${AMO.isNew(it) ? " · 新" : ""}</div>${cardHTML(it, true)}</div></div>`;
      }).join("");
    }
  } else {
    let lastDay = "", newDone = false;
    for (const m of M.convs[cid]) {
      const day = m.op ? "刚刚" : AMO.fmtTime(m.at).split(" ")[0];
      if (m.isNew && !newDone) { h += `<div class="newline">以下是新消息</div>`; newDone = true; }
      if (day !== lastDay) { h += `<div class="tline">${day === "今天" || day === "昨天" || day === "刚刚" ? day : day}${m.op ? "" : " " + AMO.fmtTime(m.at).split(" ")[1]}</div>`; lastDay = day; }
      h += msgHTML(m, cid);
    }
    if (!M.convs[cid].length) h = `<div class="empty">还没有消息</div>`;
  }
  el.innerHTML = h;
  if (ui.toBottom) { ui.toBottom = false; el.scrollTop = el.scrollHeight; }
  else if (keepScroll) el.scrollTop = prev;
  else el.style.scrollBehavior = "auto", el.scrollTop = cid === "pin" ? 0 : el.scrollHeight, el.style.scrollBehavior = "";
}
function renderDrawer() {
  const dr = document.getElementById("drawer");
  const it = ui.detail && AMO.item(ui.detail);
  dr.classList.toggle("open", !!it);
  if (!it) return;
  document.getElementById("dtitle").textContent = `${typeNum(it)} · ${AMO.isNew(it) ? "上次以来有变化" : "详情"}`;
  const L = AMO.links(it.id);
  const lk = [...L.out, ...L.in].map((l) => quoteFor(l.item, l.label + (l.note ? "（" + l.note + "）" : ""))).join("");
  const hist = AMO.data.events.filter((e) => e.item === it.id).map((e) => `<div><time>${AMO.fmtTime(e.at).replace("今天 ", "").replace(/^\d\d\/\d\d /, "")}</time><span>${E(AMO.ownerName(e.actor))}：${E(e.text)}</span></div>`).join("");
  const imp = { high: "重要", normal: "一般", low: "不急" }[it.importance];
  let ask = "";
  if (it.ask) {
    const ans = it.ask.answer, o = ans && it.ask.options.find((x) => x.id === ans.option);
    ask = `<h4>要你拍板</h4><div class="ansd"><b>${E(it.ask.question)}</b><br>${ans ? `你选了「${E(o ? o.label : ans.option)}」${ans.note ? "：" + E(ans.note) : ""}` : `推荐「${E(it.ask.options.find((x) => x.id === it.ask.recommend).label)}」：${E(it.ask.why)}`}</div>`;
  }
  document.getElementById("dbody").innerHTML = `
    <div class="pills"><span class="pill" style="background:${AMO.STATUS[it.status].soft}">${stTag(it)}</span><span class="pill">${imp}</span><span class="pill">${E(AMO.area(it.area).name)}</span></div>
    <h3>${E(it.title)}</h3><p class="sum">${AMO.inline(it.summary)}</p>
    <div class="kv"><span>谁提的</span><span>${E(AMO.ownerName(it.source))}</span><span>现在在谁手里</span><span>${E(AMO.ownerName(it.owner))}</span><span>最后变化</span><span>${AMO.fmtTime(it.updatedAt)}</span></div>
    ${it.body ? `<h4>全文</h4><div class="bodytxt">${AMO.md(it.body)}</div>` : ""}
    ${it.conclusion ? `<h4>${it.status === "parked" ? "搁置时说的" : "结论"}</h4><div class="concl">${E(it.conclusion)}</div>` : ""}
    ${ask}
    <h4>证据</h4>${it.evidence.length ? it.evidence.map((v) => `<div class="ev"><span class="k">${AMO.EVIDENCE[v.kind]}</span><code>${E(v.ref)}</code><span class="n">${E(v.note)}</span></div>`).join("") : `<div class="hist">还没有</div>`}
    <h4>关联</h4>${lk || `<div class="hist">没有</div>`}
    <h4>经过</h4><div class="hist">${hist}</div>`;
}
function render(keep) {
  M = build();
  renderList(); renderHead(); renderMsgs(keep); renderDrawer();
  if (ui.flash) flashIt();
}
function flashIt() {
  const el = document.querySelector(`[data-mid="${ui.flash}"]`);
  ui.flash = null;
  if (!el) return;
  el.scrollIntoView({ block: "center" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1800);
}
// 跳到条目：打开它所在的会话，高亮那条消息
function jump(id) {
  const it = AMO.item(id);
  if (!it) return;
  ui.sel = M.home[it.id] || "group";
  const m = M.convs[ui.sel].find((x) => x.item && x.item.id === it.id && x.created) || M.convs[ui.sel].find((x) => x.item && x.item.id === it.id);
  ui.flash = m ? m.mid : null;
  if (ui.detail) ui.detail = it.id;
  ui.q = ""; document.getElementById("q").value = ""; document.getElementById("sbox").classList.remove("on");
  render();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-conv],[data-jump],[data-ans],[data-park],[data-reopen],[data-detail],[data-goconv],.amo-ref");
  if (!t) return;
  e.preventDefault();
  if (t.classList.contains("amo-ref")) { const it = AMO.item(+t.dataset.num); if (it) jump(it.id); return; }
  if (t.dataset.mid && t.dataset.conv) { ui.sel = t.dataset.conv; ui.flash = t.dataset.mid; ui.q = ""; document.getElementById("q").value = ""; document.getElementById("sbox").classList.remove("on"); render(); return; }
  if (t.dataset.conv) { ui.sel = t.dataset.conv; ui.detail = null; render(); return; }
  if (t.dataset.goconv) { jump(t.dataset.gomid); return; }
  if (t.dataset.jump) { jump(t.dataset.jump); return; }
  if (t.dataset.ans) { const id = t.dataset.ans; ui.toBottom = ui.sel !== "pin"; AMO.answer(id, t.dataset.opt, (ui.notes[id] || "").trim()); delete ui.notes[id]; return; }
  if (t.dataset.park) { const id = t.dataset.park; AMO.park(id, (ui.notes[id] || "").trim()); delete ui.notes[id]; return; }
  if (t.dataset.reopen) { AMO.reopen(t.dataset.reopen); return; }
  if (t.dataset.detail) { ui.detail = t.dataset.detail; renderDrawer(); return; }
});
document.addEventListener("input", (e) => { if (e.target.dataset.note) ui.notes[e.target.dataset.note] = e.target.value; });
document.getElementById("dclose").onclick = () => { ui.detail = null; renderDrawer(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { ui.detail = null; renderDrawer(); } });
document.getElementById("seen").onclick = () => AMO.markSeen();
const q = document.getElementById("q");
q.addEventListener("input", () => { ui.q = q.value.trim(); document.getElementById("sbox").classList.toggle("on", !!ui.q); renderList(); });
document.getElementById("qx").onclick = () => { q.value = ""; ui.q = ""; document.getElementById("sbox").classList.remove("on"); renderList(); };
AMO.on(() => render(true));
render();
</script>
</body>
</html>
