<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lane 地图 · userlayer 原型</title>
<style>
/*@amo-style*/
/* Claude 风格 · 单文件 HTML 基础样式
   用法：整段内联进 <style>，之后只追加本页专用样式。
   来源：2026-10-26 AIWork HTML 展示（推进总览 / 方案图解）。图表系列色 --s1..--s3 已过色盲与对比度校验（浅 / 深两套）。
   深色切换：<button class="theme" onclick="toggleTheme()">切换深浅色</button>
   function toggleTheme(){const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark'} */

/* ---------- 变量 ---------- */
:root{color-scheme:light;--bg:#faf9f5;--surface:#ffffff;--surface-2:#f0eee6;--line:#e8e6dc;--text:#141413;--text-2:#5e5d59;--text-3:#87867f;--accent:#c96442;--accent-fill:#d97757;--accent-soft:#f6e9e1;--good:#2e7d5b;--good-soft:#e5efe8;--warn:#c28a1e;--warn-soft:#f6ecd6;--crit:#b5443a;--crit-soft:#f5e1dd;--neutral:#b0aea5;--code:#f0eee6;--s1:#d97757;--s2:#4a86c8;--s3:#5e8c3a;--lane-v:#f5f3ec;--lane-l:#f8eee8;--tip-bg:#141413;--tip-fg:#faf9f5;--shadow:0 1px 2px rgba(20,20,19,.04),0 6px 18px rgba(20,20,19,.04);--serif:"Tiempos Text","Noto Serif SC","Source Han Serif SC",Georgia,serif;--sans:"Styrene B",Inter,"Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;--mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:30px 28px 80px}
nav.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3);margin-bottom:30px}
nav.top a{color:var(--text-2);text-decoration:none}
nav.top a:hover{color:var(--accent)}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:8px;padding:5px 12px;font-size:13px}
.theme:hover{border-color:var(--accent-fill)}
h1{font:500 31px/1.3 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
h1 code{font-size:.66em;vertical-align:4px}
h2{font:500 22px/1.4 var(--serif);margin:52px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font:400 13px var(--sans);color:var(--text-3)}
h3{font:500 17px/1.4 var(--serif);margin:0 0 8px}
.lead{color:var(--text-2);margin:0 0 16px;font:15.5px/1.75 var(--serif)}
code{font-family:var(--mono);font-size:.84em;background:var(--code);padding:1px 6px;border-radius:5px;color:var(--text);word-break:break-word}
a{color:var(--accent)}
footer{margin-top:56px;font-size:12.5px;color:var(--text-3);border-top:1px solid var(--line);padding-top:16px}

/* ---------- 容器 ---------- */
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card p,.prose{font-family:var(--serif)}
.prose{font-size:15px;line-height:1.8;color:var(--text-2)}
.prose li::marker{color:var(--accent-fill)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.twocol{grid-template-columns:1fr}}

/* 一句话结论：<div class="tldr"><b class="h">一句话结论</b><ul><li>…</li></ul></div> */
.tldr{margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 26px;box-shadow:var(--shadow);font:16px/1.8 var(--serif)}
.tldr b.h{display:block;font:600 12px var(--sans);letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.tldr ul{margin:0;padding-left:20px}
.tldr li{margin:5px 0}
.tldr li::marker{color:var(--accent-fill)}
.tldr code{font-size:.78em}

/* 标签：<span class="pill good"><span class="dot" style="background:var(--good)"></span>✓ 已完成</span> */
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.pill.good{background:var(--good-soft);color:var(--text)}
.pill.warn{background:var(--warn-soft);color:var(--text)}
.pill.crit{background:var(--crit-soft);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* 数字卡片：<div class="tiles"><div class="tile"><div class="k">标签</div><div class="v">68<small> 项</small></div><div class="d">说明</div></div></div> */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--text-3)}
.tile .v{font:500 34px/1.15 var(--serif);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .v small{font:400 14px var(--sans);color:var(--text-3);margin-left:2px}
.tile .d{font-size:12px;color:var(--text-3);line-height:1.5}

/* 时间线：<ol class="tl"><li><span class="node">✓</span><details class="stage"><summary><div class="sname">P1 标题<span>副标题</span></div><div class="sone">一句话</div><div><span class="commit">abc1234</span><span class="chev">▸</span></div></summary><div class="sbody">…</div></details></li></ol>
   节点：.node（完成）/ .node.warn（停过或待处理）/ .node.todo（未开始） */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:1.5px;background:var(--line)}
.tl li{position:relative;padding-left:42px;margin-bottom:10px}
.tl .node{position:absolute;left:3px;top:15px;width:22px;height:22px;border-radius:50%;background:var(--good);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700;box-shadow:0 0 0 4px var(--bg)}
.tl .node.warn{background:var(--warn)}
.tl .node.todo{background:var(--surface);border:1.5px solid var(--neutral);color:var(--text-3)}
details.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
details.stage>summary{list-style:none;cursor:pointer;padding:12px 18px;display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center}
details.stage>summary::-webkit-details-marker{display:none}
details.stage>summary:hover .sname{color:var(--accent)}
details.stage[open]>summary{border-bottom:1px solid var(--line)}
@media (max-width:820px){details.stage>summary{grid-template-columns:1fr}}
.sname{font:500 16px/1.35 var(--serif)}
.sname span{display:block;font:400 12px var(--sans);color:var(--text-3);margin-top:2px}
.sone{color:var(--text-2);font-size:14px;line-height:1.6}
.commit{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.commit.none{color:var(--text-3);background:var(--surface-2)}
.chev{display:inline-block;transition:transform .15s;color:var(--text-3);margin-left:8px}
details[open] .chev{transform:rotate(90deg)}
.sbody{padding:12px 22px 16px;font:15px/1.75 var(--serif);color:var(--text-2)}
.sbody ul{margin:0;padding-left:18px}
.sbody li{margin:4px 0}
.sbody li::marker{color:var(--accent-fill)}
.sbody b{color:var(--text);font-weight:600}
.sbody code{font-size:.8em}

/* 折叠块：<details class="fold"><summary>展开 8 条</summary>…</details> */
details.fold>summary{cursor:pointer;color:var(--accent);font-size:14px}

/* ---------- 表格 / 图例 / 提示 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--text-3);font-weight:500;font-size:12.5px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.s-ico{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.hatch{background:repeating-linear-gradient(45deg,var(--neutral) 0 2px,transparent 2px 6px);border:1px solid var(--neutral)}
.tip{position:fixed;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;line-height:1.55;padding:8px 11px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;max-width:290px}

/* ---------- 控件 ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 13px;font-size:13.5px}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;color:var(--text-2);font-size:13.5px}
.chips button.on{border-color:var(--accent-fill);background:var(--accent-soft);color:var(--text)}

/* ---------- 流程图（内联 SVG） ---------- */
svg text{font-family:var(--sans)}
.node-g{cursor:pointer}
.node-g rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:stroke .15s}
.node-g:hover rect,.node-g.sel rect{stroke:var(--accent-fill);stroke-width:2.2}
.node-g .t{font-size:13px;font-weight:600;fill:var(--text)}
.node-g .s{font-size:11px;fill:var(--text-3)}
.node-g.bad rect{stroke:var(--crit);stroke-dasharray:5 4;fill:var(--crit-soft)}
.edge{fill:none;stroke:var(--text-3);stroke-width:1.5}
.elab{font-size:11px;fill:var(--text-2)}

/* 风险卡：<div class="risks"><div class="risk"><b>标题</b><p>说明</p><div class="m">缓解</div></div></div> */
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.risk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.risk b{display:block;margin-bottom:6px;font:500 16px var(--serif)}
.risk p{margin:0;font:14.5px/1.75 var(--serif);color:var(--text-2)}
.risk .m{font-size:12.5px;color:var(--text-3);margin-top:8px}

/*@/amo-style*/
/* ---- 本页：3D 倾斜视角的 lane 地图 ---- */
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);user-select:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#cv.hot{cursor:pointer}
.hud{position:fixed;z-index:5;font-family:var(--sans)}
#crumb{left:16px;top:14px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px;box-shadow:var(--shadow);font-size:13.5px}
#crumb button{border:0;background:none;color:var(--text-2);padding:3px 8px;border-radius:6px;font-size:13.5px}
#crumb button:hover{background:var(--surface-2);color:var(--text)}
#crumb button.cur{color:var(--text);font-weight:600;cursor:default}
#crumb button.cur:hover{background:none}
#crumb .sep{color:var(--text-3);font-size:12px}
#modes{left:50%;top:14px;transform:translateX(-50%);display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
#modes button{border:0;background:none;color:var(--text-2);padding:4px 13px 5px;border-radius:9px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
#modes button b{font:500 13.5px var(--sans)}
#modes button small{font-size:11px;color:var(--text-3)}
#modes button:hover{background:var(--surface-2)}
#modes button.on{background:var(--text);color:var(--bg)}
#modes button.on small{color:var(--bg);opacity:.75}
#tr{right:14px;top:14px;display:flex;gap:8px;align-items:center}
#tr .theme,#tr .btn{font-size:13px;padding:5px 11px}
#tr a.back{font-size:13px;color:var(--text-2);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 11px}
#tr a.back:hover{border-color:var(--accent-fill)}
#need{border:1px solid var(--accent-fill);background:var(--accent-fill);color:#fff;border-radius:8px;padding:5px 12px;font:600 13.5px var(--sans)}
#need:hover{filter:brightness(1.06)}
#need.none{background:var(--surface);color:var(--text-2);border-color:var(--line);font-weight:400}
#legend{left:16px;bottom:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--text-2);display:flex;flex-direction:column;gap:4px;max-width:520px}
#legend .row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
#legend .k{display:inline-flex;align-items:center;gap:5px}
#legend svg{width:13px;height:13px;flex:none}
#legend .sw{width:22px;height:8px;border-radius:3px;display:inline-block;border:1px solid var(--line);margin:0}
#legend .src{color:var(--text-3);font-size:11.5px}
#legend button{border:0;background:none;color:var(--accent);padding:0;font-size:12px}
#zoom{right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:34px;height:32px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;font:500 16px var(--sans);box-shadow:var(--shadow)}
#zoom button.all{font-size:12px;width:auto;padding:0 6px}
#zoom button:hover{border-color:var(--accent-fill)}
#reset{right:58px;bottom:14px;border:0;background:none;color:var(--text-3);font-size:12px;padding:4px}
#reset:hover{color:var(--accent)}
body.winopen #zoom{right:432px}
body.winopen #reset{right:476px}
/* 弹出窗口：普通的 2D 窗口，在右侧 */
#win{position:fixed;z-index:8;right:14px;top:66px;width:404px;max-height:calc(100vh - 150px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(20,20,19,.16),0 1px 3px rgba(20,20,19,.08);padding:16px 18px 18px;font-family:var(--sans);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;pointer-events:none}
#win.open{opacity:1;transform:none;pointer-events:auto}
#win .wh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#win .wh .x{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:7px;padding:2px 9px;font-size:12px}
#win .wh .x:hover{border-color:var(--accent-fill);color:var(--text)}
#win h2{font:500 19px/1.4 var(--serif);margin:2px 0 8px;display:block}
#win .num{color:var(--text-3);font:13px var(--sans);margin-right:6px}
#win .meta2{font-size:12.5px;color:var(--text-2);line-height:1.75;margin:0 0 10px}
#win .meta2 b{font-weight:500;color:var(--text)}
#win .meta2 a{cursor:pointer}
#win .sum{font:15px/1.7 var(--serif);color:var(--text);margin:8px 0}
#win .body{font:14px/1.75 var(--serif);color:var(--text-2)}
#win .body p{margin:6px 0}
#win .sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#win .sec>.h{font:600 11.5px var(--sans);letter-spacing:.08em;color:var(--text-3);margin-bottom:6px}
#win .concl{background:var(--good-soft);border-radius:10px;padding:9px 12px;font:14px/1.7 var(--serif);margin-top:10px}
#win .concl b{font:600 12px var(--sans);color:var(--good);margin-right:6px}
#win .ask .q{font:500 15.5px/1.55 var(--serif);margin-bottom:8px}
#win .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:14px;line-height:1.45}
#win .opt:hover{border-color:var(--accent-fill)}
#win .opt.sel{border-color:var(--accent-fill);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent-fill) inset}
#win .opt .d{display:block;font-size:12.5px;color:var(--text-2)}
#win .opt .rec{float:right;font-size:11.5px;color:var(--accent);border:1px solid var(--accent-fill);border-radius:999px;padding:0 7px;margin-left:8px}
#win .why{font-size:12.5px;color:var(--text-2);margin:4px 0 8px}
#win .why b{color:var(--accent);font-weight:500}
#win input.note{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;font:13.5px var(--sans);margin:4px 0 8px}
#win input.note:focus{outline:none;border-color:var(--accent-fill)}
#win .acts{display:flex;gap:8px;flex-wrap:wrap}
#win .acts .btn{font-size:13.5px}
#win .acts .btn.pri:disabled{opacity:.45;cursor:default}
#win .answered{background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--text)}
#win .ev{font-size:13px;color:var(--text-2);margin:4px 0;display:flex;gap:8px;align-items:baseline}
#win .ev .k{font-size:11.5px;color:var(--text-3);flex:none;width:30px}
#win .ev code{font-size:12px}
#win .lk{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:5px 6px;margin:0 -6px;border-radius:7px;color:var(--text);font-size:13.5px}
#win .lk:hover{background:var(--surface-2)}
#win .lk .r{color:var(--text-3);font-size:12.5px;flex:none}
#win .lk .n{color:var(--text-2);font-size:12.5px}
#win .lk .st{margin-left:auto;font-size:12px;color:var(--text-3);flex:none}
#win .next{margin-top:12px;display:flex;justify-content:flex-end}
#foot{position:fixed;z-index:4;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;color:var(--text-3);font-family:var(--sans);pointer-events:none;white-space:nowrap}
@media (max-width:1320px){#modes button small{display:none}#legend{max-width:440px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="crumb" class="hud"></div>
<div id="modes" class="hud"></div>
<div id="tr" class="hud">
  <button id="need" title="依次飞到每道闸门">! 0 件等你</button>
  <a class="back" href="index.html">← 全部表达</a>
  <button class="theme" onclick="AMO.toggleTheme()">切换深浅色</button>
</div>
<div id="legend" class="hud"></div>
<div id="zoom" class="hud"><button data-z="in" title="放大">+</button><button data-z="out" title="缩小">−</button><button class="all" data-z="all" title="看全部任务">全部</button></div>

// 读 <script id="amo-data"> 里的 datalayer；人的操作记在 localStorage，所有表达共用一份，
// 所以在一种表达里回答了，换一种表达打开也能看到——这正是「表现随便换」要验证的。
window.AMO = (() => {
  const raw = JSON.parse(document.getElementById("amo-data").textContent);
  const KEY = "amo-userlayer:" + raw.context.id;
  const NOW = raw.now || "2026-11-01T08:30:00+08:00"; // 假数据的「现在」，让各表达的相对时间一致
  const subs = [];
  // 人的操作按假数据的「现在」往后排（第 n 次操作 = NOW + n 分钟），写成和数据一样的 +08:00 格式，
  // 这样字符串比较、排序、「上次以来」都和假数据对得上（B、C 组 11-01 的建议）
  function fakeNow(n) {
    const d = new Date(new Date(NOW).getTime() + n * 60000 + 8 * 3600000);
    return d.toISOString().slice(0, 19) + "+08:00";
  }

  const TYPE = {
    decision: { label: "决定", hint: "要你拍板" },
    question: { label: "问题", hint: "要你回答" },
    bug: { label: "bug", hint: "出错的地方" },
    finding: { label: "发现", hint: "值得注意" },
    task: { label: "事项", hint: "要做的事" },
    conclusion: { label: "结论", hint: "已经定了" },
    milestone: { label: "节点", hint: "发布、开工、交接" },
  };
  // 状态不能只靠颜色：每个都带符号和文字
  const STATUS = {
    needs_you: { label: "等你", sym: "!", color: "var(--accent-fill)", soft: "var(--accent-soft)" },
    working: { label: "进行中", sym: "◐", color: "var(--s2)", soft: "var(--surface-2)" },
    waiting: { label: "等别人", sym: "○", color: "var(--warn)", soft: "var(--warn-soft)" },
    settled: { label: "已定", sym: "✓", color: "var(--good)", soft: "var(--good-soft)" },
    parked: { label: "搁置", sym: "–", color: "var(--neutral)", soft: "var(--surface-2)" },
  };
  const REL = {
    depends: { out: "要等", in: "被它卡住的" },
    affects: { out: "会影响", in: "受它影响" },
    answers: { out: "回答了", in: "被回答" },
    supersedes: { out: "取代了", in: "被取代" },
    part_of: { out: "属于", in: "包含" },
  };
  const EVIDENCE = { file: "文件", commit: "提交", session: "会话", url: "网址", log: "记录" };
  const IMPORTANCE = { high: 3, normal: 2, low: 1 };

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { ops: [], seenAt: null }; } catch { return { ops: [], seenAt: null }; } };
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  let state = load();
  let data;

  function build() {
    data = JSON.parse(JSON.stringify(raw));
    // 0.2 的条目只写 at：补齐 0.1 的时间和重要程度字段，各表达不用分两套
    for (const i of data.items) { i.createdAt ||= i.at; i.updatedAt ||= i.at; i.importance ||= "normal"; i.evidence ||= []; }
    data.events ||= []; data.areas ||= []; data.links ||= [];
    if (state.seenAt) data.viewer.lastSeenAt = state.seenAt;
    for (const op of state.ops) applyOp(op);
  }
  function applyOp(op) {
    const it = data.items.find((i) => i.id === op.item);
    if (!it) return;
    const ev = { at: op.at, item: it.id, actor: "human", kind: op.kind, text: "" };
    if (op.kind === "answered") {
      const opt = it.ask.options.find((o) => o.id === op.option);
      it.ask.answer = { option: op.option, note: op.note || "", at: op.at };
      it.status = "working";
      it.owner = it.source;
      // 球交回提问的 agent：它的状态和在做的事跟着变
      const ag = data.agents.find((a) => a.id === it.source);
      if (ag) { ag.status = "running"; ag.item = it.id; ag.doing = `按你选的「${opt ? opt.label : op.option}」处理 #${it.num}`; }
      ev.text = `你选了「${opt ? opt.label : op.option}」${op.note ? "：" + op.note : ""}，交回${ownerName(it.source)}`;
    } else if (op.kind === "parked") {
      it.status = "parked"; it.owner = "human";
      ev.kind = "status"; ev.text = "你搁置了" + (op.note ? "：" + op.note : "");
    } else if (op.kind === "reopened") {
      const orig = raw.items.find((i) => i.id === it.id);
      it.status = orig.status === "parked" ? "needs_you" : orig.status; it.owner = orig.status === "parked" ? "human" : orig.owner;
      if (it.ask && orig.ask && !orig.ask.answer) { delete it.ask.answer; it.status = "needs_you"; it.owner = "human"; }
      ev.kind = "status"; ev.text = "你重新打开了";
    } else if (op.kind === "comment") {
      ev.text = "你批注：" + op.note;
    }
    it.updatedAt = op.at;
    data.events.push(ev);
  }
  function commit(op) {
    op.at = fakeNow(state.ops.length + 1);
    state.ops.push(op); save(); build(); emit();
  }
  const emit = () => subs.forEach((f) => f(data));

  // ---------- 查询 ----------
  const items = (pred) => data.items.filter(pred || (() => true));
  const item = (key) => data.items.find((i) => i.id === key || i.num === key || "#" + i.num === key);
  const agent = (id) => data.agents.find((a) => a.id === id);
  const area = (id) => data.areas.find((a) => a.id === id);
  function ownerName(owner) {
    if (!owner) return "";
    if (owner === "human") return "你";
    if (owner.startsWith("team:")) return owner.slice(5);
    const a = agent(owner); return a ? a.name : owner;
  }
  // 站在当前这一条说话：「要先等 #5」「#10 在等这条」，比 label 的「被它卡住的」好懂（A 组 11-01 的建议）
  const SAY = {
    depends: { out: (n) => `要先等 #${n}`, in: (n) => `#${n} 在等这条` },
    affects: { out: (n) => `会影响 #${n}`, in: (n) => `#${n} 会影响这条` },
    answers: { out: (n) => `回答了 #${n}`, in: (n) => `#${n} 回答了这条` },
    supersedes: { out: (n) => `取代了 #${n}`, in: (n) => `#${n} 取代了这条` },
    part_of: { out: (n) => `属于 #${n}`, in: (n) => `#${n} 是这条的一部分` },
  };
  function links(id) {
    return {
      out: data.links.filter((l) => l.from === id).map((l) => ({ ...l, item: item(l.to), label: REL[l.rel].out, say: SAY[l.rel].out(item(l.to).num) })),
      in: data.links.filter((l) => l.to === id).map((l) => ({ ...l, item: item(l.from), label: REL[l.rel].in, say: SAY[l.rel].in(item(l.from).num) })),
    };
  }
  const lastSeen = () => data.viewer.lastSeenAt;
  // 「上次以来」只算 agent 那边的变化，人自己的操作不算
  const isNew = (it) => { const r = raw.items.find((i) => i.id === it.id) || it; return (r.updatedAt || r.at) > lastSeen(); };
  const changesSince = (t) => data.events.filter((e) => e.at > (t || lastSeen())).sort((a, b) => a.at.localeCompare(b.at));
  const byWeight = (a, b) => IMPORTANCE[b.importance] - IMPORTANCE[a.importance] || a.createdAt.localeCompare(b.createdAt);
  const needsYou = () => items((i) => i.status === "needs_you").sort(byWeight);
  function counts() {
    const c = { total: data.items.length };
    for (const s of Object.keys(STATUS)) c[s] = data.items.filter((i) => i.status === s).length;
    return c;
  }

  // ---------- 文字 ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/#(\d+)/g, '<a href="#" class="amo-ref" data-num="$1">#$1</a>');
  }
  function md(text) {
    if (!text) return "";
    return text.split(/\n{2,}/).map((p) => {
      const lines = p.split("\n");
      if (lines.every((l) => /^\s*[-*] /.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";
    }).join("");
  }
  function fmtTime(iso) {
    const d = new Date(iso), now = new Date(NOW);
    const hm = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Shanghai" });
    const day = (x) => x.toLocaleDateString("zh-CN", { timeZone: "Asia/Shanghai" });
    if (day(d) === day(now)) return "今天 " + hm;
    if (day(new Date(d.getTime() + 864e5)) === day(now)) return "昨天 " + hm;
    return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit", timeZone: "Asia/Shanghai" }) + " " + hm;
  }
  function ago(iso) {
    const m = Math.round((new Date(NOW) - new Date(iso)) / 60000);
    if (m < 1) return "刚才"; if (m < 60) return m + " 分钟前";
    const h = Math.round(m / 60); return h < 24 ? h + " 小时前" : Math.round(h / 24) + " 天前";
  }

  // ---------- 外观 ----------
  function applyTheme() { const t = localStorage.getItem("amo-userlayer:theme"); if (t) document.documentElement.dataset.theme = t; }
  function toggleTheme() {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    localStorage.setItem("amo-userlayer:theme", r.dataset.theme);
  }
  function toast(msg) {
    let el = document.getElementById("amo-toast");
    if (!el) {
      el = document.createElement("div"); el.id = "amo-toast";
      el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-fg);padding:9px 16px;border-radius:10px;font:13.5px var(--sans);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none";
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity = 1;
    clearTimeout(el._t); el._t = setTimeout(() => (el.style.opacity = 0), 2200);
  }

  applyTheme();
  build();
  addEventListener("storage", (e) => { if (e.key === KEY) { state = load(); build(); emit(); } });

  return {
    raw, get data() { return data; }, NOW, TYPE, STATUS, REL, EVIDENCE, IMPORTANCE,
    items, item, agent, area, ownerName, links, lastSeen, isNew, changesSince, needsYou, counts, byWeight,
    esc, md, inline, fmtTime, ago, toggleTheme, toast,
    now: () => fakeNow(state.ops.length),
    // 各表达自己的布局（纸摆在哪、区画在哪），按表达分开存，人摆过的位置不会被别的表达改掉
    layout: (view, value) => { const k = "amo-userlayer:layout:" + view; if (value === undefined) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } } localStorage.setItem(k, JSON.stringify(value)); },
    on: (f) => { subs.push(f); return () => subs.splice(subs.indexOf(f), 1); },
    // 人的操作：都写成事件，球交回提问的 agent
    answer: (id, option, note) => { commit({ kind: "answered", item: id, option, note }); toast("已发回" + ownerName(item(id).source)); },
    park: (id, note) => { commit({ kind: "parked", item: id, note }); toast("已搁置 #" + item(id).num); },
    reopen: (id) => { commit({ kind: "reopened", item: id }); toast("已重新打开 #" + item(id).num); },
    comment: (id, note) => { commit({ kind: "comment", item: id, note }); toast("批注已记下，整理员会归档"); },
    markSeen: () => { state.seenAt = fakeNow(state.ops.length + 1); save(); build(); emit(); toast("已标为看过"); },
    reset: () => { state = { ops: [], seenAt: null }; save(); build(); emit(); toast("已恢复成初始假数据"); },
  };
})();

/*@/amo-lib*/
</script>
<script>
// lane 地图（2026-11-01）：canvas 2D + 自己写的透视投影。地面是 y=0 的平面，x 向右，z 往远处。
// 一份引擎，4 种布局：每种布局只回答「某个任务的 lane 在时间 u、横向偏移 off 处落在地面哪一点」，
// 路、节点、闸门、支线、桥都由这一个函数算出来，所以切换布局时逐点插值就能平滑变形过去。
const $ = (s) => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const HOUR = 3600e3, MIN = 60e3;
const T = (iso) => new Date(iso).getTime();
const NOWT = T(AMO.NOW);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const sstep = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const smooth = (x, a, b) => sstep((x - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = (t) => 1 - Math.pow(1 - clamp(t), 3);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- 数据（lane 结构是静态的，条目状态随人的操作变） ----------
const RAW = AMO.raw;
const LANES = RAW.lanes, LANE = {}, KIDS = {};
for (const l of LANES) { LANE[l.id] = l; if (l.parent) (KIDS[l.parent] ||= []).push(l); }
const FAMS = LANES.filter((l) => l.kind === "task");
const famOf = (l) => (l.kind === "task" ? l : LANE[l.parent]);
const RITEM = {}; for (const it of RAW.items) RITEM[it.id] = it;
const RITEMS_BY_LANE = {};
for (const it of RAW.items) (RITEMS_BY_LANE[it.lane] ||= []).push(it);
for (const k in RITEMS_BY_LANE) RITEMS_BY_LANE[k].sort((a, b) => T(a.at) - T(b.at));
// 闸门的位置按初始数据定：回答之后闸门抬起，但位置不动，路从它下面修过去
const SLOTS = {};
for (const k in RITEMS_BY_LANE) SLOTS[k] = RITEMS_BY_LANE[k].filter((i) => i.status === "needs_you" || i.status === "waiting");
const isSlot = (id) => { const r = RITEM[id]; return r && (r.status === "needs_you" || r.status === "waiting"); };
const kidStart = (k) => (k.kind === "branch" ? T(RITEM[k.forkFrom].at) : T(k.startAt));
const kidEnd = (k) => (k.mergeInto ? T(RITEM[k.mergeInto].at) : k.endAt ? T(k.endAt) : Infinity);

// ---------- 时间压缩 ----------
// 相邻两个事件之间的距离：短的按时长，几个小时没动的压成对数长度，并记下折痕。
// 每个事件至少占一小段，免得同一时刻挤在一起的节点叠成一团。
const gapLen = (g) => (g <= 0 ? 0 : g <= 1.5 ? 0.26 + g * 1.1 : 0.26 + 1.65 + 0.7 * Math.log2(g / 1.5));
const RATE = 1.1; // 最后一个事件之后（计划中的路）按每小时 1.1
function makeWarp(times) {
  const ts = [...new Set(times)].sort((a, b) => a - b);
  const us = [0], folds = [];
  for (let i = 1; i < ts.length; i++) {
    const g = (ts[i] - ts[i - 1]) / HOUR;
    us.push(us[i - 1] + gapLen(g));
    if (g > 2.5) folds.push({ t0: ts[i - 1], t1: ts[i], hours: g });
  }
  const n = ts.length;
  const f = (t) => {
    if (t <= ts[0]) return ((t - ts[0]) / HOUR) * RATE;
    if (t >= ts[n - 1]) return us[n - 1] + ((t - ts[n - 1]) / HOUR) * RATE;
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] <= t) lo = m; else hi = m; }
    return us[lo] + ((t - ts[lo]) / (ts[hi] - ts[lo])) * (us[hi] - us[lo]);
  };
  f.folds = folds; f.max = us[n - 1];
  return f;
}
const famTimes = (f) => {
  const ls = [f, ...(KIDS[f.id] || [])], out = [NOWT];
  for (const l of ls) { out.push(T(l.startAt)); if (l.endAt) out.push(T(l.endAt)); for (const it of RITEMS_BY_LANE[l.id] || []) out.push(T(it.at)); }
  return out;
};
const GW = makeWarp([NOWT, ...LANES.flatMap((l) => [T(l.startAt), ...(l.endAt ? [T(l.endAt)] : [])]), ...RAW.items.map((i) => T(i.at))]);
const FW = {}; for (const f of FAMS) FW[f.id] = makeWarp(famTimes(f));

// ---------- 子车道和支线的槽位 ----------
// 子车道各占一条；支线在时间上不重叠就共用一条，按 +1 -1 +2 -2 的顺序找
const SLOT = 0.7;
for (const f of FAMS) {
  const kids = (KIDS[f.id] || []).slice().sort((a, b) => kidStart(a) - kidStart(b));
  const busy = {};
  for (const k of kids) {
    const a = kidStart(k), b = kidEnd(k);
    for (const s of [1, -1, 2, -2, 3, -3, 4, -4]) {
      const iv = busy[s] || [];
      if (iv.some(([x, y]) => a < y + 5 * MIN && x < b + 5 * MIN)) continue;
      k._slot = s;
      (busy[s] ||= []).push(k.kind === "sub" ? [-Infinity, Infinity] : [a, b]);
      break;
    }
  }
  const ss = kids.map((k) => k._slot);
  f._band = [Math.min(0, ...ss), Math.max(0, ...ss)];
}

// ---------- 4 种布局 ----------
const DEG = Math.PI / 180;
const famEndT = (f) => Math.max(NOWT, ...[f, ...(KIDS[f.id] || [])].map((l) => (l.endAt ? T(l.endAt) : NOWT)));
const LAYOUT = {};
{ // right：时间从左到右，lane 一条条平行排开；新开的任务离人近
  const KX = 0.62, GAP = 0.7, Z = {};
  let zc = 0;
  for (const f of FAMS.slice().sort((a, b) => T(b.startAt) - T(a.startAt))) {
    Z[f.id] = zc - f._band[0] * SLOT + 0.35;
    zc = Z[f.id] + f._band[1] * SLOT + 0.35 + GAP;
  }
  LAYOUT.right = { id: "right", label: "向右", sub: "时间从左到右", yaw: -13 * DEG, pitch: 42 * DEG,
    u: (fid, t) => GW(t), c: (fid, u, off) => [u * KX, Z[fid] + off], folds: () => GW.folds, labelAt: "start" };
}
{ // away：现在在眼前（近处、画面下方），越旧越远
  const KZ = 0.66, GAP = 0.9, X = {}, UN = GW(NOWT);
  let xc = 0;
  for (const f of FAMS.slice().sort((a, b) => T(a.startAt) - T(b.startAt))) {
    X[f.id] = xc - f._band[0] * SLOT + 0.35;
    xc = X[f.id] + f._band[1] * SLOT + 0.35 + GAP;
  }
  LAYOUT.away = { id: "away", label: "往远处退", sub: "现在在眼前", yaw: 0, pitch: 34 * DEG,
    u: (fid, t) => GW(t), c: (fid, u, off) => [X[fid] + off, (UN - u) * KZ], folds: () => GW.folds, labelAt: "front" };
}
{ // radial：专题是中心广场，任务从中心往外长，越往外越新
  const R0 = 2.6, PW = 1.35, KR = 10.4 / Math.pow(GW(NOWT), PW), A = {};
  const order = ["L-flow", "L-iter", "L-auto", "L-maint", "L-ts", "L-and"].filter((id) => LANE[id]);
  for (const f of FAMS) if (!order.includes(f.id)) order.push(f.id);
  const wts = order.map((id) => LANE[id]._band[1] - LANE[id]._band[0] + 2.2);
  const sum = wts.reduce((a, b) => a + b, 0);
  let acc = -90 * DEG - (wts[0] / sum) * Math.PI;
  order.forEach((id, i) => { A[id] = acc + (wts[i] / sum) * Math.PI; acc += (wts[i] / sum) * 2 * Math.PI; });
  LAYOUT.radial = { id: "radial", label: "放射生长", sub: "从中心往外长", yaw: 0, pitch: 58 * DEG, R0, KR, A,
    u: (fid, t) => GW(t), r: (u) => R0 + Math.pow(Math.max(0, u), PW) * KR,
    c: (fid, u, off) => { const a = A[fid], r = R0 + Math.pow(Math.max(0, u), PW) * KR; return [r * Math.cos(a) - off * Math.sin(a), r * Math.sin(a) + off * Math.cos(a)]; },
    folds: () => GW.folds, labelAt: "front" };
}
{ // free：没有统一的时间轴，每条路按自己的节奏往前走、弯曲。
  // 用固定的种子试 60 种摆法，挑交叉少、有关联的路靠得近、整体紧凑的一种：每次打开都一样
  const KF = 0.62, DS = 0.1;
  const rng = (seed) => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  else if (b.dataset.act === "park") { AMO.park(id, note); delete noteDraft[id]; }
  else if (b.dataset.act === "comment") { if (!note) { AMO.toast("先写一句"); return; } AMO.comment(id, note); delete noteDraft[id]; renderWin(); }
  else if (b.dataset.act === "reopen") AMO.reopen(id);
  else if (b.dataset.act === "next") tour(id);
});
// 「! 5 件等你」：依次飞到每道闸门并弹出窗口
function tour(fromId) {
  const ny = AMO.needsYou(); if (!ny.length) { AMO.toast("没有等你的了"); return; }
  let i = fromId ? ny.findIndex((x) => x.id === fromId) + 1 : tourIdx + 1;
  if (i >= ny.length || i < 0) i = 0;
  tourIdx = i; flyToItem(ny[i].id);
}
$("#need").addEventListener("click", () => tour(sel && AMO.item(sel).status === "needs_you" ? sel : null));

// ---------- 图例 ----------
function shapeSvg(type) {
  const [n, rot] = SHAPE[type];
  if (n > 8) return `<svg viewBox="-7 -7 14 14"><circle r="5" fill="var(--text-3)"/></svg>`;
  const pts = []; for (let i = 0; i < n; i++) { const a = rot + (i * 2 * Math.PI) / n; pts.push((5.6 * Math.cos(a)).toFixed(1) + "," + (5.6 * Math.sin(a)).toFixed(1)); }
  return `<svg viewBox="-7 -7 14 14"><polygon points="${pts.join(" ")}" fill="var(--text-3)"/></svg>`;
}
function renderLegend() {
  const types = ["milestone", "decision", "conclusion", "finding", "bug", "task"];
  $("#legend").innerHTML = `<div class="row">${types.map((t) => `<span class="k">${shapeSvg(t)}${AMO.TYPE[t].label}</span>`).join("")}<span class="k"><svg viewBox="0 0 22 10"><line x1="1" y1="5" x2="21" y2="5" stroke="var(--accent-fill)" stroke-width="3"/><line x1="1" y1="5" x2="21" y2="5" stroke="#fff" stroke-width="1.6" stroke-dasharray="3 3"/></svg>闸门：等你拍板</span></div>
  <div class="row"><span class="k"><span class="sw" style="background:${PAL.road}"></span>路面</span><span class="k"><span class="sw" style="background:${PAL.roadNew}"></span>上次看过（${AMO.fmtTime(AMO.lastSeen())}）之后新铺的</span><span class="k"><span class="sw" style="background:none;border-style:dashed"></span>计划中</span><button onclick="AMO.markSeen()">标为看过</button></div>
  <div class="row src">数据：studio/plans/userlayer/sample-lanes.json（假数据）· 规范 0.2：README.md</div>`;
}

// ---------- 数据变了（自己或别的表达里回答了） ----------
function onData() {
  const before = S;
  S = computeState();
  const now = performance.now();
  let changed = false;
  for (const id of before.closed) if (!S.closed.has(id)) { openAnim[id] = now; changed = true; }
  for (const id of S.closed) if (!before.closed.has(id)) { delete openAnim[id]; changed = true; }
  if (changed || before.run.size !== S.run.size || [...S.run].some((x) => !before.run.has(x))) { Sprev = before; frontT0 = now + 420; }
  const n = AMO.needsYou().length;
  $("#need").textContent = n ? `! ${n} 件等你` : "✓ 没有等你的";
  $("#need").classList.toggle("none", !n);
  if (sel) renderWin();
  renderLegend(); measureHud();
  invalidate();
}
AMO.on(onData);
new MutationObserver(() => { readPal(); renderLegend(); invalidate(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readPal(); renderLegend(); invalidate(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) invalidate(); });
addEventListener("resize", () => { resize(); measureHud(); });

// ---------- 开始 ----------
readPal();
// 已经在别的表达里回答过的闸门，打开时就是抬起的
resize();
Object.assign(cam, fitAllCam(LB));
renderModes(); onData();
// 给截图脚本用
window.__lanes = { setMode, flyToLane, flyToItem, flyAll, openWin, closeWin, tour, cam, get X() { return X; }, get busy() { return !!fly || morph < 1 || Math.abs(zoomImp) > 1e-4; }, zoomBy: (k, x, y) => { zoomAt = [x ?? W / 2, y ?? H / 2]; zoomImp += k; invalidate(); }, S0, LAYOUT };
</script>
