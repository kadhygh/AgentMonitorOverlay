<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>书房 · userlayer 原型</title>
<style>
/*@amo-style*/
/* Claude 风格 · 单文件 HTML 基础样式
   用法：整段内联进 <style>，之后只追加本页专用样式。
   来源：2026-10-26 AIWork HTML 展示（推进总览 / 方案图解）。图表系列色 --s1..--s3 已过色盲与对比度校验（浅 / 深两套）。
   深色切换：<button class="theme" onclick="toggleTheme()">切换深浅色</button>
   function toggleTheme(){const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark'} */

/* ---------- 变量 ---------- */
:root{color-scheme:light;--bg:#faf9f5;--surface:#ffffff;--surface-2:#f0eee6;--line:#e8e6dc;--text:#141413;--text-2:#5e5d59;--text-3:#87867f;--accent:#c96442;--accent-fill:#d97757;--accent-soft:#f6e9e1;--good:#2e7d5b;--good-soft:#e5efe8;--warn:#c28a1e;--warn-soft:#f6ecd6;--crit:#b5443a;--crit-soft:#f5e1dd;--neutral:#b0aea5;--code:#f0eee6;--s1:#d97757;--s2:#4a86c8;--s3:#5e8c3a;--lane-v:#f5f3ec;--lane-l:#f8eee8;--tip-bg:#141413;--tip-fg:#faf9f5;--shadow:0 1px 2px rgba(20,20,19,.04),0 6px 18px rgba(20,20,19,.04);--serif:"Tiempos Text","Noto Serif SC","Source Han Serif SC",Georgia,serif;--sans:"Styrene B",Inter,"Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;--mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:30px 28px 80px}
nav.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3);margin-bottom:30px}
nav.top a{color:var(--text-2);text-decoration:none}
nav.top a:hover{color:var(--accent)}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:8px;padding:5px 12px;font-size:13px}
.theme:hover{border-color:var(--accent-fill)}
h1{font:500 31px/1.3 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
h1 code{font-size:.66em;vertical-align:4px}
h2{font:500 22px/1.4 var(--serif);margin:52px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font:400 13px var(--sans);color:var(--text-3)}
h3{font:500 17px/1.4 var(--serif);margin:0 0 8px}
.lead{color:var(--text-2);margin:0 0 16px;font:15.5px/1.75 var(--serif)}
code{font-family:var(--mono);font-size:.84em;background:var(--code);padding:1px 6px;border-radius:5px;color:var(--text);word-break:break-word}
a{color:var(--accent)}
footer{margin-top:56px;font-size:12.5px;color:var(--text-3);border-top:1px solid var(--line);padding-top:16px}

/* ---------- 容器 ---------- */
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card p,.prose{font-family:var(--serif)}
.prose{font-size:15px;line-height:1.8;color:var(--text-2)}
.prose li::marker{color:var(--accent-fill)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.twocol{grid-template-columns:1fr}}

/* 一句话结论：<div class="tldr"><b class="h">一句话结论</b><ul><li>…</li></ul></div> */
.tldr{margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 26px;box-shadow:var(--shadow);font:16px/1.8 var(--serif)}
.tldr b.h{display:block;font:600 12px var(--sans);letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.tldr ul{margin:0;padding-left:20px}
.tldr li{margin:5px 0}
.tldr li::marker{color:var(--accent-fill)}
.tldr code{font-size:.78em}

/* 标签：<span class="pill good"><span class="dot" style="background:var(--good)"></span>✓ 已完成</span> */
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.pill.good{background:var(--good-soft);color:var(--text)}
.pill.warn{background:var(--warn-soft);color:var(--text)}
.pill.crit{background:var(--crit-soft);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* 数字卡片：<div class="tiles"><div class="tile"><div class="k">标签</div><div class="v">68<small> 项</small></div><div class="d">说明</div></div></div> */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--text-3)}
.tile .v{font:500 34px/1.15 var(--serif);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .v small{font:400 14px var(--sans);color:var(--text-3);margin-left:2px}
.tile .d{font-size:12px;color:var(--text-3);line-height:1.5}

/* 时间线：<ol class="tl"><li><span class="node">✓</span><details class="stage"><summary><div class="sname">P1 标题<span>副标题</span></div><div class="sone">一句话</div><div><span class="commit">abc1234</span><span class="chev">▸</span></div></summary><div class="sbody">…</div></details></li></ol>
   节点：.node（完成）/ .node.warn（停过或待处理）/ .node.todo（未开始） */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:1.5px;background:var(--line)}
.tl li{position:relative;padding-left:42px;margin-bottom:10px}
.tl .node{position:absolute;left:3px;top:15px;width:22px;height:22px;border-radius:50%;background:var(--good);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700;box-shadow:0 0 0 4px var(--bg)}
.tl .node.warn{background:var(--warn)}
.tl .node.todo{background:var(--surface);border:1.5px solid var(--neutral);color:var(--text-3)}
details.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
details.stage>summary{list-style:none;cursor:pointer;padding:12px 18px;display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center}
details.stage>summary::-webkit-details-marker{display:none}
details.stage>summary:hover .sname{color:var(--accent)}
details.stage[open]>summary{border-bottom:1px solid var(--line)}
@media (max-width:820px){details.stage>summary{grid-template-columns:1fr}}
.sname{font:500 16px/1.35 var(--serif)}
.sname span{display:block;font:400 12px var(--sans);color:var(--text-3);margin-top:2px}
.sone{color:var(--text-2);font-size:14px;line-height:1.6}
.commit{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.commit.none{color:var(--text-3);background:var(--surface-2)}
.chev{display:inline-block;transition:transform .15s;color:var(--text-3);margin-left:8px}
details[open] .chev{transform:rotate(90deg)}
.sbody{padding:12px 22px 16px;font:15px/1.75 var(--serif);color:var(--text-2)}
.sbody ul{margin:0;padding-left:18px}
.sbody li{margin:4px 0}
.sbody li::marker{color:var(--accent-fill)}
.sbody b{color:var(--text);font-weight:600}
.sbody code{font-size:.8em}

/* 折叠块：<details class="fold"><summary>展开 8 条</summary>…</details> */
details.fold>summary{cursor:pointer;color:var(--accent);font-size:14px}

/* ---------- 表格 / 图例 / 提示 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--text-3);font-weight:500;font-size:12.5px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.s-ico{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.hatch{background:repeating-linear-gradient(45deg,var(--neutral) 0 2px,transparent 2px 6px);border:1px solid var(--neutral)}
.tip{position:fixed;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;line-height:1.55;padding:8px 11px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;max-width:290px}

/* ---------- 控件 ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 13px;font-size:13.5px}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;color:var(--text-2);font-size:13.5px}
.chips button.on{border-color:var(--accent-fill);background:var(--accent-soft);color:var(--text)}

/* ---------- 流程图（内联 SVG） ---------- */
svg text{font-family:var(--sans)}
.node-g{cursor:pointer}
.node-g rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:stroke .15s}
.node-g:hover rect,.node-g.sel rect{stroke:var(--accent-fill);stroke-width:2.2}
.node-g .t{font-size:13px;font-weight:600;fill:var(--text)}
.node-g .s{font-size:11px;fill:var(--text-3)}
.node-g.bad rect{stroke:var(--crit);stroke-dasharray:5 4;fill:var(--crit-soft)}
.edge{fill:none;stroke:var(--text-3);stroke-width:1.5}
.elab{font-size:11px;fill:var(--text-2)}

/* 风险卡：<div class="risks"><div class="risk"><b>标题</b><p>说明</p><div class="m">缓解</div></div></div> */
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.risk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.risk b{display:block;margin-bottom:6px;font:500 16px var(--serif)}
.risk p{margin:0;font:14.5px/1.75 var(--serif);color:var(--text-2)}
.risk .m{font-size:12.5px;color:var(--text-3);margin-top:8px}

/*@/amo-style*/
/* ---- 本页专用样式：3D 书房 ---- */
/* 白天：象牙墙、浅木；夜里：台灯暖光，四周暗 */
:root{--room:#e6dccb;--wall:#efe6d6;--wall-lo:#e2d5bf;--side:#e7dcc9;--floor:#c39b6c;--floor-line:rgba(90,60,30,.16);--wood:#bb8758;--wood-2:#a77443;--wood-dk:#82552f;--cork:#c99c67;--cork-dk:#ae7f4b;--frame:#8a5b34;--paper:#fffcf3;--paper-2:#f4ecda;--ink:#2a251f;--ink-2:#6b6152;--note-w:#dbe7f4;--note-wait:#f6e6a4;--slip:#fffaf0;--string:#c0392b;--plaque:#5c4330;--plaque-ink:#f4e8d4;--box:#cba679;--box-dk:#b38b5b;--box-in:#9c7547;--box-ink:#4a321b;--win:#cfe2f0;--win-2:#eaf3f9;--lit:transparent;--lit-wall:transparent;--vig:transparent;--book-ink:#f5ecd9;--b1:#7c4a3a;--b2:#3f5b70;--b3:#5d6c3c;--b4:#8b6a2e;--b5:#5b4a6b;--sheet:#fffcf4;--sheet-2:#f5eedd;--sheet-line:#e6dcc6;--sheet-ink:#28231d;--sheet-ink-2:#6a604f;--hud:rgba(255,252,245,.86)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--room:#100e0c;--wall:#2b2621;--wall-lo:#1c1915;--side:#231f1b;--floor:#352719;--floor-line:rgba(0,0,0,.35);--wood:#5f3f26;--wood-2:#4b3120;--wood-dk:#2f2016;--cork:#6f5233;--cork-dk:#563e25;--frame:#3b281a;--paper:#efe3c8;--paper-2:#e2d3b3;--ink:#2a231b;--ink-2:#5f5444;--note-w:#a9b9c9;--note-wait:#d6c27c;--slip:#e9dcc0;--string:#d0574a;--plaque:#2c2119;--plaque-ink:#e9d8bd;--box:#6b5236;--box-dk:#57422b;--box-in:#3d2e1e;--box-ink:#e2cfae;--win:#14203a;--win-2:#1d2c4a;--lit:radial-gradient(ellipse 62% 70% at 82% 18%,rgba(255,200,125,.55),rgba(255,170,90,.18) 50%,rgba(0,0,0,.32) 100%);--lit-wall:radial-gradient(ellipse 45% 60% at 72% 100%,rgba(255,190,110,.26),transparent 70%);--vig:radial-gradient(ellipse 75% 70% at 55% 62%,transparent 45%,rgba(0,0,0,.55) 100%);--book-ink:#e8d6b4;--b1:#5a3228;--b2:#2b3f4f;--b3:#3f4a29;--b4:#5f4820;--b5:#3e3249;--sheet:#e4d7bb;--sheet-2:#d8c9a8;--sheet-line:#c9b993;--sheet-ink:#211c16;--sheet-ink-2:#5a4f3f;--hud:rgba(38,36,34,.86)}}
:root[data-theme="dark"]{--room:#100e0c;--wall:#2b2621;--wall-lo:#1c1915;--side:#231f1b;--floor:#352719;--floor-line:rgba(0,0,0,.35);--wood:#5f3f26;--wood-2:#4b3120;--wood-dk:#2f2016;--cork:#6f5233;--cork-dk:#563e25;--frame:#3b281a;--paper:#efe3c8;--paper-2:#e2d3b3;--ink:#2a231b;--ink-2:#5f5444;--note-w:#a9b9c9;--note-wait:#d6c27c;--slip:#e9dcc0;--string:#d0574a;--plaque:#2c2119;--plaque-ink:#e9d8bd;--box:#6b5236;--box-dk:#57422b;--box-in:#3d2e1e;--box-ink:#e2cfae;--win:#14203a;--win-2:#1d2c4a;--lit:radial-gradient(ellipse 62% 70% at 82% 18%,rgba(255,200,125,.55),rgba(255,170,90,.18) 50%,rgba(0,0,0,.32) 100%);--lit-wall:radial-gradient(ellipse 45% 60% at 72% 100%,rgba(255,190,110,.26),transparent 70%);--vig:radial-gradient(ellipse 75% 70% at 55% 62%,transparent 45%,rgba(0,0,0,.55) 100%);--book-ink:#e8d6b4;--b1:#5a3228;--b2:#2b3f4f;--b3:#3f4a29;--b4:#5f4820;--b5:#3e3249;--sheet:#e4d7bb;--sheet-2:#d8c9a8;--sheet-line:#c9b993;--sheet-ink:#211c16;--sheet-ink-2:#5a4f3f;--hud:rgba(38,36,34,.86)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--room)}
.bar{position:fixed;top:12px;right:14px;display:flex;gap:8px;z-index:50}

#stage{position:fixed;inset:0;perspective:1200px;perspective-origin:50% 46%;overflow:hidden;user-select:none}
#cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.45,.05,.2,1)}
#cam *{transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;transform-origin:0 0}
.light{position:absolute;inset:0;background:var(--lit);pointer-events:none}
.vig{position:fixed;inset:0;pointer-events:none;background:var(--vig);z-index:2}

/* 房间 */
.floor{width:1800px;height:1100px;transform:translate3d(-900px,0,-600px) rotateX(90deg);background:repeating-linear-gradient(90deg,transparent 0 148px,var(--floor-line) 148px 150px),linear-gradient(var(--floor),var(--floor))}
.floor .light{background:radial-gradient(ellipse 40% 35% at 55% 18%,rgba(255,190,110,.18),transparent 70%)}
.wall-back{width:1800px;height:1000px;transform:translate3d(-900px,-1000px,-600px);background:linear-gradient(180deg,var(--wall) 0%,var(--wall-lo) 100%)}
.wall-back::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--wood-dk);opacity:.55}
.wall-back .light,.wall-left .light,.wall-right .light{background:var(--lit-wall)}
.wall-left{width:1100px;height:1000px;transform:translate3d(-900px,-1000px,500px) rotateY(90deg);background:linear-gradient(90deg,var(--side),var(--wall-lo))}
.wall-right{width:1100px;height:1000px;transform:translate3d(900px,-1000px,-600px) rotateY(-90deg);background:linear-gradient(90deg,var(--wall-lo),var(--side))}
.window{position:absolute;left:160px;top:170px;width:330px;height:380px;border:14px solid var(--wood-2);background:linear-gradient(160deg,var(--win-2),var(--win));box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:var(--wood-2)}
.window::after{content:"";position:absolute;top:50%;left:0;right:0;height:10px;margin-top:-5px;background:var(--wood-2)}

/* 书桌 */
.desk-top{width:920px;height:480px;transform:translate3d(-460px,-290px,-600px) rotateX(90deg);background:repeating-linear-gradient(91deg,rgba(0,0,0,.035) 0 2px,transparent 2px 11px),repeating-linear-gradient(89deg,rgba(255,255,255,.04) 0 1px,transparent 1px 23px),linear-gradient(180deg,var(--wood-2),var(--wood));border-radius:4px;cursor:zoom-in}
.desk-edge{width:920px;height:28px;transform:translate3d(-460px,-290px,-120px);background:linear-gradient(var(--wood-2),var(--wood-dk))}
.desk-ped{width:250px;height:262px;background:linear-gradient(var(--wood-2),var(--wood-dk));border-left:2px solid rgba(0,0,0,.18);border-right:2px solid rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;padding:12px}
.desk-ped i{flex:1;border:2px solid rgba(0,0,0,.18);border-radius:4px;position:relative}
.desk-ped i::after{content:"";position:absolute;left:50%;top:44%;width:44px;height:8px;margin-left:-22px;border-radius:4px;background:rgba(0,0,0,.28)}
.desk-sign{position:absolute;left:300px;top:3px;font:600 15px var(--sans);color:var(--plaque-ink);letter-spacing:.08em;white-space:nowrap}
.lamp{width:150px;height:290px;transform:translate3d(318px,-578px,-575px);pointer-events:none}
.lamp svg{width:100%;height:100%;overflow:visible}

/* 桌上的纸 */
.paper{position:absolute;left:0;top:0;padding:16px 18px;background:linear-gradient(170deg,var(--paper),var(--paper-2));color:var(--ink);border-radius:2px;box-shadow:2px 6px 12px rgba(40,25,10,.28);transform:translate3d(var(--x),var(--y),calc(var(--z) + var(--lift,0px))) rotateZ(var(--r));transition:transform .22s,box-shadow .22s;cursor:pointer}
.paper:hover,.paper.glow{--lift:22px;box-shadow:6px 16px 26px rgba(40,25,10,.32)}
.paper.sz-L{width:250px;height:292px}.paper.sz-M{width:204px;height:244px}.paper.sz-S{width:176px;height:210px}
.paper .p-head{font:600 15px var(--sans);color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.paper .p-head b{font:700 22px var(--sans);color:var(--ink)}
.paper .p-title{font:600 25px/1.32 var(--serif);margin-top:10px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.paper.sz-M .p-title{font-size:21px;-webkit-line-clamp:5}.paper.sz-S .p-title{font-size:18px}
.paper .p-foot{position:absolute;left:18px;right:18px;bottom:13px;font:600 15px var(--sans);color:#a5482c;border-top:1.5px dashed rgba(120,80,40,.3);padding-top:7px}
.tag-new{position:absolute;right:-8px;top:14px;background:#c84b31;color:#fff;font:700 16px var(--sans);padding:3px 9px 3px 11px;border-radius:3px 0 0 3px;box-shadow:1px 2px 3px rgba(0,0,0,.25)}
.tag-new::after{content:"";position:absolute;right:0;bottom:-6px;border-left:8px solid #8e2f1d;border-bottom:6px solid transparent}
.lifted{visibility:hidden}

/* 软木板 */
.board{width:720px;height:470px;transform:translate3d(-400px,-930px,-598px);background:radial-gradient(circle at 30% 40%,var(--cork-dk) 0 1.2px,transparent 1.6px) 0 0/9px 9px,radial-gradient(circle at 70% 70%,var(--cork-dk) 0 1px,transparent 1.4px) 3px 5px/11px 11px,linear-gradient(135deg,var(--cork),var(--cork-dk));border:18px solid var(--frame);box-shadow:0 10px 18px rgba(30,20,10,.25);cursor:zoom-in}
.board .light{background:var(--lit-wall)}
.board-label{position:absolute;left:14px;top:-16px;font:600 13px var(--sans);color:var(--plaque-ink);letter-spacing:.06em}
.board svg.strings{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;transform:translateZ(3px)}
.note{position:absolute;left:0;top:0;width:150px;height:116px;padding:16px 11px 8px;color:var(--ink);box-shadow:2px 5px 9px rgba(30,20,10,.28);transform:translate3d(var(--x),var(--y),calc(2px + var(--lift,0px))) rotateZ(var(--r));transition:transform .22s,box-shadow .22s;cursor:pointer}
.note:hover,.note.glow{--lift:20px;box-shadow:5px 14px 20px rgba(30,20,10,.32)}
.note.st-working{background:linear-gradient(var(--note-w),var(--note-w))}
.note.st-waiting{background:linear-gradient(var(--note-wait),var(--note-wait))}
.note .pin{position:absolute;left:50%;top:-3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ef7b67,#a8321f);box-shadow:1px 2px 2px rgba(0,0,0,.35);transform:translateZ(4px)}
.note .n-head{font:700 12px var(--sans);color:var(--ink-2);display:flex;justify-content:space-between}
.note .n-title{font:600 15px/1.3 var(--serif);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note .n-who{position:absolute;left:11px;bottom:6px;font:12px var(--sans);color:var(--ink-2)}
.note .slip{position:absolute;right:-14px;bottom:-18px;background:var(--slip);font:600 12px var(--sans);color:#8a3a20;padding:5px 9px 4px;transform:rotate(5deg) translateZ(3px);box-shadow:1px 3px 5px rgba(0,0,0,.25);white-space:nowrap}
.note .slip::before{content:"";position:absolute;left:12px;top:-7px;width:16px;height:12px;border:2.5px solid #555;border-bottom:0;border-radius:5px 5px 0 0}
.note .tag-new{top:auto;bottom:24px;font-size:12px;padding:2px 7px 2px 9px}
.note.arriving{visibility:hidden}
.note.pinned{animation:pinned .5s ease-out}
@keyframes pinned{0%{transform:translate3d(var(--x),var(--y),40px) rotateZ(var(--r))}60%{transform:translate3d(var(--x),var(--y),-2px) rotateZ(var(--r))}100%{transform:translate3d(var(--x),var(--y),2px) rotateZ(var(--r))}}

/* 墙上的小牌子：agent */
.plaques{width:300px;height:420px;transform:translate3d(355px,-975px,-598px);display:flex;flex-direction:column;gap:9px}
.plaques-h{font:600 14px var(--sans);color:var(--ink-2);letter-spacing:.06em;height:20px}
.plaque{background:linear-gradient(var(--plaque),color-mix(in srgb,var(--plaque) 80%,black));color:var(--plaque-ink);border-radius:5px;padding:7px 14px;box-shadow:0 5px 9px rgba(20,10,5,.3),inset 0 0 0 2px rgba(255,230,190,.15);transition:transform .2s;cursor:pointer;transform:translateZ(var(--lift,0px))}
.plaque:hover{--lift:14px}
.plaque b{font:600 17px var(--serif);display:flex;justify-content:space-between;align-items:baseline}
.plaque b span{font:600 12px var(--sans);opacity:.85}
.plaque div{font:13px/1.4 var(--sans);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plaque.idle{opacity:.72}

/* 书架 */
.shelf{width:440px;height:560px;transform:translate3d(-899px,-800px,-130px) rotateY(90deg);background:linear-gradient(90deg,var(--wood-dk),var(--wood-2) 6%,var(--wood-2) 94%,var(--wood-dk));padding:44px 20px 0;cursor:zoom-in}
.shelf .row{height:220px;border-bottom:16px solid var(--wood);box-shadow:0 4px 0 var(--wood-dk);display:flex;align-items:flex-end;gap:5px;padding:0 6px;margin-bottom:12px;background:rgba(0,0,0,.18)}
.shelf-label{position:absolute;left:20px;top:10px;font:600 15px var(--sans);color:var(--plaque-ink);letter-spacing:.08em}
.book{width:50px;color:var(--book-ink);border-radius:3px 3px 0 0;box-shadow:inset -4px 0 0 rgba(0,0,0,.18),inset 3px 0 0 rgba(255,255,255,.08);position:relative;transition:transform .2s;transform:translateZ(var(--lift,0px)) translateY(var(--up,0px));cursor:pointer;padding:12px 0 30px;display:flex;justify-content:center}
.book:hover,.book.glow{--lift:24px;--up:-10px}
.book .spine{writing-mode:vertical-rl;font:600 15px/1.25 var(--serif);max-height:100%;max-width:42px;overflow:hidden;letter-spacing:.03em}
.book .b-num{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:700 12px var(--sans);border-top:1px solid rgba(255,240,210,.35);padding-top:3px}

/* 纸箱 */
.box-f{background:linear-gradient(var(--box),var(--box-dk));box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.box-front{width:250px;height:170px;transform:translate3d(520px,-170px,-150px);cursor:zoom-in}
.box-front .lbl{position:absolute;left:0;right:0;top:54px;text-align:center;font:700 26px var(--sans);color:var(--box-ink);letter-spacing:.1em;opacity:.75}
.box-front .lbl small{display:block;font:600 14px var(--sans);letter-spacing:0;opacity:.85;margin-top:4px}
.box-front::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:rgba(0,0,0,.08)}
.box-side{width:220px;height:170px;transform:translate3d(520px,-170px,-370px) rotateY(-90deg)}
.box-side2{width:220px;height:170px;transform:translate3d(770px,-170px,-370px) rotateY(-90deg)}
.box-back{width:250px;height:170px;transform:translate3d(520px,-170px,-370px);background:var(--box-in)}
.box-bottom{width:250px;height:220px;transform:translate3d(520px,-1px,-370px) rotateX(90deg);background:var(--box-in)}
.flap{width:250px;height:90px;transform:translate3d(520px,-170px,-150px) rotateX(-128deg);transform-origin:0 0}
.flap2{width:250px;height:80px;transform:translate3d(520px,-170px,-370px) rotateX(128deg) translateY(-80px);transform-origin:0 100%}
.box-papers{width:250px;height:240px;transform:translate3d(520px,-330px,-262px);display:flex;justify-content:center;align-items:flex-start;gap:10px;padding-top:4px;cursor:zoom-in}
.boxpaper{width:150px;height:170px;background:linear-gradient(var(--paper),var(--paper-2));color:var(--ink);padding:10px 12px;font:600 15px/1.3 var(--serif);box-shadow:0 2px 6px rgba(0,0,0,.25);transform:rotateZ(var(--r)) translateY(var(--up,0px)) translateZ(var(--lift,0px));transition:transform .2s;cursor:pointer}
.boxpaper b{display:block;font:700 15px var(--sans);color:var(--ink-2)}
.boxpaper:hover,.boxpaper.glow{--up:-30px;--lift:6px}

/* 2D 叠层：提示、HUD、拿起来的纸 */
.tip{z-index:60}
.hud{position:fixed;left:16px;bottom:40px;z-index:40;background:var(--hud);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 14px 11px;max-width:min(560px,calc(100vw - 330px));box-shadow:var(--shadow)}
.hud h1{font:500 18px/1.3 var(--serif);margin:0 0 3px}
.hud .now{font:14px/1.55 var(--serif);color:var(--text-2)}
.hud .now a{cursor:pointer;color:var(--accent);text-decoration:none}
.hud .now a:hover{text-decoration:underline}
.hud .row2{display:flex;gap:10px;align-items:center;margin-top:6px;font:12.5px var(--sans);color:var(--text-3);flex-wrap:wrap}
.hud .row2 button{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:7px;padding:2px 9px;font-size:12.5px}
.hud .crumb b{color:var(--text);font-weight:600}
.corner{position:fixed;left:16px;bottom:10px;z-index:40;font:12px var(--sans);color:var(--text-3);display:flex;gap:12px;align-items:center}
.corner span{background:var(--hud);padding:3px 8px;border-radius:6px}
.corner button{border:0;background:none;color:var(--text-3);font-size:12px;text-decoration:underline;padding:0}

#reader{position:fixed;inset:0;z-index:45;display:none}
#reader.show{display:block}
#reader .dim{position:absolute;inset:0;background:rgba(20,14,8,.42);opacity:0;transition:opacity .45s}
#reader.on .dim{opacity:1}
#sheet{position:absolute;left:50%;top:28px;bottom:28px;width:min(780px,calc(100vw - 80px));margin-left:calc(min(780px,calc(100vw - 80px)) / -2);background:linear-gradient(175deg,var(--sheet),var(--sheet-2));color:var(--sheet-ink);border-radius:3px;box-shadow:0 30px 60px rgba(20,10,0,.35),0 2px 6px rgba(20,10,0,.2);transition:transform .55s cubic-bezier(.3,.1,.2,1),opacity .4s;transform-origin:50% 50%;overflow:hidden}
#sheet .scroll{position:absolute;inset:0;overflow:auto;padding:40px 56px 40px 64px;transition:opacity .3s .25s}
#sheet.fresh .scroll,#sheet.folding .scroll{opacity:0;transition-delay:0s}
#sheet::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:1.5px;background:rgba(190,80,60,.28);pointer-events:none}
#sheet .close{position:absolute;right:16px;top:14px;z-index:2;border:1px solid var(--sheet-line);background:transparent;color:var(--sheet-ink-2);border-radius:7px;padding:4px 11px;font-size:13px}
#sheet .close:hover{color:var(--sheet-ink);border-color:var(--sheet-ink-2)}
.s-top{font:600 13px var(--sans);color:var(--sheet-ink-2);display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-right:70px}
.s-top .st{padding:1px 9px;border-radius:999px;border:1.5px solid currentColor}
.s-top .new{background:#c84b31;color:#fff;padding:1px 8px;border-radius:3px}
.s-title{font:600 28px/1.35 var(--serif);margin:10px 0 6px}
.s-who{font:13.5px var(--sans);color:var(--sheet-ink-2);margin-bottom:16px}
.s-who b{color:var(--sheet-ink);font-weight:600}
.s-sum{font:italic 17px/1.75 var(--serif);color:var(--sheet-ink);border-left:3px solid var(--sheet-line);padding-left:14px;margin:0 0 14px}
.s-body{font:16px/1.85 var(--serif);color:var(--sheet-ink)}
.s-body code,.s-sec code{background:rgba(120,90,50,.13);color:var(--sheet-ink)}
.s-body a.amo-ref,.s-sec a.amo-ref{color:#a5482c;font-weight:600}
.s-sec{margin-top:26px;padding-top:16px;border-top:1.5px dashed var(--sheet-line)}
.s-sec>h4{font:700 12.5px var(--sans);letter-spacing:.12em;color:var(--sheet-ink-2);margin:0 0 10px}
.s-q{font:600 19px/1.5 var(--serif);margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;text-align:left;border:1.5px solid var(--sheet-line);background:rgba(255,255,255,.28);color:var(--sheet-ink);border-radius:9px;padding:11px 14px;font:inherit}
.opt:hover{border-color:#b9583a;background:rgba(255,255,255,.45)}
.opt .ol{font:600 16.5px var(--serif)}
.opt .od{grid-column:1;font:13.5px var(--sans);color:var(--sheet-ink-2)}
.opt .go{grid-row:1/3;grid-column:2;font:600 13px var(--sans);color:#a5482c}
.opt.rec{border-color:#b9583a;background:rgba(217,119,87,.13)}
.stamp{display:inline-block;margin-left:8px;font:700 12px var(--sans);color:#a5482c;border:1.5px solid #a5482c;border-radius:4px;padding:0 6px;transform:rotate(-3deg);vertical-align:2px}
.why{font:14.5px/1.7 var(--serif);color:var(--sheet-ink);background:rgba(217,119,87,.10);border-radius:8px;padding:9px 13px;margin-top:10px}
.why b{font:700 12.5px var(--sans);color:#a5482c;margin-right:6px}
.s-note{width:100%;margin:0 0 12px;border:1.5px solid var(--sheet-line);background:rgba(255,255,255,.3);color:var(--sheet-ink);border-radius:8px;padding:8px 11px;font:14.5px var(--serif);resize:vertical;min-height:40px}
.s-note::placeholder{color:var(--sheet-ink-2);opacity:.8}
.answered{font:16px/1.7 var(--serif);background:rgba(90,140,100,.14);border-radius:8px;padding:10px 14px}
.answered b{font-weight:700}
.deep{font:13.5px var(--sans);color:var(--sheet-ink-2);margin-top:8px}
.concl{font:600 17px/1.7 var(--serif);background:rgba(90,140,100,.14);border-radius:8px;padding:10px 14px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:3px 12px;font:14px/1.6 var(--sans);margin-bottom:8px}
.ev .k{font:700 12px var(--sans);color:var(--sheet-ink-2);padding-top:2px}
.ev code{font-size:13px;justify-self:start}
.ev .n{grid-column:2;color:var(--sheet-ink-2);font-family:var(--serif)}
.lk{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;border-bottom:1px dotted var(--sheet-line);background:none;color:var(--sheet-ink);padding:7px 2px;font:15px/1.5 var(--serif)}
.lk:hover{color:#a5482c}
.lk .r{font:700 12px var(--sans);color:#a5482c;min-width:86px}
.lk .ls{font:12.5px var(--sans);color:var(--sheet-ink-2);margin-left:auto;white-space:nowrap}
.lk .ln{font:12.5px var(--sans);color:var(--sheet-ink-2)}
.hist{font:13px/1.6 var(--sans);color:var(--sheet-ink-2);margin:0;padding:0;list-style:none}
.hist li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:2px 0}
.hist li b{color:var(--sheet-ink);font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.sbtn{border:1.5px solid var(--sheet-line);background:transparent;color:var(--sheet-ink);border-radius:8px;padding:6px 14px;font:13.5px var(--sans)}
.sbtn:hover{border-color:var(--sheet-ink-2)}
.s-foot{margin-top:30px;font:12px var(--sans);color:var(--sheet-ink-2);opacity:.8}
@media (max-width:1320px){#sheet .scroll{padding:34px 40px 34px 58px}.s-title{font-size:25px}}
</style>

    part_of: { out: "属于", in: "包含" },
  };
  const EVIDENCE = { file: "文件", commit: "提交", session: "会话", url: "网址", log: "记录" };
  const IMPORTANCE = { high: 3, normal: 2, low: 1 };

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { ops: [], seenAt: null }; } catch { return { ops: [], seenAt: null }; } };
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  let state = load();
  let data;

  function build() {
    data = JSON.parse(JSON.stringify(raw));
    // 0.2 的条目只写 at：补齐 0.1 的时间和重要程度字段，各表达不用分两套
    for (const i of data.items) { i.createdAt ||= i.at; i.updatedAt ||= i.at; i.importance ||= "normal"; i.evidence ||= []; }
    data.events ||= []; data.areas ||= []; data.links ||= [];
    if (state.seenAt) data.viewer.lastSeenAt = state.seenAt;
    for (const op of state.ops) applyOp(op);
  }
  function applyOp(op) {
    const it = data.items.find((i) => i.id === op.item);
    if (!it) return;
    const ev = { at: op.at, item: it.id, actor: "human", kind: op.kind, text: "" };
    if (op.kind === "answered") {
      const opt = it.ask.options.find((o) => o.id === op.option);
      it.ask.answer = { option: op.option, note: op.note || "", at: op.at };
      it.status = "working";
      it.owner = it.source;
      // 球交回提问的 agent：它的状态和在做的事跟着变
      const ag = data.agents.find((a) => a.id === it.source);
      if (ag) { ag.status = "running"; ag.item = it.id; ag.doing = `按你选的「${opt ? opt.label : op.option}」处理 #${it.num}`; }
      ev.text = `你选了「${opt ? opt.label : op.option}」${op.note ? "：" + op.note : ""}，交回${ownerName(it.source)}`;
    } else if (op.kind === "parked") {
      it.status = "parked"; it.owner = "human";
      ev.kind = "status"; ev.text = "你搁置了" + (op.note ? "：" + op.note : "");
    } else if (op.kind === "reopened") {
      const orig = raw.items.find((i) => i.id === it.id);
      it.status = orig.status === "parked" ? "needs_you" : orig.status; it.owner = orig.status === "parked" ? "human" : orig.owner;
      if (it.ask && orig.ask && !orig.ask.answer) { delete it.ask.answer; it.status = "needs_you"; it.owner = "human"; }
      ev.kind = "status"; ev.text = "你重新打开了";
    } else if (op.kind === "comment") {
      ev.text = "你批注：" + op.note;
    }
    it.updatedAt = op.at;
    data.events.push(ev);
  }
  function commit(op) {
    op.at = fakeNow(state.ops.length + 1);
    state.ops.push(op); save(); build(); emit();
  }
  const emit = () => subs.forEach((f) => f(data));

  // ---------- 查询 ----------
  const items = (pred) => data.items.filter(pred || (() => true));
  const item = (key) => data.items.find((i) => i.id === key || i.num === key || "#" + i.num === key);
  const agent = (id) => data.agents.find((a) => a.id === id);
  const area = (id) => data.areas.find((a) => a.id === id);
  function ownerName(owner) {
    if (!owner) return "";
    if (owner === "human") return "你";
    if (owner.startsWith("team:")) return owner.slice(5);
    const a = agent(owner); return a ? a.name : owner;
  }
  // 站在当前这一条说话：「要先等 #5」「#10 在等这条」，比 label 的「被它卡住的」好懂（A 组 11-01 的建议）
  const SAY = {
    depends: { out: (n) => `要先等 #${n}`, in: (n) => `#${n} 在等这条` },
    affects: { out: (n) => `会影响 #${n}`, in: (n) => `#${n} 会影响这条` },
    answers: { out: (n) => `回答了 #${n}`, in: (n) => `#${n} 回答了这条` },
    supersedes: { out: (n) => `取代了 #${n}`, in: (n) => `#${n} 取代了这条` },
    part_of: { out: (n) => `属于 #${n}`, in: (n) => `#${n} 是这条的一部分` },
  };
  function links(id) {
    return {
      out: data.links.filter((l) => l.from === id).map((l) => ({ ...l, item: item(l.to), label: REL[l.rel].out, say: SAY[l.rel].out(item(l.to).num) })),
      in: data.links.filter((l) => l.to === id).map((l) => ({ ...l, item: item(l.from), label: REL[l.rel].in, say: SAY[l.rel].in(item(l.from).num) })),
    };
  }
  const lastSeen = () => data.viewer.lastSeenAt;
  // 「上次以来」只算 agent 那边的变化，人自己的操作不算
  const isNew = (it) => { const r = raw.items.find((i) => i.id === it.id) || it; return (r.updatedAt || r.at) > lastSeen(); };
  const changesSince = (t) => data.events.filter((e) => e.at > (t || lastSeen())).sort((a, b) => a.at.localeCompare(b.at));
  const byWeight = (a, b) => IMPORTANCE[b.importance] - IMPORTANCE[a.importance] || a.createdAt.localeCompare(b.createdAt);
  const needsYou = () => items((i) => i.status === "needs_you").sort(byWeight);
  function counts() {
    const c = { total: data.items.length };
    for (const s of Object.keys(STATUS)) c[s] = data.items.filter((i) => i.status === s).length;
    return c;
  }

  // ---------- 文字 ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/#(\d+)/g, '<a href="#" class="amo-ref" data-num="$1">#$1</a>');
  }
  function md(text) {
    if (!text) return "";
    return text.split(/\n{2,}/).map((p) => {
      const lines = p.split("\n");
      if (lines.every((l) => /^\s*[-*] /.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";
    }).join("");
  }
  function fmtTime(iso) {
    const d = new Date(iso), now = new Date(NOW);
    const hm = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Shanghai" });
    const day = (x) => x.toLocaleDateString("zh-CN", { timeZone: "Asia/Shanghai" });
    if (day(d) === day(now)) return "今天 " + hm;
    if (day(new Date(d.getTime() + 864e5)) === day(now)) return "昨天 " + hm;
    return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit", timeZone: "Asia/Shanghai" }) + " " + hm;
  }
  function ago(iso) {
    const m = Math.round((new Date(NOW) - new Date(iso)) / 60000);
    if (m < 1) return "刚才"; if (m < 60) return m + " 分钟前";
    const h = Math.round(m / 60); return h < 24 ? h + " 小时前" : Math.round(h / 24) + " 天前";
  }

  // ---------- 外观 ----------
  function applyTheme() { const t = localStorage.getItem("amo-userlayer:theme"); if (t) document.documentElement.dataset.theme = t; }
  function toggleTheme() {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    localStorage.setItem("amo-userlayer:theme", r.dataset.theme);
  }
  function toast(msg) {
    let el = document.getElementById("amo-toast");
    if (!el) {
      el = document.createElement("div"); el.id = "amo-toast";
      el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-fg);padding:9px 16px;border-radius:10px;font:13.5px var(--sans);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none";
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity = 1;
    clearTimeout(el._t); el._t = setTimeout(() => (el.style.opacity = 0), 2200);
  }

  applyTheme();
  build();
  addEventListener("storage", (e) => { if (e.key === KEY) { state = load(); build(); emit(); } });

  return {
    raw, get data() { return data; }, NOW, TYPE, STATUS, REL, EVIDENCE, IMPORTANCE,
    items, item, agent, area, ownerName, links, lastSeen, isNew, changesSince, needsYou, counts, byWeight,
    esc, md, inline, fmtTime, ago, toggleTheme, toast,
    now: () => fakeNow(state.ops.length),
    // 各表达自己的布局（纸摆在哪、区画在哪），按表达分开存，人摆过的位置不会被别的表达改掉
    layout: (view, value) => { const k = "amo-userlayer:layout:" + view; if (value === undefined) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } } localStorage.setItem(k, JSON.stringify(value)); },
    on: (f) => { subs.push(f); return () => subs.splice(subs.indexOf(f), 1); },
    // 人的操作：都写成事件，球交回提问的 agent
    answer: (id, option, note) => { commit({ kind: "answered", item: id, option, note }); toast("已发回" + ownerName(item(id).source)); },
    park: (id, note) => { commit({ kind: "parked", item: id, note }); toast("已搁置 #" + item(id).num); },
    reopen: (id) => { commit({ kind: "reopened", item: id }); toast("已重新打开 #" + item(id).num); },
    comment: (id, note) => { commit({ kind: "comment", item: id, note }); toast("批注已记下，整理员会归档"); },
    markSeen: () => { state.seenAt = fakeNow(state.ops.length + 1); save(); build(); emit(); toast("已标为看过"); },
    reset: () => { state = { ops: [], seenAt: null }; save(); build(); emit(); toast("已恢复成初始假数据"); },
  };
})();

/*@/amo-lib*/
</script>
<script>
// 3D 书房：镜头固定，只在几个机位之间飞。3D 里只放短标题和大字，读字的事交给「拿起来」的 2D 页。
const $ = (s, r = document) => r.querySelector(s);
const E = AMO.esc;
const P = 1200; // 和 #stage 的 perspective 一致
const VIEWS = {
  all: { t: [0, -470, -330], d: 1720, pitch: -15, yaw: -10, name: "全景" },
  desk: { t: [0, -290, -330], d: 980, pitch: -52, yaw: 0, name: "书桌" },
  board: { t: [130, -695, -600], d: 1180, pitch: -3, yaw: 0, name: "软木板" },
  shelf: { t: [-900, -560, -350], d: 900, pitch: -4, yaw: -58, name: "书架" },
  box: { t: [645, -170, -260], d: 760, pitch: -34, yaw: 8, name: "纸箱" },
};
const ZOOM = [1, 0.8, 0.64]; // 滚轮在三档远近之间切
const ZONE = { needs_you: "desk", working: "board", waiting: "board", settled: "shelf", parked: "box" };
let view = "all", zoom = 0, openId = null, flying = null;

const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const jit = (id, k, span) => ((hash(id + k) % 1000) / 1000 - 0.5) * span;
const shortT = (t, n) => { const s = t.replace(/[？?。]$/, ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const who = (id) => AMO.ownerName(id);

// ---------- 镜头 ----------
function applyCam() {
  // 窄窗口退远一点，免得两边的书架、纸箱被切掉
  const v = VIEWS[view], d = v.d * ZOOM[zoom] * (view === "all" ? Math.max(1, 1440 / innerWidth) ** 0.9 : 1);
  $("#cam").style.transform = `translateZ(${P - d}px) rotateX(${v.pitch}deg) rotateY(${v.yaw}deg) translate3d(${-v.t[0]}px,${-v.t[1]}px,${-v.t[2]}px)`;
  renderHud();
}
function go(v, z = 0) { view = v; zoom = z; tip.style.opacity = 0; applyCam(); }
let wheelAt = 0;
addEventListener("wheel", (e) => {
  if (openId) return;
  e.preventDefault();
  if (Date.now() - wheelAt < 380) return; wheelAt = Date.now();
  const nz = Math.max(0, Math.min(ZOOM.length - 1, zoom + (e.deltaY < 0 ? 1 : -1)));
  if (nz !== zoom) { zoom = nz; applyCam(); }
}, { passive: false });

// ---------- 场景 ----------
function deskSlots(list) {
  // 越重要越大、越靠前（离你近 = 桌面坐标里 y 大），叠在上面
  const front = [[255, 172], [520, 168], [40, 190]], back = [[70, 30], [650, 36], [380, 22], [150, 120], [600, 110]];
  let fi = 0, bi = 0;
  return list.map((it, i) => {
    const big = it.importance === "high";
    const p = big && fi < front.length ? front[fi++] : back[bi++ % back.length];
    return { it, x: p[0] + jit(it.id, "x", 24), y: p[1] + jit(it.id, "y", 18), z: (list.length - i) * 3 + 1, r: jit(it.id, "r", 9), sz: big ? "L" : it.importance === "low" ? "S" : "M" };
  });
}
function renderDesk() {
  const list = AMO.needsYou();
  const desk = $("#desk");
  desk.querySelectorAll(".paper").forEach((n) => n.remove());
  desk.insertAdjacentHTML("beforeend", deskSlots(list).map((s) => {
    const it = s.it, n = it.ask ? it.ask.options.length : 0;
    return `<div class="paper sz-${s.sz}" data-item="${it.id}" style="--x:${s.x}px;--y:${s.y}px;--z:${s.z}px;--r:${s.r}deg">
      ${AMO.isNew(it) ? '<span class="tag-new">新</span>' : ""}
      <div class="p-head"><b>#${it.num}</b><span>${AMO.TYPE[it.type].label}</span></div>
      <div class="p-title">${E(it.title)}</div>
      <div class="p-foot">! 等你${it.ask ? `拍板 · ${n} 个选项` : "看"}</div></div>`;
  }).join(""));
  $("#deskSign").textContent = list.length ? `等你 · ${list.length} 张` : "桌上空了";
}
function boardSlots() {
  const list = [...AMO.items((i) => i.status === "working"), ...AMO.items((i) => i.status === "waiting")];
  return list.map((it, i) => ({ it, x: 18 + (i % 4) * 166 + jit(it.id, "x", 14), y: 22 + Math.floor(i / 4) * 138 + jit(it.id, "y", 12), r: jit(it.id, "r", 7) }));
}
function renderBoard() {
  const slots = boardSlots();
  $("#notes").innerHTML = slots.map((s) => {
    const it = s.it, wait = it.status === "waiting", st = AMO.STATUS[it.status];
    return `<div class="note st-${it.status}${flying === it.id ? " arriving" : ""}" data-item="${it.id}" style="--x:${s.x}px;--y:${s.y}px;--r:${s.r}deg">
      <i class="pin"></i><div class="n-head"><span>${st.sym} ${st.label}</span><span>#${it.num}</span></div>
      <div class="n-title">${E(it.title)}</div>
      ${wait ? "" : `<div class="n-who">${E(who(it.owner))} 在做</div>`}
      ${AMO.isNew(it) ? '<span class="tag-new">新</span>' : ""}
      ${wait ? `<div class="slip">等 ${E(who(it.owner))}</div>` : ""}</div>`;
  }).join("");
  // 红线：只连都钉在板上的两张
  const pos = Object.fromEntries(slots.map((s) => [s.it.id, [s.x + 75, s.y + 4]]));
  $("#strings").innerHTML = AMO.data.links.filter((l) => pos[l.from] && pos[l.to]).map((l) => {
    const [x1, y1] = pos[l.from], [x2, y2] = pos[l.to];
    return `<path d="M${x1} ${y1} Q${(x1 + x2) / 2} ${Math.max(y1, y2) + 22} ${x2} ${y2}" fill="none" stroke="var(--string)" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>`;
  }).join("");
  const c = AMO.counts();
  $("#boardLabel").textContent = `◐ 进行中 ${c.working}　○ 等别人 ${c.waiting}`;
}
function renderPlaques() {
  const tag = { running: "◐ 在干活", waiting: "○ 在等", idle: "– 空闲" };
  $("#plaques").innerHTML = `<div class="plaques-h">谁在干什么</div>` + AMO.data.agents.map((a) => {
    // 刚交回给它的事，也算它手上的
    const mine = AMO.items((i) => i.status === "working" && i.owner === a.id && i.ask && i.ask.answer).pop();
    const doing = mine ? `接手 #${mine.num}：按你选的去做` : a.doing;
    const st = mine ? "running" : a.status;
    return `<div class="plaque ${st}" data-agent="${a.id}" data-doing="${E(doing)}"><b>${E(a.name)}<span>${tag[st] || ""}</span></b><div>${E(doing)}</div></div>`;
  }).join("");
}
function renderShelf() {
  const list = AMO.items((i) => i.status === "settled");
  $("#books").innerHTML = list.map((it, i) => `<div class="book" data-item="${it.id}" style="height:${176 + (hash(it.id) % 4) * 11}px;background:var(--b${(i % 5) + 1})"><span class="spine">${E(shortT(it.title, 18))}</span><span class="b-num">#${it.num}</span></div>`).join("");
  $("#shelfLabel").textContent = `✓ 已定 · ${list.length} 本`;
}
function renderBox() {
  const list = AMO.items((i) => i.status === "parked");
  $("#boxPapers").innerHTML = list.map((it) => `<div class="boxpaper" data-item="${it.id}" style="--r:${jit(it.id, "r", 8)}deg"><b>– #${it.num}</b>${E(shortT(it.title, 26))}</div>`).join("");
  $("#boxLabel").innerHTML = `搁置<small>– ${list.length} 张</small>`;
}
function renderLamp() {
  $("#lamp").innerHTML = `<svg viewBox="0 0 170 330"><defs><radialGradient id="bulb"><stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#ffc77a" stop-opacity="0"/></radialGradient></defs>
    <ellipse cx="96" cy="322" rx="44" ry="9" fill="#3b3128"/><path d="M96 318 L70 170 L130 72" stroke="#3b3128" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="170" r="7" fill="#3b3128"/><path d="M104 40 L166 70 L140 118 L84 92 Z" fill="#2f5d4a"/><ellipse cx="114" cy="106" rx="30" ry="9" transform="rotate(26 114 106)" fill="#ffe2a8" class="bulb"/>
    <circle class="glowc" cx="110" cy="122" r="60" fill="url(#bulb)"/></svg>`;
}
function renderHud() {
  const nyl = AMO.needsYou(), top = nyl[0], c = AMO.counts();
  const fresh = AMO.items((i) => AMO.isNew(i)).length;
  $("#hud").innerHTML = `<h1>${E(AMO.data.context.title)}</h1>
    <div class="now">${nyl.length ? `桌上 <b>${nyl.length} 张纸等你</b>。最要紧：<a data-open="${top.id}">#${top.num} ${E(top.title)}</a>` : "桌上没有等你的纸了。"}</div>
    <div class="row2"><span class="crumb">${view === "all" ? "<b>全景</b>" : `全景 › <b>${VIEWS[view].name}</b>`}</span>
    ${view !== "all" || zoom ? '<button data-home>回到全景</button>' : ""}
    <span>◐ ${c.working} 进行中 · ○ ${c.waiting} 等别人 · ✓ ${c.settled} 已定 · – ${c.parked} 搁置</span>
    ${fresh ? `<span>上次看是 ${AMO.fmtTime(AMO.lastSeen())}，之后 ${fresh} 张有新变化</span><button data-seen>都看过了</button>` : ""}</div>`;
}
function render() {
  renderDesk(); renderBoard(); renderPlaques(); renderShelf(); renderBox(); renderHud();
  if (openId && !flying) fillSheet(AMO.item(openId));
  if (openId && !flying) { const el = elFor(openId); if (el) el.classList.add("lifted"); }
}
const elFor = (id) => document.querySelector(`#cam [data-item="${id}"]`);

// ---------- 悬停：抬起 + 标题 ----------
const tip = $("#tip");
$("#stage").addEventListener("mousemove", (e) => {
  const t = e.target.closest("[data-item],[data-agent],[data-zone]");
  let txt = "";
  if (t && t.dataset.item) { const it = AMO.item(t.dataset.item); txt = `<b>#${it.num}</b> ${E(it.title)}<br><span style="opacity:.75">${AMO.STATUS[it.status].sym} ${AMO.STATUS[it.status].label} · 点一下拿起来看</span>`; }
  else if (t && t.dataset.agent) { const a = AMO.agent(t.dataset.agent); txt = `<b>${E(a.name)}</b>（${E(a.model)}）<br>${E(t.dataset.doing)}`; }
  else if (t && t.dataset.zone && t.dataset.zone !== view) txt = { desk: "书桌：等你的纸", board: "软木板：进行中、等别人", shelf: "书架：已定的", box: "纸箱：搁置的" }[t.dataset.zone];
  tip.innerHTML = txt; tip.style.opacity = txt ? 1 : 0;
  tip.style.left = Math.min(e.clientX + 16, innerWidth - 300) + "px"; tip.style.top = e.clientY + 18 + "px";
});
$("#stage").addEventListener("mouseleave", () => (tip.style.opacity = 0));

// ---------- 点哪里飞哪里；点纸 = 拿起来 ----------
$("#stage").addEventListener("click", (e) => {
  if (flying) return;
  const t = e.target.closest("[data-item],[data-agent],[data-zone]");
  if (!t) return go("all");
  if (t.dataset.item) return pickUp(t.dataset.item);
  if (t.dataset.agent) { const m = /#(\d+)/.exec(t.dataset.doing); if (m) return goto(AMO.item(+m[1]).id); return; }
  if (t.dataset.zone !== view) return go(t.dataset.zone);
  // 已经在看纸箱时，点箱子就是把最上面那张拿出来看
  if (view === "box") { const p = AMO.items((i) => i.status === "parked").pop(); if (p) pickUp(p.id); }
});
$("#hud").addEventListener("click", (e) => {
  if (e.target.closest("[data-home]")) go("all");
  else if (e.target.closest("[data-seen]")) AMO.markSeen();
  else if (e.target.closest("[data-open]")) goto(e.target.closest("[data-open]").dataset.open);
});
addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || flying) return;
  if (openId) putBack(); else go("all");
});

// 关联、编号：先飞到那一条所在的地方，亮一下，再拿起来
function goto(id) {
  const it = AMO.item(id); if (!it) return;
  const fly = () => {
    go(ZONE[it.status]);
    setTimeout(() => { const el = elFor(id); if (!el) return; el.classList.add("glow"); setTimeout(() => { el.classList.remove("glow"); pickUp(id); }, 650); }, 980);
  };
  if (openId) { putBack(); setTimeout(fly, 420); } else fly();
}

const reader = $("#reader"), sheet = $("#sheet");
let src = null;
function flipFrom(rect, rot) {
  const dst = sheet.getBoundingClientRect();
  const dx = rect.left + rect.width / 2 - (dst.left + dst.width / 2), dy = rect.top + rect.height / 2 - (dst.top + dst.height / 2);
  return `translate(${dx}px,${dy}px) scale(${rect.width / dst.width},${rect.height / dst.height}) rotate(${rot}deg)`;
}
function pickUp(id) {
  const it = AMO.item(id), el = elFor(id);
  openId = id; tip.style.opacity = 0;
  fillSheet(it);
  reader.classList.add("show");
  sheet.classList.add("fresh");
  sheet.style.transition = "none";
  if (el) { src = el.getBoundingClientRect(); sheet.style.transform = flipFrom(src, -5); }
  else { src = null; sheet.style.transform = "translateY(40px) scale(.96)"; }
  sheet.offsetWidth;
  if (el) el.classList.add("lifted");
  sheet.style.transition = ""; sheet.style.transform = "none";
  reader.classList.add("on"); sheet.classList.remove("fresh");
}
function putBack() {
  const id = openId; if (!id) return;
  const el = elFor(id);
  sheet.classList.add("fresh"); reader.classList.remove("on");
  if (el) sheet.style.transform = flipFrom(el.getBoundingClientRect(), -5); else sheet.style.opacity = 0;
  setTimeout(() => { reader.classList.remove("show"); sheet.style.opacity = ""; if (el) el.classList.remove("lifted"); }, 520);
  openId = null;
}
reader.addEventListener("click", (e) => { if (e.target.classList.contains("dim")) putBack(); });

// 回答之后：纸折小，镜头飞到软木板，纸钉上去变成「进行中」的便签
function answer(id, opt) {
  const note = ($("#s-note") || {}).value?.trim() || "";
  flying = id;
  AMO.answer(id, opt, note);
  sheet.classList.add("folding"); reader.classList.remove("on");
  sheet.style.transform = "scale(.22,.17) rotate(4deg)";
  go("board");
  setTimeout(() => {
    const el = elFor(id);
    if (el) sheet.style.transform = flipFrom(el.getBoundingClientRect(), jit(id, "r", 7));
    setTimeout(() => {
      reader.classList.remove("show"); sheet.classList.remove("folding"); sheet.style.transform = "";
      flying = null; openId = null;
      const n = elFor(id); if (n) { n.classList.remove("arriving", "lifted"); n.classList.add("pinned"); }
    }, 560);
  }, 1000);
}

// ---------- 拿起来的 2D 阅读页 ----------
function relText(dir, rel, num) {
  // 站在这一张的角度说清方向
  const out = { depends: "要先等", affects: "会影响", answers: "回答了", supersedes: "取代了", part_of: "属于" };
  const inn = { depends: "在等这张", affects: "会影响这张", answers: "回答了这张", supersedes: "取代了这张", part_of: "是它的一部分" };
  return dir === "out" ? out[rel] : inn[rel];
}
function fillSheet(it) {
  if (!it) return;
  const st = AMO.STATUS[it.status], L = AMO.links(it.id);
  const where = { needs_you: "在你手里，等你拍板", working: `在 <b>${E(who(it.owner))}</b> 手里，进行中`, waiting: `在等 <b>${E(who(it.owner))}</b>`, settled: "已经定了", parked: "你搁置了，在纸箱里" }[it.status];
  let ask = "";
  if (it.ask) {
    const a = it.ask;
    if (a.answer) {
      const o = a.options.find((x) => x.id === a.answer.option);
      ask = `<div class="s-sec"><h4>你的回答</h4><p class="s-q">${E(a.question)}</p><div class="answered">你选了 <b>「${E(o ? o.label : a.answer.option)}」</b>${a.answer.note ? "：" + E(a.answer.note) : ""}<br><span style="font-size:14px">${AMO.fmtTime(a.answer.at)} · ${it.status === "working" ? `已交回 ${E(who(it.source))}，进行中` : "已交回"}</span></div></div>`;
    } else if (it.status === "needs_you") {
      ask = `<div class="s-sec"><h4>要你定</h4><p class="s-q">${E(a.question)}</p>
        <textarea class="s-note" id="s-note" rows="1" placeholder="想附一句话给 ${E(who(it.source))}，先写在这里（可不填），再点下面的选项"></textarea>
        <div class="opts">${a.options.map((o) => `<button class="opt${o.id === a.recommend ? " rec" : ""}" data-opt="${o.id}"><span class="ol">${E(o.label)}${o.id === a.recommend ? '<span class="stamp">推荐</span>' : ""}</span>${o.detail ? `<span class="od">${E(o.detail)}</span>` : ""}<span class="go">就选这个 →</span></button>`).join("")}</div>
        ${a.why ? `<div class="why"><b>为什么推荐「${E((a.options.find((o) => o.id === a.recommend) || {}).label || "")}」</b>${E(a.why)}</div>` : ""}
        ${a.deep ? '<div class="deep">! 这件事复杂，建议去对话里谈。</div>' : ""}</div>`;
    }
  }
  const links = [...L.out.map((l) => ({ ...l, d: "out" })), ...L.in.map((l) => ({ ...l, d: "in" }))];
  const hist = AMO.data.events.filter((e) => e.item === it.id).sort((a, b) => a.at.localeCompare(b.at));
  sheet.innerHTML = `<button class="close" data-close>放回去 · Esc</button><div class="scroll">
    <div class="s-top"><span>#${it.num}</span><span>${AMO.TYPE[it.type].label}</span><span class="st" style="color:${it.status === "needs_you" ? "#a5482c" : "var(--sheet-ink-2)"}">${st.sym} ${st.label}</span><span>${E((AMO.area(it.area) || {}).name || "")}</span>${AMO.isNew(it) ? '<span class="new">新</span>' : ""}</div>
    <div class="s-title">${E(it.title)}</div>
    <div class="s-who"><b>${E(who(it.source))}</b> 提的 · ${AMO.fmtTime(it.createdAt)} · 现在${where}</div>
    <p class="s-sum">${AMO.inline(it.summary || "")}</p>
    <div class="s-body">${AMO.md(it.body)}</div>
    ${it.conclusion ? `<div class="s-sec"><h4>${it.status === "parked" ? "搁置的原因" : "结论"}</h4><div class="concl">${AMO.inline(it.conclusion)}</div></div>` : ""}
    ${ask}
    ${it.evidence && it.evidence.length ? `<div class="s-sec"><h4>证据</h4>${it.evidence.map((v) => `<div class="ev"><span class="k">${AMO.EVIDENCE[v.kind] || v.kind}</span><code>${E(v.ref)}</code><span class="n">${E(v.note || "")}</span></div>`).join("")}</div>` : ""}
    ${links.length ? `<div class="s-sec"><h4>关联 · 点了飞过去</h4>${links.map((l) => `<button class="lk" data-goto="${l.item.id}"><span class="r">${l.d === "in" ? "#" + l.item.num + " " : ""}${relText(l.d, l.rel)}${l.d === "out" ? " #" + l.item.num : ""}</span><span>${E(l.item.title)}${l.note ? `<br><span class="ln">${E(l.note)}</span>` : ""}</span><span class="ls">${AMO.STATUS[l.item.status].sym} ${AMO.STATUS[l.item.status].label}</span></button>`).join("")}</div>` : ""}
    <div class="s-sec"><h4>批注和处理</h4>
      <textarea class="s-note" id="s-cmt" rows="2" placeholder="在这张纸边上写一句批注"></textarea>
      <div class="acts"><button class="sbtn" data-cmt>记下批注</button>
      ${it.status === "parked" ? '<button class="sbtn" data-reopen>从纸箱里拿出来</button>' : it.status === "needs_you" ? '<button class="sbtn" data-park>先搁置（放进纸箱）</button>' : ""}
      ${it.status === "settled" && it.ask && it.ask.answer ? '<button class="sbtn" data-reopen>重新打开</button>' : ""}</div></div>
    <div class="s-sec"><h4>这张纸的经过</h4><ul class="hist">${hist.map((h) => `<li><span>${AMO.fmtTime(h.at)}</span><span><b>${E(who(h.actor))}</b> ${E(h.text)}</span></li>`).join("")}</ul></div>
    <div class="s-foot">数据：studio/plans/userlayer/sample.json（假数据）</div></div>`;
}
sheet.addEventListener("click", (e) => {
  const t = e.target.closest("[data-opt],[data-goto],[data-close],[data-park],[data-reopen],[data-cmt],.amo-ref");
  if (!t || flying) return;
  e.preventDefault();
  const id = openId;
  if (t.matches("[data-close]")) putBack();
  else if (t.matches("[data-opt]")) answer(id, t.dataset.opt);
  else if (t.matches("[data-goto]")) goto(t.dataset.goto);
  else if (t.matches(".amo-ref")) { const it = AMO.item(+t.dataset.num); if (it) goto(it.id); }
  else if (t.matches("[data-park]")) { const n = ($("#s-cmt").value || "").trim(); putBack(); setTimeout(() => { AMO.park(id, n); go("box"); }, 450); }
  else if (t.matches("[data-reopen]")) { putBack(); setTimeout(() => { AMO.reopen(id); go("desk"); }, 450); }
  else if (t.matches("[data-cmt]")) { const n = $("#s-cmt").value.trim(); if (n) AMO.comment(id, n); }
});

renderLamp();
AMO.on(render);
render();
applyCam();
addEventListener("resize", applyCam);
</script>
</body>
</html>
