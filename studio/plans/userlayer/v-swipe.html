<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刷卡片 · userlayer 原型</title>
<style>
/*@amo-style*/
/* Claude 风格 · 单文件 HTML 基础样式
   用法：整段内联进 <style>，之后只追加本页专用样式。
   来源：2026-10-26 AIWork HTML 展示（推进总览 / 方案图解）。图表系列色 --s1..--s3 已过色盲与对比度校验（浅 / 深两套）。
   深色切换：<button class="theme" onclick="toggleTheme()">切换深浅色</button>
   function toggleTheme(){const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark'} */

/* ---------- 变量 ---------- */
:root{color-scheme:light;--bg:#faf9f5;--surface:#ffffff;--surface-2:#f0eee6;--line:#e8e6dc;--text:#141413;--text-2:#5e5d59;--text-3:#87867f;--accent:#c96442;--accent-fill:#d97757;--accent-soft:#f6e9e1;--good:#2e7d5b;--good-soft:#e5efe8;--warn:#c28a1e;--warn-soft:#f6ecd6;--crit:#b5443a;--crit-soft:#f5e1dd;--neutral:#b0aea5;--code:#f0eee6;--s1:#d97757;--s2:#4a86c8;--s3:#5e8c3a;--lane-v:#f5f3ec;--lane-l:#f8eee8;--tip-bg:#141413;--tip-fg:#faf9f5;--shadow:0 1px 2px rgba(20,20,19,.04),0 6px 18px rgba(20,20,19,.04);--serif:"Tiempos Text","Noto Serif SC","Source Han Serif SC",Georgia,serif;--sans:"Styrene B",Inter,"Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;--mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:30px 28px 80px}
nav.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3);margin-bottom:30px}
nav.top a{color:var(--text-2);text-decoration:none}
nav.top a:hover{color:var(--accent)}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:8px;padding:5px 12px;font-size:13px}
.theme:hover{border-color:var(--accent-fill)}
h1{font:500 31px/1.3 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
h1 code{font-size:.66em;vertical-align:4px}
h2{font:500 22px/1.4 var(--serif);margin:52px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font:400 13px var(--sans);color:var(--text-3)}
h3{font:500 17px/1.4 var(--serif);margin:0 0 8px}
.lead{color:var(--text-2);margin:0 0 16px;font:15.5px/1.75 var(--serif)}
code{font-family:var(--mono);font-size:.84em;background:var(--code);padding:1px 6px;border-radius:5px;color:var(--text);word-break:break-word}
a{color:var(--accent)}
footer{margin-top:56px;font-size:12.5px;color:var(--text-3);border-top:1px solid var(--line);padding-top:16px}

/* ---------- 容器 ---------- */
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card p,.prose{font-family:var(--serif)}
.prose{font-size:15px;line-height:1.8;color:var(--text-2)}
.prose li::marker{color:var(--accent-fill)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.twocol{grid-template-columns:1fr}}

/* 一句话结论：<div class="tldr"><b class="h">一句话结论</b><ul><li>…</li></ul></div> */
.tldr{margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 26px;box-shadow:var(--shadow);font:16px/1.8 var(--serif)}
.tldr b.h{display:block;font:600 12px var(--sans);letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.tldr ul{margin:0;padding-left:20px}
.tldr li{margin:5px 0}
.tldr li::marker{color:var(--accent-fill)}
.tldr code{font-size:.78em}

/* 标签：<span class="pill good"><span class="dot" style="background:var(--good)"></span>✓ 已完成</span> */
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.pill.good{background:var(--good-soft);color:var(--text)}
.pill.warn{background:var(--warn-soft);color:var(--text)}
.pill.crit{background:var(--crit-soft);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* 数字卡片：<div class="tiles"><div class="tile"><div class="k">标签</div><div class="v">68<small> 项</small></div><div class="d">说明</div></div></div> */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--text-3)}
.tile .v{font:500 34px/1.15 var(--serif);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .v small{font:400 14px var(--sans);color:var(--text-3);margin-left:2px}
.tile .d{font-size:12px;color:var(--text-3);line-height:1.5}

/* 时间线：<ol class="tl"><li><span class="node">✓</span><details class="stage"><summary><div class="sname">P1 标题<span>副标题</span></div><div class="sone">一句话</div><div><span class="commit">abc1234</span><span class="chev">▸</span></div></summary><div class="sbody">…</div></details></li></ol>
   节点：.node（完成）/ .node.warn（停过或待处理）/ .node.todo（未开始） */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:1.5px;background:var(--line)}
.tl li{position:relative;padding-left:42px;margin-bottom:10px}
.tl .node{position:absolute;left:3px;top:15px;width:22px;height:22px;border-radius:50%;background:var(--good);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700;box-shadow:0 0 0 4px var(--bg)}
.tl .node.warn{background:var(--warn)}
.tl .node.todo{background:var(--surface);border:1.5px solid var(--neutral);color:var(--text-3)}
details.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
details.stage>summary{list-style:none;cursor:pointer;padding:12px 18px;display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center}
details.stage>summary::-webkit-details-marker{display:none}
details.stage>summary:hover .sname{color:var(--accent)}
details.stage[open]>summary{border-bottom:1px solid var(--line)}
@media (max-width:820px){details.stage>summary{grid-template-columns:1fr}}
.sname{font:500 16px/1.35 var(--serif)}
.sname span{display:block;font:400 12px var(--sans);color:var(--text-3);margin-top:2px}
.sone{color:var(--text-2);font-size:14px;line-height:1.6}
.commit{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.commit.none{color:var(--text-3);background:var(--surface-2)}
.chev{display:inline-block;transition:transform .15s;color:var(--text-3);margin-left:8px}
details[open] .chev{transform:rotate(90deg)}
.sbody{padding:12px 22px 16px;font:15px/1.75 var(--serif);color:var(--text-2)}
.sbody ul{margin:0;padding-left:18px}
.sbody li{margin:4px 0}
.sbody li::marker{color:var(--accent-fill)}
.sbody b{color:var(--text);font-weight:600}
.sbody code{font-size:.8em}

/* 折叠块：<details class="fold"><summary>展开 8 条</summary>…</details> */
details.fold>summary{cursor:pointer;color:var(--accent);font-size:14px}

/* ---------- 表格 / 图例 / 提示 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--text-3);font-weight:500;font-size:12.5px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.s-ico{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.hatch{background:repeating-linear-gradient(45deg,var(--neutral) 0 2px,transparent 2px 6px);border:1px solid var(--neutral)}
.tip{position:fixed;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;line-height:1.55;padding:8px 11px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;max-width:290px}

/* ---------- 控件 ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 13px;font-size:13.5px}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;color:var(--text-2);font-size:13.5px}
.chips button.on{border-color:var(--accent-fill);background:var(--accent-soft);color:var(--text)}

/* ---------- 流程图（内联 SVG） ---------- */
svg text{font-family:var(--sans)}
.node-g{cursor:pointer}
.node-g rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:stroke .15s}
.node-g:hover rect,.node-g.sel rect{stroke:var(--accent-fill);stroke-width:2.2}
.node-g .t{font-size:13px;font-weight:600;fill:var(--text)}
.node-g .s{font-size:11px;fill:var(--text-3)}
.node-g.bad rect{stroke:var(--crit);stroke-dasharray:5 4;fill:var(--crit-soft)}
.edge{fill:none;stroke:var(--text-3);stroke-width:1.5}
.elab{font-size:11px;fill:var(--text-2)}

/* 风险卡：<div class="risks"><div class="risk"><b>标题</b><p>说明</p><div class="m">缓解</div></div></div> */
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.risk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.risk b{display:block;margin-bottom:6px;font:500 16px var(--serif)}
.risk p{margin:0;font:14.5px/1.75 var(--serif);color:var(--text-2)}
.risk .m{font-size:12.5px;color:var(--text-3);margin-top:8px}

/*@/amo-style*/
/* ---- 本页专用样式：刷卡片 ---- */
:root{--c-purple:#8a6fb8;--phone:#1c1c1b;--stage:#ecE9df}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--c-purple:#9a82c6;--phone:#0f0f0e;--stage:#1f1f1d}}
:root[data-theme="dark"]{--c-purple:#9a82c6;--phone:#0f0f0e;--stage:#1f1f1d}
html,body{height:100%}
body{overflow:hidden}
.bar{position:fixed;top:12px;right:14px;display:flex;gap:8px;z-index:50}
.page{display:grid;grid-template-columns:1fr auto 1fr;height:100vh;align-items:center;gap:40px;padding:0 32px}
/* 两边少量信息 */
.info{max-width:300px;justify-self:end;font-size:13px;color:var(--text-2)}
.info h1{font:500 24px/1.35 var(--serif);margin:0 0 6px;color:var(--text)}
.info .goal{font:13.5px/1.7 var(--serif);color:var(--text-2);margin:0 0 16px}
.cnt{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0 0 16px;font-size:13px}
.cnt b{font:500 15px var(--sans);text-align:right;font-variant-numeric:tabular-nums}
.agents{border-top:1px solid var(--line);padding-top:12px}
.agents div{display:grid;grid-template-columns:62px 1fr;gap:6px;font-size:12.5px;line-height:1.55;margin-bottom:6px}
.agents span:first-child{color:var(--text-3)}
.seen{color:var(--text-3);font-size:12px;margin-top:10px}
.log{justify-self:start;width:280px;font-size:13px}
.log h3{font:500 15px var(--serif);margin:0 0 8px;color:var(--text)}
.log ol{list-style:none;margin:0;padding:0;max-height:52vh;overflow:auto}
.log li{padding:7px 0;border-bottom:1px solid var(--line);line-height:1.55;color:var(--text-2)}
.log li b{color:var(--text);font-weight:500}
.log .none{color:var(--text-3)}
.foot{position:fixed;left:16px;bottom:10px;font-size:11.5px;color:var(--text-3)}
.foot button{border:0;background:none;color:var(--text-3);font-size:11.5px;text-decoration:underline;text-underline-offset:2px;padding:0;margin-left:6px}
/* 手机 */
.phone{--h:min(820px,calc(100vh - 56px));height:var(--h);width:calc(var(--h) * .5);background:var(--phone);border-radius:42px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.18),inset 0 0 0 2px rgba(255,255,255,.06);display:flex}
.screen{flex:1;border-radius:32px;background:var(--stage);overflow:hidden;display:flex;flex-direction:column;position:relative}
.prog{display:flex;gap:3px;padding:14px 16px 0}
.prog i{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--text) 14%,transparent);overflow:hidden;position:relative}
.prog i.done{background:color-mix(in srgb,var(--text) 55%,transparent)}
.prog i.cur::after{content:"";position:absolute;inset:0;background:var(--accent-fill);animation:fill 1.2s ease-out forwards;transform-origin:left}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ph{display:flex;justify-content:space-between;align-items:baseline;padding:8px 18px 6px;font-size:12px;color:var(--text-3)}
.ph b{font:500 13px var(--serif);color:var(--text-2)}
.deck{flex:1;position:relative;margin:4px 14px 0;min-height:0}
.card{position:absolute;inset:0 0 26px 0;perspective:1600px;transform-origin:50% 100%;touch-action:none;user-select:none;will-change:transform}
.card.top{cursor:grab;z-index:3}
.card.top.drag{cursor:grabbing}
.card.fly{transition:transform .34s ease-in,opacity .34s ease-in}
.card.back1{z-index:2;transform:translateY(13px) scale(.95);pointer-events:none}
.card.back2{z-index:1;transform:translateY(26px) scale(.9);pointer-events:none;opacity:.7}
.card.enter{animation:enter .28s ease-out}
@keyframes enter{from{transform:translateY(13px) scale(.95)}to{transform:none}}
.card.snap{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s ease}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--card,var(--surface));border:1px solid color-mix(in srgb,var(--edge,var(--line)) 40%,var(--line));box-shadow:0 8px 24px rgba(0,0,0,.10);overflow:hidden;display:flex;flex-direction:column}
.face.b{transform:rotateY(180deg);background:var(--surface)}
.fc{flex:1;overflow-y:auto;padding:20px 20px 14px;min-height:0}
.k-decision{--card:color-mix(in srgb,var(--accent-fill) 14%,var(--surface));--edge:var(--accent-fill)}
.k-question{--card:color-mix(in srgb,var(--c-purple) 14%,var(--surface));--edge:var(--c-purple)}
.s-working{--card:color-mix(in srgb,var(--s2) 13%,var(--surface));--edge:var(--s2)}
.s-waiting{--card:color-mix(in srgb,var(--warn) 15%,var(--surface));--edge:var(--warn)}
.s-settled{--card:color-mix(in srgb,var(--good) 13%,var(--surface));--edge:var(--good)}
.s-parked{--card:var(--surface-2);--edge:var(--neutral)}
.k-note{--card:color-mix(in srgb,var(--c-purple) 9%,var(--surface));--edge:var(--c-purple)}
.k-end{--card:var(--surface);--edge:var(--accent-fill)}
.kind{display:flex;align-items:center;gap:8px;font:600 12.5px var(--sans);color:var(--edge);letter-spacing:.03em}
.kind .tag{font:500 11px var(--sans);border-radius:6px;padding:1px 7px;background:var(--edge);color:#fff;letter-spacing:0}
.kind .tag.o{background:transparent;color:var(--text-2);border:1px solid var(--line)}
.from{font-size:12px;color:var(--text-3);margin:4px 0 10px}
.card h2{font:500 23px/1.4 var(--serif);margin:0 0 10px;color:var(--text)}
.card .sum{font:15px/1.75 var(--serif);color:var(--text-2);margin:0 0 14px}
.card .q{font:600 14px var(--sans);margin:0 0 8px;color:var(--text)}
.big{display:flex;flex-direction:column;gap:8px}
.big button{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;color:var(--text)}
.big button b{font:500 15.5px var(--sans)}
.big button small{grid-column:1/-1;font-size:12px;color:var(--text-3);line-height:1.5}
.big button .rt{font-size:11px;background:var(--accent-fill);color:#fff;border-radius:6px;padding:1px 7px;align-self:center}
.big button.rec{border-color:var(--accent-fill);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-fill) 20%,transparent)}
.big button.rec .why{grid-column:1/-1;font-size:12.5px;color:var(--text-2);line-height:1.6;margin-top:4px;padding-top:6px;border-top:1px dashed color-mix(in srgb,var(--accent-fill) 45%,var(--line))}
.big button:hover:not([disabled]){border-color:var(--accent-fill)}
.big button[disabled]{opacity:.45;cursor:default}
.big button.chosen{opacity:1;border-color:var(--good);background:var(--good-soft)}
.state{margin:0 0 12px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--edge) 16%,var(--surface));font-size:13px;color:var(--text)}
.turn{border:0;background:none;color:var(--text-3);font-size:12px;padding:8px 20px 12px;text-align:left;width:100%;border-top:1px solid color-mix(in srgb,var(--edge,var(--line)) 25%,var(--line))}
.turn:hover{color:var(--accent)}
.evs{margin:6px 0 12px;padding:0;list-style:none}
.evs li{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:13.5px;line-height:1.6;padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--edge) 20%,var(--line))}
.evs time{color:var(--text-3);font-size:12px;padding-top:1px}
.evs b{font-weight:500}
.doing{font-size:13px;color:var(--text-2);padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
/* 背面 */
.b h4{font:600 11.5px var(--sans);color:var(--text-3);letter-spacing:.05em;margin:16px 0 6px}
.b .bt{font:500 17px/1.45 var(--serif);margin:4px 0 8px}
.b .txt{font:14px/1.8 var(--serif);color:var(--text-2)}
.b .txt p{margin:0 0 8px}
.b .ev{font-size:12.5px;line-height:1.55;padding:5px 0;border-bottom:1px solid var(--line)}
.b .ev code{font-size:11.5px}
.b .ev span{display:block;color:var(--text-2)}
.lk{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.5;color:var(--text)}
.lk:hover{border-color:var(--accent-fill)}
.lk em{font-style:normal;color:var(--accent)}
.lk span{color:var(--text-3)}
.b textarea{width:100%;height:64px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:13.5px var(--sans);padding:8px 10px;resize:none;outline:none}
.b textarea:focus{border-color:var(--accent-fill)}
.b .concl{padding:8px 11px;border-radius:9px;background:var(--good-soft);font:14px/1.7 var(--serif)}
/* 拖动时的动作提示 */
.stamp{position:absolute;top:26px;z-index:4;padding:6px 14px;border-radius:10px;font:600 15px var(--sans);border:2.5px solid;opacity:0;pointer-events:none;background:var(--surface);max-width:78%;line-height:1.4}
.stamp.r{left:18px;color:var(--good);border-color:var(--good);transform:rotate(-8deg)}
.stamp.l{right:18px;color:var(--text-2);border-color:var(--text-2);transform:rotate(8deg)}
.stamp.u{left:50%;top:auto;bottom:40px;transform:translateX(-50%);color:var(--s2);border-color:var(--s2);white-space:nowrap}
/* 底部按钮 */
.acts{display:flex;gap:8px;padding:10px 14px 16px;justify-content:center}
.acts button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:9px 6px;font-size:13px;line-height:1.35;display:flex;flex-direction:column;align-items:center;gap:1px}
.acts button span{font-size:16px;color:var(--text-3)}
.acts button.go{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.acts button.go span{color:#fff}
.acts button:hover{border-color:var(--accent-fill)}
.acts button[hidden]{display:none}
/* 矮窗口（1280×800）：卡片里的字收一点，免得选项被挤出去 */
@media (max-height:860px){.fc{padding:16px 16px 10px}.card h2{font-size:20px;margin-bottom:6px}.card .sum{font-size:14px;line-height:1.65;margin-bottom:10px}.from{margin-bottom:6px}.big{gap:6px}.big button{padding:8px 12px}.big button b{font-size:14.5px}.big button.rec .why{font-size:12px;line-height:1.5}.acts button{padding:7px 6px}}
/* 最后一张 */
.end{text-align:center;padding-top:30px}
.end .big-n{font:500 30px var(--serif);margin:6px 0 4px}
.end p{font:14.5px/1.8 var(--serif);color:var(--text-2);margin:0 0 6px}
.end .sumbox{text-align:left;margin:18px 0;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px;line-height:1.75}
.end .sumbox div{display:grid;grid-template-columns:70px 1fr;gap:8px}
.end .sumbox span:first-child{color:var(--text-3)}
.end .btn{margin:4px}
</style>

"text":"问：今天什么时候再部署"},{"at":"2026-11-01T08:12:00+08:00","actor":"curator","kind":"comment","text":"整理完：新增 #1、#3、#5，补了 4 条关联（#1→#5、#1→#9、#3→#1、#5→#7）"},{"at":"2026-11-01T08:15:00+08:00","item":"i5","actor":"iter","kind":"status","text":"维护迭代接手，在改"},{"at":"2026-11-01T08:20:00+08:00","item":"i9","actor":"duty","kind":"status","text":"值守在改：重启那段断开显示，估计上午好"}]}</script>
<script>
/*@amo-lib*/
// userlayer 各表达共用的读写层（2026-11-01 原型）。
// 读 <script id="amo-data"> 里的 datalayer；人的操作记在 localStorage，所有表达共用一份，
// 所以在一种表达里回答了，换一种表达打开也能看到——这正是「表现随便换」要验证的。
window.AMO = (() => {
  const raw = JSON.parse(document.getElementById("amo-data").textContent);
  const KEY = "amo-userlayer:" + raw.context.id;
  const NOW = raw.now || "2026-11-01T08:30:00+08:00"; // 假数据的「现在」，让各表达的相对时间一致
  const subs = [];
  // 人的操作按假数据的「现在」往后排（第 n 次操作 = NOW + n 分钟），写成和数据一样的 +08:00 格式，
  // 这样字符串比较、排序、「上次以来」都和假数据对得上（B、C 组 11-01 的建议）
  function fakeNow(n) {
    const d = new Date(new Date(NOW).getTime() + n * 60000 + 8 * 3600000);
    return d.toISOString().slice(0, 19) + "+08:00";
  }

  const TYPE = {
    decision: { label: "决定", hint: "要你拍板" },
    question: { label: "问题", hint: "要你回答" },
    bug: { label: "bug", hint: "出错的地方" },
    finding: { label: "发现", hint: "值得注意" },
    task: { label: "事项", hint: "要做的事" },
    conclusion: { label: "结论", hint: "已经定了" },
    milestone: { label: "节点", hint: "发布、开工、交接" },
  };
  // 状态不能只靠颜色：每个都带符号和文字
  const STATUS = {
    needs_you: { label: "等你", sym: "!", color: "var(--accent-fill)", soft: "var(--accent-soft)" },
    working: { label: "进行中", sym: "◐", color: "var(--s2)", soft: "var(--surface-2)" },
    waiting: { label: "等别人", sym: "○", color: "var(--warn)", soft: "var(--warn-soft)" },
    settled: { label: "已定", sym: "✓", color: "var(--good)", soft: "var(--good-soft)" },
    parked: { label: "搁置", sym: "–", color: "var(--neutral)", soft: "var(--surface-2)" },
  };
  const REL = {
    depends: { out: "要等", in: "被它卡住的" },
    affects: { out: "会影响", in: "受它影响" },
    answers: { out: "回答了", in: "被回答" },
    supersedes: { out: "取代了", in: "被取代" },
    part_of: { out: "属于", in: "包含" },
  };
  const EVIDENCE = { file: "文件", commit: "提交", session: "会话", url: "网址", log: "记录" };
  const IMPORTANCE = { high: 3, normal: 2, low: 1 };

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { ops: [], seenAt: null }; } catch { return { ops: [], seenAt: null }; } };
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  let state = load();
  let data;

  function build() {
    data = JSON.parse(JSON.stringify(raw));
    // 0.2 的条目只写 at：补齐 0.1 的时间和重要程度字段，各表达不用分两套
    for (const i of data.items) { i.createdAt ||= i.at; i.updatedAt ||= i.at; i.importance ||= "normal"; i.evidence ||= []; }
    data.events ||= []; data.areas ||= []; data.links ||= [];
    if (state.seenAt) data.viewer.lastSeenAt = state.seenAt;
    for (const op of state.ops) applyOp(op);
  }
  function applyOp(op) {
    const it = data.items.find((i) => i.id === op.item);
    if (!it) return;
    const ev = { at: op.at, item: it.id, actor: "human", kind: op.kind, text: "" };
    if (op.kind === "answered") {
      const opt = it.ask.options.find((o) => o.id === op.option);
      it.ask.answer = { option: op.option, note: op.note || "", at: op.at };
      it.status = "working";
      it.owner = it.source;
      // 球交回提问的 agent：它的状态和在做的事跟着变
      const ag = data.agents.find((a) => a.id === it.source);
      if (ag) { ag.status = "running"; ag.item = it.id; ag.doing = `按你选的「${opt ? opt.label : op.option}」处理 #${it.num}`; }
      ev.text = `你选了「${opt ? opt.label : op.option}」${op.note ? "：" + op.note : ""}，交回${ownerName(it.source)}`;
    } else if (op.kind === "parked") {
      it.status = "parked"; it.owner = "human";
      ev.kind = "status"; ev.text = "你搁置了" + (op.note ? "：" + op.note : "");
    } else if (op.kind === "reopened") {
      const orig = raw.items.find((i) => i.id === it.id);
      it.status = orig.status === "parked" ? "needs_you" : orig.status; it.owner = orig.status === "parked" ? "human" : orig.owner;
      if (it.ask && orig.ask && !orig.ask.answer) { delete it.ask.answer; it.status = "needs_you"; it.owner = "human"; }
      ev.kind = "status"; ev.text = "你重新打开了";
    } else if (op.kind === "comment") {
      ev.text = "你批注：" + op.note;
    }
    it.updatedAt = op.at;
    data.events.push(ev);
  }
  function commit(op) {
    op.at = fakeNow(state.ops.length + 1);
    state.ops.push(op); save(); build(); emit();
  }
  const emit = () => subs.forEach((f) => f(data));

  // ---------- 查询 ----------
  const items = (pred) => data.items.filter(pred || (() => true));
  const item = (key) => data.items.find((i) => i.id === key || i.num === key || "#" + i.num === key);
  const agent = (id) => data.agents.find((a) => a.id === id);
  const area = (id) => data.areas.find((a) => a.id === id);
  function ownerName(owner) {
    if (!owner) return "";
    if (owner === "human") return "你";
    if (owner.startsWith("team:")) return owner.slice(5);
    const a = agent(owner); return a ? a.name : owner;
  }
  // 站在当前这一条说话：「要先等 #5」「#10 在等这条」，比 label 的「被它卡住的」好懂（A 组 11-01 的建议）
  const SAY = {
    depends: { out: (n) => `要先等 #${n}`, in: (n) => `#${n} 在等这条` },
    affects: { out: (n) => `会影响 #${n}`, in: (n) => `#${n} 会影响这条` },
    answers: { out: (n) => `回答了 #${n}`, in: (n) => `#${n} 回答了这条` },
    supersedes: { out: (n) => `取代了 #${n}`, in: (n) => `#${n} 取代了这条` },
    part_of: { out: (n) => `属于 #${n}`, in: (n) => `#${n} 是这条的一部分` },
  };
  function links(id) {
    return {
      out: data.links.filter((l) => l.from === id).map((l) => ({ ...l, item: item(l.to), label: REL[l.rel].out, say: SAY[l.rel].out(item(l.to).num) })),
      in: data.links.filter((l) => l.to === id).map((l) => ({ ...l, item: item(l.from), label: REL[l.rel].in, say: SAY[l.rel].in(item(l.from).num) })),
    };
  }
  const lastSeen = () => data.viewer.lastSeenAt;
  // 「上次以来」只算 agent 那边的变化，人自己的操作不算
  const isNew = (it) => { const r = raw.items.find((i) => i.id === it.id) || it; return (r.updatedAt || r.at) > lastSeen(); };
  const changesSince = (t) => data.events.filter((e) => e.at > (t || lastSeen())).sort((a, b) => a.at.localeCompare(b.at));
  const byWeight = (a, b) => IMPORTANCE[b.importance] - IMPORTANCE[a.importance] || a.createdAt.localeCompare(b.createdAt);
  const needsYou = () => items((i) => i.status === "needs_you").sort(byWeight);
  function counts() {
    const c = { total: data.items.length };
    for (const s of Object.keys(STATUS)) c[s] = data.items.filter((i) => i.status === s).length;
    return c;
  }

  // ---------- 文字 ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/#(\d+)/g, '<a href="#" class="amo-ref" data-num="$1">#$1</a>');
  }
  function md(text) {
    if (!text) return "";
    return text.split(/\n{2,}/).map((p) => {
      const lines = p.split("\n");
      if (lines.every((l) => /^\s*[-*] /.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";
    }).join("");
  }
  function fmtTime(iso) {
    const d = new Date(iso), now = new Date(NOW);
    const hm = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Shanghai" });
    const day = (x) => x.toLocaleDateString("zh-CN", { timeZone: "Asia/Shanghai" });
    if (day(d) === day(now)) return "今天 " + hm;
    if (day(new Date(d.getTime() + 864e5)) === day(now)) return "昨天 " + hm;
    return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit", timeZone: "Asia/Shanghai" }) + " " + hm;
  }
  function ago(iso) {
    const m = Math.round((new Date(NOW) - new Date(iso)) / 60000);
    if (m < 1) return "刚才"; if (m < 60) return m + " 分钟前";
    const h = Math.round(m / 60); return h < 24 ? h + " 小时前" : Math.round(h / 24) + " 天前";
  }

  // ---------- 外观 ----------
  function applyTheme() { const t = localStorage.getItem("amo-userlayer:theme"); if (t) document.documentElement.dataset.theme = t; }
  function toggleTheme() {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    localStorage.setItem("amo-userlayer:theme", r.dataset.theme);
  }
  function toast(msg) {
    let el = document.getElementById("amo-toast");
    if (!el) {
      el = document.createElement("div"); el.id = "amo-toast";
      el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-fg);padding:9px 16px;border-radius:10px;font:13.5px var(--sans);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none";
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity = 1;
    clearTimeout(el._t); el._t = setTimeout(() => (el.style.opacity = 0), 2200);
  }

  applyTheme();
  build();
  addEventListener("storage", (e) => { if (e.key === KEY) { state = load(); build(); emit(); } });

  return {
    raw, get data() { return data; }, NOW, TYPE, STATUS, REL, EVIDENCE, IMPORTANCE,
    items, item, agent, area, ownerName, links, lastSeen, isNew, changesSince, needsYou, counts, byWeight,
    esc, md, inline, fmtTime, ago, toggleTheme, toast,
    now: () => fakeNow(state.ops.length),
    // 各表达自己的布局（纸摆在哪、区画在哪），按表达分开存，人摆过的位置不会被别的表达改掉
    layout: (view, value) => { const k = "amo-userlayer:layout:" + view; if (value === undefined) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } } localStorage.setItem(k, JSON.stringify(value)); },
    on: (f) => { subs.push(f); return () => subs.splice(subs.indexOf(f), 1); },
    // 人的操作：都写成事件，球交回提问的 agent
    answer: (id, option, note) => { commit({ kind: "answered", item: id, option, note }); toast("已发回" + ownerName(item(id).source)); },
    park: (id, note) => { commit({ kind: "parked", item: id, note }); toast("已搁置 #" + item(id).num); },
    reopen: (id) => { commit({ kind: "reopened", item: id }); toast("已重新打开 #" + item(id).num); },
    comment: (id, note) => { commit({ kind: "comment", item: id, note }); toast("批注已记下，整理员会归档"); },
    markSeen: () => { state.seenAt = fakeNow(state.ops.length + 1); save(); build(); emit(); toast("已标为看过"); },
    reset: () => { state = { ops: [], seenAt: null }; save(); build(); emit(); toast("已恢复成初始假数据"); },
  };
})();

/*@/amo-lib*/
</script>
<script>
// 刷卡片：一次一张。先是等你的（重要的在前），再是上次以来的变化，最后一张「都看完了」。
// 右划采纳推荐、左划搁置、上划稍后再看（信息卡上划是「知道了」）；点卡片翻到背面看全文。
const E = AMO.esc;
let deck = [], pos = 0, flipped = false, busy = false, enterNext = false;
let round = { done: [] };       // 这一轮的动作：{id, act:"answer"|"park"|"later"|"ack", opt}
const notes = {};

function buildDeck() {
  const asks = AMO.needsYou().map((it) => ({ kind: "ask", id: it.id }));
  const seen = new Date(AMO.lastSeen()).getTime();
  const nRaw = AMO.raw.events.length;
  const fresh = AMO.data.events.filter((e, i) => i < nRaw && new Date(e.at).getTime() > seen && e.actor !== "human");
  const ids = [...new Set(fresh.filter((e) => e.item).map((e) => e.item))].map(AMO.item).filter((it) => it.status !== "needs_you");
  ids.sort(AMO.byWeight);
  const infos = ids.map((it) => ({ kind: "info", id: it.id }));
  const noteEvs = fresh.filter((e) => !e.item).map((e) => ({ kind: "note", ev: e }));
  deck = [...asks, ...infos, ...noteEvs, { kind: "end" }];
  pos = 0; flipped = false; round = { done: [] };
}

const T = (iso) => new Date(iso).getTime();
const st = (it) => { const s = AMO.STATUS[it.status]; return `${s.sym} ${s.label}`; };
const hm = (iso) => AMO.fmtTime(iso).replace("今天 ", "");
function cls(e) {
  if (e.kind === "end") return "k-end";
  if (e.kind === "note") return "k-note";
  const it = AMO.item(e.id);
  if (e.kind === "ask" && it.status === "needs_you") return "k-" + (it.type === "question" ? "question" : "decision");
  return "s-" + it.status;
}
function recLabel(it) { const o = it.ask && it.ask.options.find((x) => x.id === it.ask.recommend); return o ? o.label : ""; }

// ---------- 正面 ----------
function front(e) {
  if (e.kind === "end") return endFace();
  if (e.kind === "note") {
    const a = AMO.agent(e.ev.actor);
    return `<div class="fc"><div class="kind">${E(a.name)} · 整理通知<span class="tag o">上次以来</span></div><div class="from">${hm(e.ev.at)}</div>
      <h2>${AMO.inline(e.ev.text.split("：")[0])}</h2><p class="sum">${AMO.inline(e.ev.text.split("：").slice(1).join("："))}</p>
      <div class="doing">${E(a.name)}现在：${E(a.doing)}</div></div>`;
  }
  const it = AMO.item(e.id);
  const imp = it.importance === "high" ? `<span class="tag">重要</span>` : "";
  const nw = AMO.isNew(it) ? `<span class="tag o">新</span>` : "";
  const head = `<div class="kind">${AMO.TYPE[it.type].label} #${it.num}${imp}${nw}</div>`;
  if (e.kind === "ask" && it.ask) {
    const a = it.ask, open = it.status === "needs_you", ans = a.answer;
    const opts = a.options.map((o) => {
      const rec = o.id === a.recommend, chosen = ans && ans.option === o.id;
      return `<button class="${rec && open ? "rec" : ""} ${chosen ? "chosen" : ""}" data-opt="${o.id}" ${open ? "" : "disabled"}><b>${chosen ? "✓ " : ""}${E(o.label)}</b>${rec ? `<span class="rt">推荐</span>` : "<span></span>"}${o.detail ? `<small>${E(o.detail)}</small>` : ""}${rec && open ? `<span class="why">${E(a.why)}</span>` : ""}</button>`;
    }).join("");
    let state = "";
    if (it.status === "parked") state = `<div class="state">– 已搁置，球在你这儿。想再看就从背面重新打开。</div>`;
    else if (!open) state = `<div class="state">${st(it)} · 已交回${E(AMO.ownerName(it.owner))}</div>`;
    return `<div class="fc">${head}<div class="from">${E(AMO.ownerName(it.source))} 问你 · ${hm(it.createdAt)}</div>
      <h2>${E(it.title)}</h2><p class="sum">${AMO.inline(it.summary)}</p>${state}
      <div class="q">${E(a.question)}</div><div class="big">${opts}</div></div>
      <button class="turn" data-flip>↻ 翻过来：全文、证据、关联${notes[it.id] ? " · 已写附言" : ""}</button>`;
  }
  // 信息卡：上次以来它变了什么
  const seen = T(AMO.lastSeen());
  const evs = AMO.data.events.filter((x) => x.item === it.id && (T(x.at) > seen || e.kind === "ref")).slice(-4);
  const ag = AMO.agent(it.owner);
  const doing = ag && ag.doing.includes("#" + it.num) ? `<div class="doing">${E(ag.name)}正在：${E(ag.doing)}</div>` : "";
  return `<div class="fc">${head}<div class="from">${e.kind === "ref" ? "从关联跳过来" : "上次以来的变化"} · ${st(it)} · 在${E(AMO.ownerName(it.owner))}手里</div>
    <h2>${E(it.title)}</h2><p class="sum">${AMO.inline(it.summary)}</p>
    ${it.conclusion ? `<div class="state">${it.status === "parked" ? "– 搁置：" : "✓ 结论："}${E(it.conclusion)}</div>` : ""}
    ${evs.length ? `<ul class="evs">${evs.map((x) => `<li><time>${hm(x.at)}</time><span><b>${E(AMO.ownerName(x.actor))}</b>：${AMO.inline(x.text)}</span></li>`).join("")}</ul>` : ""}${doing}</div>
    <button class="turn" data-flip>↻ 翻过来：全文、证据、关联</button>`;
}
// ---------- 背面 ----------
function back(e) {
  if (e.kind === "end" || e.kind === "note") return `<div class="fc"></div>`;
  const it = AMO.item(e.id);
  const L = AMO.links(it.id);
  const lk = [...L.out, ...L.in].map((l) => `<button class="lk" data-go="${l.item.id}"><em>${E(l.label)}</em> #${l.item.num} ${E(l.item.title)} <span>· ${st(l.item)}${l.note ? " · " + E(l.note) : ""}</span></button>`).join("");
  const isAsk = e.kind === "ask" && it.status === "needs_you";
  return `<div class="fc"><div class="kind">${AMO.TYPE[it.type].label} #${it.num} · 背面</div>
    <div class="bt">${E(it.title)}</div>
    <div class="from" style="margin:0">${E(AMO.ownerName(it.source))} 提的 · 现在在${E(AMO.ownerName(it.owner))}手里 · ${E(AMO.area(it.area).name)}</div>
    ${it.body ? `<h4>全文</h4><div class="txt">${AMO.md(it.body)}</div>` : `<h4>摘要</h4><div class="txt">${AMO.md(it.summary)}</div>`}
    ${it.conclusion ? `<h4>${it.status === "parked" ? "搁置时说的" : "结论"}</h4><div class="concl">${E(it.conclusion)}</div>` : ""}
    ${it.ask && it.ask.answer ? `<h4>你的回答</h4><div class="txt">${E(it.ask.options.find((o) => o.id === it.ask.answer.option).label)}${it.ask.answer.note ? "：" + E(it.ask.answer.note) : ""}</div>` : ""}
    <h4>证据</h4>${it.evidence.length ? it.evidence.map((v) => `<div class="ev">${AMO.EVIDENCE[v.kind]} <code>${E(v.ref)}</code><span>${E(v.note)}</span></div>`).join("") : `<div class="txt">还没有</div>`}
    <h4>关联</h4>${lk || `<div class="txt">没有</div>`}
    ${isAsk ? `<h4>附言（回答或搁置时一起带上）</h4><textarea data-note="${it.id}" placeholder="比如：13:00 前弄完">${E(notes[it.id] || "")}</textarea>` : ""}
    ${it.status === "parked" ? `<p><button class="btn" data-reopen="${it.id}">重新打开</button></p>` : ""}</div>
    <button class="turn" data-flip>↺ 翻回正面</button>`;
}
function endFace() {
  const c = AMO.counts();
  const ans = round.done.filter((d) => d.act === "answer"), pk = round.done.filter((d) => d.act === "park");
  const later = round.done.filter((d) => d.act === "later" && AMO.item(d.id).status === "needs_you");
  const to = {};
  for (const d of ans) { const n = AMO.ownerName(AMO.item(d.id).owner); (to[n] = to[n] || []).push("#" + AMO.item(d.id).num); }
  const toTxt = Object.entries(to).map(([n, l]) => `${E(n)}（${l.join("、")}）`).join("、") || "没有";
  return `<div class="fc end"><div class="kind" style="justify-content:center">✓ 这一轮</div>
    <div class="big-n">都看完了</div>
    <p>你定了 ${ans.length} 件，搁置了 ${pk.length} 件${later.length ? `，还有 ${later.length} 件稍后再看` : ""}。</p>
    <div class="sumbox">
      <div><span>交给了</span><span>${toTxt}</span></div>
      <div><span>还等你</span><span>${c.needs_you ? c.needs_you + " 件：" + AMO.needsYou().map((i) => "#" + i.num).join("、") : "没有了"}</span></div>
      <div><span>进行中</span><span>${c.working} 件</span></div>
      <div><span>等别人</span><span>${c.waiting} 件（${[...new Set(AMO.items((i) => i.status === "waiting").map((i) => AMO.ownerName(i.owner)))].join("、")}）</span></div>
      <div><span>已定</span><span>${c.settled} 件 · 搁置 ${c.parked} 件</span></div>
    </div>
    <button class="btn pri" data-again>再看一遍</button><button class="btn" data-seen>标为看过</button></div>`;
}

// ---------- 画面 ----------
function render() {
  const e = deck[pos];
  const dk = document.getElementById("deck");
  let h = "";
  for (let k = Math.min(2, deck.length - 1 - pos); k >= 0; k--) {
    const x = deck[pos + k];
    const c = k === 0 ? `top ${flipped ? "flipped" : ""} ${enterNext ? "enter" : ""}` : "back" + k;
    h += `<div class="card ${c} ${cls(x)}">${k === 0 ? stamps(x) : ""}<div class="inner"><div class="face f">${front(x)}</div>${k === 0 ? `<div class="face b">${back(x)}</div>` : ""}</div></div>`;
  }
  dk.innerHTML = h;
  enterNext = false;
  const top = dk.querySelector(".card.top");
  if (top) bindDrag(top, e);
  // 进度条
  const n = deck.length - 1;
  document.getElementById("prog").innerHTML = deck.slice(0, n).map((x, i) => `<i class="${i < pos ? "done" : i === pos ? "cur" : ""}" title="${x.kind === "ask" ? "等你" : "变化"}"></i>`).join("");
  document.getElementById("ptitle").textContent = AMO.data.context.title;
  const nAsk = deck.filter((x) => x.kind === "ask").length;
  document.getElementById("ppos").textContent = e.kind === "end" ? "看完了" : e.kind === "ask" ? `等你 · ${deck.indexOf(e) + 1} / ${nAsk}` : `上次以来的变化 · 第 ${pos + 1} / ${n} 张`;
  // 底部按钮
  const bl = document.getElementById("bl"), bu = document.getElementById("bu"), br = document.getElementById("br");
  const it = e.id && AMO.item(e.id);
  const askOpen = e.kind === "ask" && it.status === "needs_you";
  document.getElementById("acts").style.visibility = e.kind === "end" ? "hidden" : "";
  bl.hidden = br.hidden = !askOpen;
  bu.innerHTML = askOpen ? "<span>↑</span>稍后再看" : "<span>↑</span>知道了，下一张";
  bu.classList.toggle("go", !askOpen);
  if (askOpen) br.innerHTML = `<span>→</span>采纳推荐：${E(recLabel(it))}`;
  renderSide();
}
function stamps(e) {
  const it = e.id && AMO.item(e.id);
  if (e.kind === "ask" && it.status === "needs_you") return `<div class="stamp r">采纳推荐：${E(recLabel(it))}</div><div class="stamp l">搁置</div><div class="stamp u">稍后再看</div>`;
  if (e.kind === "end") return "";
  return `<div class="stamp u">知道了</div>`;
}
function renderSide() {
  const c = AMO.counts(), d = AMO.data;
  const top = AMO.needsYou()[0];
  document.getElementById("info").innerHTML = `<h1>${E(d.context.title)}</h1><p class="goal">${E(d.context.goal)}</p>
    <div class="cnt"><b>${c.needs_you}</b><span>! 等你${top ? `，最要紧：#${top.num}` : ""}</span><b>${c.working}</b><span>◐ 进行中</span><b>${c.waiting}</b><span>○ 等别人</span><b>${c.settled}</b><span>✓ 已定</span><b>${c.parked}</b><span>– 搁置</span></div>
    <div class="agents">${d.agents.map((a) => `<div><span>${E(a.name)}</span><span>${E(doingOf(a))}</span></div>`).join("")}</div>
    <div class="seen">上次看：${AMO.fmtTime(AMO.lastSeen())}</div>`;
  const li = round.done.slice().reverse().map((x) => {
    const it = AMO.item(x.id);
    if (x.act === "answer") { const o = it.ask.options.find((y) => y.id === x.opt); return `<li><b>✓ #${it.num} ${E(o.label)}</b><br>已交回${E(AMO.ownerName(it.owner))} · ${st(it)}</li>`; }
    if (x.act === "park") return `<li><b>– #${it.num} 搁置</b><br>${E(it.title)}</li>`;
    if (x.act === "later") return `<li><b>↑ #${it.num} 稍后再看</b><br>${st(it)}</li>`;
    return `<li>知道了 #${it.num}<br>${E(it.title)}</li>`;
  }).join("");
  document.getElementById("log").innerHTML = `<h3>这一轮</h3><ol>${li || `<li class="none">还没有动作。</li>`}</ol>`;
}
function doingOf(a) {
  const back = AMO.items((i) => i.owner === a.id && i.status === "working" && i.ask && i.ask.answer && !AMO.raw.items.find((r) => r.id === i.id).ask.answer).pop();
  if (back) return `按你选的「${back.ask.options.find((o) => o.id === back.ask.answer.option).label}」处理 #${back.num}`;
  return a.doing;
}

// ---------- 动作 ----------
function act(dir, optId) {
  if (busy) return;
  const e = deck[pos];
  if (e.kind === "end") return;
  const it = e.id && AMO.item(e.id);
  const askOpen = e.kind === "ask" && it.status === "needs_you";
  if (!askOpen && dir !== "up") return snapBack();
  busy = true;
  const card = document.querySelector(".card.top");
  const tx = { right: "translate(140%,40px) rotate(22deg)", left: "translate(-140%,40px) rotate(-22deg)", up: "translate(0,-130%) rotate(-3deg)" }[dir];
  card.classList.add("fly"); card.style.transform = tx; card.style.opacity = 0;
  setTimeout(() => {
    busy = false;
    if (askOpen && dir === "right") { const o = optId || it.ask.recommend; round.done.push({ id: it.id, act: "answer", opt: o }); next(); AMO.answer(it.id, o, (notes[it.id] || "").trim()); }
    else if (askOpen && dir === "left") { round.done.push({ id: it.id, act: "park" }); next(); AMO.park(it.id, (notes[it.id] || "").trim()); }
    else { round.done.push({ id: it ? it.id : null, act: askOpen ? "later" : "ack" }); if (!it) round.done.pop(); next(); render(); }
  }, 300);
}
function next() { pos = Math.min(pos + 1, deck.length - 1); flipped = false; enterNext = true; }
function snapBack() {
  const card = document.querySelector(".card.top");
  if (!card) return;
  card.classList.add("snap"); card.style.transform = ""; card.querySelectorAll(".stamp").forEach((s) => (s.style.opacity = 0));
  setTimeout(() => card.classList.remove("snap"), 260);
}
// 拖动：鼠标和手指都行；移动不到 6 像素算点击
function bindDrag(card, e) {
  let sx, sy, dx = 0, dy = 0, down = false, moved = false;
  card.addEventListener("pointerdown", (ev) => {
    if (busy || ev.button > 0 || ev.target.closest("textarea")) return;
    down = true; moved = false; sx = ev.clientX; sy = ev.clientY; dx = dy = 0;
  });
  card.addEventListener("pointermove", (ev) => {
    if (!down) return;
    dx = ev.clientX - sx; dy = ev.clientY - sy;
    if (!moved && Math.hypot(dx, dy) > 6) { moved = true; card.setPointerCapture(ev.pointerId); card.classList.add("drag"); }
    if (!moved) return;
    card.style.transform = `translate(${dx}px,${dy}px) rotate(${dx * 0.06}deg)`;
    const r = card.querySelector(".stamp.r"), l = card.querySelector(".stamp.l"), u = card.querySelector(".stamp.u");
    const up = -dy > Math.abs(dx);
    if (r) r.style.opacity = !up && dx > 0 ? Math.min(1, dx / 110) : 0;
    if (l) l.style.opacity = !up && dx < 0 ? Math.min(1, -dx / 110) : 0;
    if (u) u.style.opacity = up ? Math.min(1, -dy / 110) : 0;
  });
  const end = () => {
    if (!down) return;
    down = false; card.classList.remove("drag");
    if (!moved) return;
    card._dragged = true; setTimeout(() => (card._dragged = false), 0);
    if (-dy > 110 && -dy > Math.abs(dx)) act("up");
    else if (dx > 110) act("right");
    else if (dx < -110) act("left");
    else snapBack();
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  card.addEventListener("click", (ev) => {
    if (card._dragged) return;
    const t = ev.target;
    if (t.closest("[data-opt]")) { const b = t.closest("[data-opt]"); if (!b.disabled) act("right", b.dataset.opt); return; }
    if (t.closest("[data-go]")) { goTo(t.closest("[data-go]").dataset.go); return; }
    if (t.closest("[data-again]")) { buildDeck(); render(); return; }
    if (t.closest("[data-seen]")) { AMO.markSeen(); return; }
    if (t.closest("[data-reopen]")) { AMO.reopen(t.closest("[data-reopen]").dataset.reopen); return; }
    if (t.closest(".amo-ref")) { ev.preventDefault(); const it = AMO.item(+t.closest(".amo-ref").dataset.num); if (it) goTo(it.id); return; }
    if (t.closest("textarea,a,.btn")) return;
    if (e.kind === "end" || e.kind === "note") return;
    flipped = !flipped; card.classList.toggle("flipped", flipped);
  });
}
// 关联跳转：牌堆里有就翻到那张，没有就把它插到眼前
function goTo(id) {
  let i = deck.findIndex((x) => x.id === id);
  if (i < 0) { deck.splice(pos, 0, { kind: "ref", id }); i = pos; }
  pos = i; flipped = false; enterNext = true; render();
}

document.getElementById("bl").onclick = () => act("left");
document.getElementById("bu").onclick = () => act("up");
document.getElementById("br").onclick = () => act("right");
document.getElementById("reset").onclick = () => { AMO.reset(); buildDeck(); render(); };
document.addEventListener("input", (ev) => { if (ev.target.dataset.note) notes[ev.target.dataset.note] = ev.target.value; });
document.addEventListener("keydown", (ev) => {
  if (ev.target.closest("textarea,input")) return;
  if (ev.key === "ArrowRight") act("right");
  else if (ev.key === "ArrowLeft") act("left");
  else if (ev.key === "ArrowUp") act("up");
  else if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); const c = document.querySelector(".card.top"); const e = deck[pos]; if (c && e.kind !== "end" && e.kind !== "note") { flipped = !flipped; c.classList.toggle("flipped", flipped); } }
  else return;
});
document.addEventListener("click", (ev) => { const a = ev.target.closest(".amo-ref"); if (a && !ev.target.closest(".card")) ev.preventDefault(); });
// 数据变了（包括在别的表达里操作过）：重画当前这张，不打乱牌堆
AMO.on(() => { if (!busy) render(); });
buildDeck();
render();
</script>
</body>
</html>
