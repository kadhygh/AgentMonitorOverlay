<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日记 · userlayer 原型</title>
<style>
/*@amo-style*/
/* Claude 风格 · 单文件 HTML 基础样式
   用法：整段内联进 <style>，之后只追加本页专用样式。
   来源：2026-10-26 AIWork HTML 展示（推进总览 / 方案图解）。图表系列色 --s1..--s3 已过色盲与对比度校验（浅 / 深两套）。
   深色切换：<button class="theme" onclick="toggleTheme()">切换深浅色</button>
   function toggleTheme(){const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark'} */

/* ---------- 变量 ---------- */
:root{color-scheme:light;--bg:#faf9f5;--surface:#ffffff;--surface-2:#f0eee6;--line:#e8e6dc;--text:#141413;--text-2:#5e5d59;--text-3:#87867f;--accent:#c96442;--accent-fill:#d97757;--accent-soft:#f6e9e1;--good:#2e7d5b;--good-soft:#e5efe8;--warn:#c28a1e;--warn-soft:#f6ecd6;--crit:#b5443a;--crit-soft:#f5e1dd;--neutral:#b0aea5;--code:#f0eee6;--s1:#d97757;--s2:#4a86c8;--s3:#5e8c3a;--lane-v:#f5f3ec;--lane-l:#f8eee8;--tip-bg:#141413;--tip-fg:#faf9f5;--shadow:0 1px 2px rgba(20,20,19,.04),0 6px 18px rgba(20,20,19,.04);--serif:"Tiempos Text","Noto Serif SC","Source Han Serif SC",Georgia,serif;--sans:"Styrene B",Inter,"Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;--mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#262624;--surface:#30302e;--surface-2:#3a3a37;--line:#44433f;--text:#faf9f5;--text-2:#c2c0b6;--text-3:#9a988f;--accent:#e08b6b;--accent-fill:#c96442;--accent-soft:#46332b;--good:#5aa37e;--good-soft:#283b31;--warn:#d9a441;--warn-soft:#41372a;--crit:#d4675c;--crit-soft:#452b28;--neutral:#6b6a64;--code:#262624;--s1:#c96442;--s2:#4f86c6;--s3:#62903c;--lane-v:#353533;--lane-l:#3b322d;--tip-bg:#faf9f5;--tip-fg:#141413;--shadow:none}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:30px 28px 80px}
nav.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-3);margin-bottom:30px}
nav.top a{color:var(--text-2);text-decoration:none}
nav.top a:hover{color:var(--accent)}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:8px;padding:5px 12px;font-size:13px}
.theme:hover{border-color:var(--accent-fill)}
h1{font:500 31px/1.3 var(--serif);letter-spacing:-.01em;margin:0 0 10px}
h1 code{font-size:.66em;vertical-align:4px}
h2{font:500 22px/1.4 var(--serif);margin:52px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font:400 13px var(--sans);color:var(--text-3)}
h3{font:500 17px/1.4 var(--serif);margin:0 0 8px}
.lead{color:var(--text-2);margin:0 0 16px;font:15.5px/1.75 var(--serif)}
code{font-family:var(--mono);font-size:.84em;background:var(--code);padding:1px 6px;border-radius:5px;color:var(--text);word-break:break-word}
a{color:var(--accent)}
footer{margin-top:56px;font-size:12.5px;color:var(--text-3);border-top:1px solid var(--line);padding-top:16px}

/* ---------- 容器 ---------- */
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card p,.prose{font-family:var(--serif)}
.prose{font-size:15px;line-height:1.8;color:var(--text-2)}
.prose li::marker{color:var(--accent-fill)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.twocol{grid-template-columns:1fr}}

/* 一句话结论：<div class="tldr"><b class="h">一句话结论</b><ul><li>…</li></ul></div> */
.tldr{margin:28px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 26px;box-shadow:var(--shadow);font:16px/1.8 var(--serif)}
.tldr b.h{display:block;font:600 12px var(--sans);letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.tldr ul{margin:0;padding-left:20px}
.tldr li{margin:5px 0}
.tldr li::marker{color:var(--accent-fill)}
.tldr code{font-size:.78em}

/* 标签：<span class="pill good"><span class="dot" style="background:var(--good)"></span>✓ 已完成</span> */
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.pill.good{background:var(--good-soft);color:var(--text)}
.pill.warn{background:var(--warn-soft);color:var(--text)}
.pill.crit{background:var(--crit-soft);color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* 数字卡片：<div class="tiles"><div class="tile"><div class="k">标签</div><div class="v">68<small> 项</small></div><div class="d">说明</div></div></div> */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow)}
.tile .k{font-size:12.5px;color:var(--text-3)}
.tile .v{font:500 34px/1.15 var(--serif);margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tile .v small{font:400 14px var(--sans);color:var(--text-3);margin-left:2px}
.tile .d{font-size:12px;color:var(--text-3);line-height:1.5}

/* 时间线：<ol class="tl"><li><span class="node">✓</span><details class="stage"><summary><div class="sname">P1 标题<span>副标题</span></div><div class="sone">一句话</div><div><span class="commit">abc1234</span><span class="chev">▸</span></div></summary><div class="sbody">…</div></details></li></ol>
   节点：.node（完成）/ .node.warn（停过或待处理）/ .node.todo（未开始） */
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl::before{content:"";position:absolute;left:13px;top:18px;bottom:18px;width:1.5px;background:var(--line)}
.tl li{position:relative;padding-left:42px;margin-bottom:10px}
.tl .node{position:absolute;left:3px;top:15px;width:22px;height:22px;border-radius:50%;background:var(--good);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700;box-shadow:0 0 0 4px var(--bg)}
.tl .node.warn{background:var(--warn)}
.tl .node.todo{background:var(--surface);border:1.5px solid var(--neutral);color:var(--text-3)}
details.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
details.stage>summary{list-style:none;cursor:pointer;padding:12px 18px;display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center}
details.stage>summary::-webkit-details-marker{display:none}
details.stage>summary:hover .sname{color:var(--accent)}
details.stage[open]>summary{border-bottom:1px solid var(--line)}
@media (max-width:820px){details.stage>summary{grid-template-columns:1fr}}
.sname{font:500 16px/1.35 var(--serif)}
.sname span{display:block;font:400 12px var(--sans);color:var(--text-3);margin-top:2px}
.sone{color:var(--text-2);font-size:14px;line-height:1.6}
.commit{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;white-space:nowrap}
.commit.none{color:var(--text-3);background:var(--surface-2)}
.chev{display:inline-block;transition:transform .15s;color:var(--text-3);margin-left:8px}
details[open] .chev{transform:rotate(90deg)}
.sbody{padding:12px 22px 16px;font:15px/1.75 var(--serif);color:var(--text-2)}
.sbody ul{margin:0;padding-left:18px}
.sbody li{margin:4px 0}
.sbody li::marker{color:var(--accent-fill)}
.sbody b{color:var(--text);font-weight:600}
.sbody code{font-size:.8em}

/* 折叠块：<details class="fold"><summary>展开 8 条</summary>…</details> */
details.fold>summary{cursor:pointer;color:var(--accent);font-size:14px}

/* ---------- 表格 / 图例 / 提示 ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--text-3);font-weight:500;font-size:12.5px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.s-ico{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.hatch{background:repeating-linear-gradient(45deg,var(--neutral) 0 2px,transparent 2px 6px);border:1px solid var(--neutral)}
.tip{position:fixed;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);font-size:12.5px;line-height:1.55;padding:8px 11px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;max-width:290px}

/* ---------- 控件 ---------- */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 13px;font-size:13.5px}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;color:var(--text-2);font-size:13.5px}
.chips button.on{border-color:var(--accent-fill);background:var(--accent-soft);color:var(--text)}

/* ---------- 流程图（内联 SVG） ---------- */
svg text{font-family:var(--sans)}
.node-g{cursor:pointer}
.node-g rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5;transition:stroke .15s}
.node-g:hover rect,.node-g.sel rect{stroke:var(--accent-fill);stroke-width:2.2}
.node-g .t{font-size:13px;font-weight:600;fill:var(--text)}
.node-g .s{font-size:11px;fill:var(--text-3)}
.node-g.bad rect{stroke:var(--crit);stroke-dasharray:5 4;fill:var(--crit-soft)}
.edge{fill:none;stroke:var(--text-3);stroke-width:1.5}
.elab{font-size:11px;fill:var(--text-2)}

/* 风险卡：<div class="risks"><div class="risk"><b>标题</b><p>说明</p><div class="m">缓解</div></div></div> */
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.risk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.risk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.risk b{display:block;margin-bottom:6px;font:500 16px var(--serif)}
.risk p{margin:0;font:14.5px/1.75 var(--serif);color:var(--text-2)}
.risk .m{font-size:12.5px;color:var(--text-3);margin-top:8px}

/*@/amo-style*/
/* ---- 本页专用样式 ---- */
/* 本子的纸、横线、页边线和封皮：浅色是米黄纸，深色是暗色纸 */
:root{--desk:#e9e4d8;--cover:#6d4c37;--cover-2:#5a3d2c;--paper:#fbf7ec;--paper-2:#f4eedf;--ln:#d9e1ea;--margin:#e5a9a0;--ink:#24221d;--ink-2:#55514a;--ink-3:#8b867b;--me:#28498a;--red:#c0392b;--hl:rgba(246,207,92,.38);--spine:rgba(0,0,0,.16)}
:root[data-theme="dark"]{--desk:#1b1a18;--cover:#3a2a20;--cover-2:#2c2019;--paper:#2b2925;--paper-2:#26241f;--ln:#3a3a3b;--margin:#6e3b35;--ink:#e7e1d2;--ink-2:#bdb6a6;--ink-3:#8e887b;--me:#9cb8ee;--red:#e2685a;--hl:rgba(222,180,80,.17);--spine:rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){--desk:#1b1a18;--cover:#3a2a20;--cover-2:#2c2019;--paper:#2b2925;--paper-2:#26241f;--ln:#3a3a3b;--margin:#6e3b35;--ink:#e7e1d2;--ink-2:#bdb6a6;--ink-3:#8e887b;--me:#9cb8ee;--red:#e2685a;--hl:rgba(222,180,80,.17);--spine:rgba(0,0,0,.45)}}
html,body{height:100%}
body{background:var(--desk);overflow:hidden}
.bar{position:fixed;top:12px;right:14px;display:flex;gap:8px;z-index:60}
.bar .btn,.bar .theme{font-size:13px;padding:5px 12px;text-decoration:none;color:var(--text-2)}
.corner{position:fixed;left:16px;bottom:10px;font:12px var(--sans);color:var(--ink-3);display:flex;gap:14px;z-index:5}
.corner button{all:unset;cursor:pointer;text-decoration:underline dotted}
.corner button:hover{color:var(--red)}
footer{display:none}
/* 本子 */
.desk{position:absolute;inset:58px 0 34px;display:flex;align-items:center;justify-content:center}
.book{--W:min(1200px,calc(100vw - 150px));--H:min(820px,calc(100vh - 100px));position:relative;width:var(--W);height:var(--H);background:linear-gradient(135deg,var(--cover),var(--cover-2));border-radius:10px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.2)}
.spread{display:grid;grid-template-columns:1fr 1fr;height:100%;position:relative}
.spread::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:60px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--spine) 48%,var(--spine) 52%,transparent);pointer-events:none}
.page{position:relative;background-color:var(--paper);overflow:hidden;padding:32px 40px 32px 84px;font:17px/32px var(--serif);color:var(--ink);
  background-image:linear-gradient(90deg,transparent 66px,var(--margin) 66px,var(--margin) 67.5px,transparent 67.5px),repeating-linear-gradient(to bottom,transparent 0 31px,var(--ln) 31px 32px)}
.page.l{border-radius:4px 0 0 4px;box-shadow:inset -14px 0 24px -18px var(--spine)}
.page.r{border-radius:0 4px 4px 0;box-shadow:inset 14px 0 24px -18px var(--spine)}
.page .head{height:64px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px}
.page .date{font:italic 600 24px/32px var(--serif);color:var(--ink)}
.page .date small{font:500 13px var(--sans);font-style:normal;color:var(--ink-3);margin-left:10px;letter-spacing:.06em}
.page .date .today{color:var(--red)}
.page .pno{position:absolute;bottom:6px;font:12px var(--sans);color:var(--ink-3)}
.page.l .pno{left:24px}.page.r .pno{right:24px}
.page p{margin:0;text-indent:2em}
.page .blk{padding-bottom:32px}
.page .blk:last-child{padding-bottom:0}
.page a.ent,.page a.amo-ref,.card a.ent,.card a.amo-ref{color:inherit;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
.page a.ent:hover,.card a.ent:hover{color:var(--red)}
.page a.ent.on{background:var(--hl)}
.hlt{background:linear-gradient(transparent 38%,var(--hl) 38%,var(--hl) 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.divider{height:64px;position:relative;margin:0 -12px}
.divider svg{position:absolute;left:0;right:0;top:4px;width:100%;height:30px;overflow:visible}
.divider path{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round}
.divider span{position:absolute;right:12px;top:30px;font:italic 15px/26px var(--serif);color:var(--red);transform:rotate(-1.5deg)}
.me p{font:italic 17px/32px var(--serif);color:var(--me);text-indent:0}
.me .sig{font:12px var(--sans);color:var(--ink-3);letter-spacing:.08em}
.now p{color:var(--ink-2)}
.cover{display:flex;flex-direction:column;justify-content:center;padding-right:60px}
.cover h2{font:600 30px/1.4 var(--serif);margin:0 0 20px;display:block}
.cover p{text-indent:0;color:var(--ink-2)}
.cover .lbl{font:600 12px var(--sans);letter-spacing:.2em;color:var(--ink-3);margin-bottom:12px}
/* 翻页 */
.turn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:90px;border:0;background:transparent;color:var(--ink-3);font:300 42px/1 var(--serif);cursor:pointer;z-index:4}
.turn:hover:not([disabled]){color:var(--red)}
.turn[disabled]{opacity:.25;cursor:default}
.turn.prev{left:-56px}.turn.next{right:-56px}
.spread.in-l{animation:inl .35s ease}.spread.in-r{animation:inr .35s ease}
@keyframes inl{from{opacity:.2;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:.2;transform:translateX(14px)}to{opacity:1;transform:none}}
/* 书签丝带 */
.ribbon{position:absolute;top:-8px;right:17px;width:34px;height:214px;background:linear-gradient(90deg,#a92f24,#c9493a 50%,#a92f24);clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%);z-index:6;border:0;cursor:pointer;color:#fff7ee;font:600 14px/1.25 var(--sans);writing-mode:vertical-rl;letter-spacing:.14em;padding:14px 0 26px;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:height .2s}
.ribbon:hover,.ribbon.on{height:226px}
.ribbon b{font:800 18px var(--sans);text-combine-upright:all}
.slip{position:absolute;top:222px;right:24px;width:400px;background:var(--paper-2);border:1px solid var(--ln);box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:7;padding:12px 16px 10px;transform:rotate(.6deg);font:15px/1.6 var(--serif);color:var(--ink)}
.slip .h{font:600 12px var(--sans);letter-spacing:.14em;color:var(--red);margin-bottom:6px}
.slip button{all:unset;display:grid;grid-template-columns:30px 1fr;gap:8px;width:100%;box-sizing:border-box;padding:8px 4px;border-top:1px dashed var(--ln);cursor:pointer}
.slip button:hover{background:var(--hl)}
.slip .s{font:600 13px var(--sans);color:var(--red)}
.slip .s.done{color:var(--ink-3)}
.slip small{display:block;font:12.5px var(--sans);color:var(--ink-3)}
/* 页边卡片 */
.card{position:absolute;width:380px;max-height:calc(100% - 16px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 16px 40px rgba(0,0,0,.28);z-index:8;padding:16px 18px 14px;font:14.5px/1.7 var(--serif);animation:cardin .2s ease}
:root[data-theme="dark"] .card{background:#33312c}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .card{background:#33312c}}
@keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;top:-2px;left:22px;width:14px;height:36px;border:2.5px solid #9a9a9a;border-radius:8px;border-bottom-color:transparent;opacity:.7}
.card .x{position:absolute;top:8px;right:10px;all:unset;cursor:pointer;font:18px var(--sans);color:var(--ink-3);padding:0 6px}
.card .x{position:absolute;top:8px;right:10px}
.card .kick{font:600 12px var(--sans);color:var(--ink-3);letter-spacing:.06em;margin:4px 0 4px 26px}
.card .kick .st{color:var(--red)}
.card h3{font:600 18px/1.45 var(--serif);margin:0 0 6px}
.card .sum{color:var(--ink-2);margin:0 0 8px}
.card .body p{margin:0 0 8px}
.card h4{font:600 11.5px var(--sans);letter-spacing:.14em;color:var(--ink-3);margin:12px 0 4px;border-top:1px solid var(--line);padding-top:8px}
.card ul{list-style:none;margin:0;padding:0}
.card li{padding:3px 0;font-size:13.5px}
.card .k{font:12px var(--sans);color:var(--ink-3);margin-right:6px}
.card code{font-size:.8em}

// userlayer 各表达共用的读写层（2026-11-01 原型）。
// 读 <script id="amo-data"> 里的 datalayer；人的操作记在 localStorage，所有表达共用一份，
// 所以在一种表达里回答了，换一种表达打开也能看到——这正是「表现随便换」要验证的。
window.AMO = (() => {
  const raw = JSON.parse(document.getElementById("amo-data").textContent);
  const KEY = "amo-userlayer:" + raw.context.id;
  const NOW = raw.now || "2026-11-01T08:30:00+08:00"; // 假数据的「现在」，让各表达的相对时间一致
  const subs = [];
  // 人的操作按假数据的「现在」往后排（第 n 次操作 = NOW + n 分钟），写成和数据一样的 +08:00 格式，
  // 这样字符串比较、排序、「上次以来」都和假数据对得上（B、C 组 11-01 的建议）
  function fakeNow(n) {
    const d = new Date(new Date(NOW).getTime() + n * 60000 + 8 * 3600000);
    return d.toISOString().slice(0, 19) + "+08:00";
  }

  const TYPE = {
    decision: { label: "决定", hint: "要你拍板" },
    question: { label: "问题", hint: "要你回答" },
    bug: { label: "bug", hint: "出错的地方" },
    finding: { label: "发现", hint: "值得注意" },
    task: { label: "事项", hint: "要做的事" },
    conclusion: { label: "结论", hint: "已经定了" },
    milestone: { label: "节点", hint: "发布、开工、交接" },
  };
  // 状态不能只靠颜色：每个都带符号和文字
  const STATUS = {
    needs_you: { label: "等你", sym: "!", color: "var(--accent-fill)", soft: "var(--accent-soft)" },
    working: { label: "进行中", sym: "◐", color: "var(--s2)", soft: "var(--surface-2)" },
    waiting: { label: "等别人", sym: "○", color: "var(--warn)", soft: "var(--warn-soft)" },
    settled: { label: "已定", sym: "✓", color: "var(--good)", soft: "var(--good-soft)" },
    parked: { label: "搁置", sym: "–", color: "var(--neutral)", soft: "var(--surface-2)" },
  };
  const REL = {
    depends: { out: "要等", in: "被它卡住的" },
    affects: { out: "会影响", in: "受它影响" },
    answers: { out: "回答了", in: "被回答" },
    supersedes: { out: "取代了", in: "被取代" },
    part_of: { out: "属于", in: "包含" },
  };
  const EVIDENCE = { file: "文件", commit: "提交", session: "会话", url: "网址", log: "记录" };
  const IMPORTANCE = { high: 3, normal: 2, low: 1 };

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { ops: [], seenAt: null }; } catch { return { ops: [], seenAt: null }; } };
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));
  let state = load();
  let data;

  function build() {
    data = JSON.parse(JSON.stringify(raw));
    // 0.2 的条目只写 at：补齐 0.1 的时间和重要程度字段，各表达不用分两套
    for (const i of data.items) { i.createdAt ||= i.at; i.updatedAt ||= i.at; i.importance ||= "normal"; i.evidence ||= []; }
    data.events ||= []; data.areas ||= []; data.links ||= [];
    if (state.seenAt) data.viewer.lastSeenAt = state.seenAt;
    for (const op of state.ops) applyOp(op);
  }
  function applyOp(op) {
    const it = data.items.find((i) => i.id === op.item);
    if (!it) return;
    const ev = { at: op.at, item: it.id, actor: "human", kind: op.kind, text: "" };
    if (op.kind === "answered") {
      const opt = it.ask.options.find((o) => o.id === op.option);
      it.ask.answer = { option: op.option, note: op.note || "", at: op.at };
      it.status = "working";
      it.owner = it.source;
      // 球交回提问的 agent：它的状态和在做的事跟着变
      const ag = data.agents.find((a) => a.id === it.source);
      if (ag) { ag.status = "running"; ag.item = it.id; ag.doing = `按你选的「${opt ? opt.label : op.option}」处理 #${it.num}`; }
      ev.text = `你选了「${opt ? opt.label : op.option}」${op.note ? "：" + op.note : ""}，交回${ownerName(it.source)}`;
    } else if (op.kind === "parked") {
      it.status = "parked"; it.owner = "human";
      ev.kind = "status"; ev.text = "你搁置了" + (op.note ? "：" + op.note : "");
    } else if (op.kind === "reopened") {
      const orig = raw.items.find((i) => i.id === it.id);
      it.status = orig.status === "parked" ? "needs_you" : orig.status; it.owner = orig.status === "parked" ? "human" : orig.owner;
      if (it.ask && orig.ask && !orig.ask.answer) { delete it.ask.answer; it.status = "needs_you"; it.owner = "human"; }
      ev.kind = "status"; ev.text = "你重新打开了";
    } else if (op.kind === "comment") {
      ev.text = "你批注：" + op.note;
    }
    it.updatedAt = op.at;
    data.events.push(ev);
  }
  function commit(op) {
    op.at = fakeNow(state.ops.length + 1);
    state.ops.push(op); save(); build(); emit();
  }
  const emit = () => subs.forEach((f) => f(data));

  // ---------- 查询 ----------
  const items = (pred) => data.items.filter(pred || (() => true));
  const item = (key) => data.items.find((i) => i.id === key || i.num === key || "#" + i.num === key);
  const agent = (id) => data.agents.find((a) => a.id === id);
  const area = (id) => data.areas.find((a) => a.id === id);
  function ownerName(owner) {
    if (!owner) return "";
    if (owner === "human") return "你";
    if (owner.startsWith("team:")) return owner.slice(5);
    const a = agent(owner); return a ? a.name : owner;
  }
  // 站在当前这一条说话：「要先等 #5」「#10 在等这条」，比 label 的「被它卡住的」好懂（A 组 11-01 的建议）
  const SAY = {
    depends: { out: (n) => `要先等 #${n}`, in: (n) => `#${n} 在等这条` },
    affects: { out: (n) => `会影响 #${n}`, in: (n) => `#${n} 会影响这条` },
    answers: { out: (n) => `回答了 #${n}`, in: (n) => `#${n} 回答了这条` },
    supersedes: { out: (n) => `取代了 #${n}`, in: (n) => `#${n} 取代了这条` },
    part_of: { out: (n) => `属于 #${n}`, in: (n) => `#${n} 是这条的一部分` },
  };
  function links(id) {
    return {
      out: data.links.filter((l) => l.from === id).map((l) => ({ ...l, item: item(l.to), label: REL[l.rel].out, say: SAY[l.rel].out(item(l.to).num) })),
      in: data.links.filter((l) => l.to === id).map((l) => ({ ...l, item: item(l.from), label: REL[l.rel].in, say: SAY[l.rel].in(item(l.from).num) })),
    };
  }
  const lastSeen = () => data.viewer.lastSeenAt;
  // 「上次以来」只算 agent 那边的变化，人自己的操作不算
  const isNew = (it) => { const r = raw.items.find((i) => i.id === it.id) || it; return (r.updatedAt || r.at) > lastSeen(); };
  const changesSince = (t) => data.events.filter((e) => e.at > (t || lastSeen())).sort((a, b) => a.at.localeCompare(b.at));
  const byWeight = (a, b) => IMPORTANCE[b.importance] - IMPORTANCE[a.importance] || a.createdAt.localeCompare(b.createdAt);
  const needsYou = () => items((i) => i.status === "needs_you").sort(byWeight);
  function counts() {
    const c = { total: data.items.length };
    for (const s of Object.keys(STATUS)) c[s] = data.items.filter((i) => i.status === s).length;
    return c;
  }

  // ---------- 文字 ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inline(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/#(\d+)/g, '<a href="#" class="amo-ref" data-num="$1">#$1</a>');
  }
  function md(text) {
    if (!text) return "";
    return text.split(/\n{2,}/).map((p) => {
      const lines = p.split("\n");
      if (lines.every((l) => /^\s*[-*] /.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*[-*] /, "")) + "</li>").join("") + "</ul>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";
    }).join("");
  }
  function fmtTime(iso) {
    const d = new Date(iso), now = new Date(NOW);
    const hm = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Shanghai" });
    const day = (x) => x.toLocaleDateString("zh-CN", { timeZone: "Asia/Shanghai" });
    if (day(d) === day(now)) return "今天 " + hm;
    if (day(new Date(d.getTime() + 864e5)) === day(now)) return "昨天 " + hm;
    return d.toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit", timeZone: "Asia/Shanghai" }) + " " + hm;
  }
  function ago(iso) {
    const m = Math.round((new Date(NOW) - new Date(iso)) / 60000);
    if (m < 1) return "刚才"; if (m < 60) return m + " 分钟前";
    const h = Math.round(m / 60); return h < 24 ? h + " 小时前" : Math.round(h / 24) + " 天前";
  }

  // ---------- 外观 ----------
  function applyTheme() { const t = localStorage.getItem("amo-userlayer:theme"); if (t) document.documentElement.dataset.theme = t; }
  function toggleTheme() {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    localStorage.setItem("amo-userlayer:theme", r.dataset.theme);
  }
  function toast(msg) {
    let el = document.getElementById("amo-toast");
    if (!el) {
      el = document.createElement("div"); el.id = "amo-toast";
      el.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-fg);padding:9px 16px;border-radius:10px;font:13.5px var(--sans);z-index:99;opacity:0;transition:opacity .2s;pointer-events:none";
      document.body.appendChild(el);
    }
    el.textContent = msg; el.style.opacity = 1;
    clearTimeout(el._t); el._t = setTimeout(() => (el.style.opacity = 0), 2200);
  }

  applyTheme();
  build();
  addEventListener("storage", (e) => { if (e.key === KEY) { state = load(); build(); emit(); } });

  return {
    raw, get data() { return data; }, NOW, TYPE, STATUS, REL, EVIDENCE, IMPORTANCE,
    items, item, agent, area, ownerName, links, lastSeen, isNew, changesSince, needsYou, counts, byWeight,
    esc, md, inline, fmtTime, ago, toggleTheme, toast,
    now: () => fakeNow(state.ops.length),
    // 各表达自己的布局（纸摆在哪、区画在哪），按表达分开存，人摆过的位置不会被别的表达改掉
    layout: (view, value) => { const k = "amo-userlayer:layout:" + view; if (value === undefined) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } } localStorage.setItem(k, JSON.stringify(value)); },
    on: (f) => { subs.push(f); return () => subs.splice(subs.indexOf(f), 1); },
    // 人的操作：都写成事件，球交回提问的 agent
    answer: (id, option, note) => { commit({ kind: "answered", item: id, option, note }); toast("已发回" + ownerName(item(id).source)); },
    park: (id, note) => { commit({ kind: "parked", item: id, note }); toast("已搁置 #" + item(id).num); },
    reopen: (id) => { commit({ kind: "reopened", item: id }); toast("已重新打开 #" + item(id).num); },
    comment: (id, note) => { commit({ kind: "comment", item: id, note }); toast("批注已记下，整理员会归档"); },
    markSeen: () => { state.seenAt = fakeNow(state.ops.length + 1); save(); build(); emit(); toast("已标为看过"); },
    reset: () => { state = { ops: [], seenAt: null }; save(); build(); emit(); toast("已恢复成初始假数据"); },
  };
})();

/*@/amo-lib*/
</script>
<script>
// 日记：按 events 写成段落。代理的事用「你……」叙述，人自己的操作用「我……」记在今天末尾。
const esc = AMO.esc, $ = (s) => document.querySelector(s);
const P = (iso) => { const d = new Date(new Date(iso).getTime() + 8 * 3600e3); return { h: d.getUTCHours(), mi: d.getUTCMinutes(), key: d.toISOString().slice(0, 10), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay() }; };
const WD = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
const today = P(AMO.NOW).key;
const mins = (a, b) => Math.round((new Date(b) - new Date(a)) / 60000);
function period(h) { return h < 5 ? "凌晨" : h < 9 ? "早上" : h < 12 ? "上午" : h < 13 ? "中午" : h < 18 ? "下午" : h < 19 ? "傍晚" : "晚上"; }
const coarse = (h) => (h < 12 ? 0 : h < 18 ? 1 : 2);
function clock(h, mi) { const hh = h % 12 === 0 ? 12 : h % 12; return mi === 0 ? `${hh} 点` : mi === 30 ? `${hh} 点半` : `${hh} 点 ${mi} 分`; }
const hmm = (iso) => { const t = P(iso); return `${t.h}:${String(t.mi).padStart(2, "0")}`; };
const ent = (it, text) => `<a class="ent" data-id="${it.id}">${text}</a>`;
const ref = (it) => ent(it, "#" + it.num);
const refs = (s) => esc(s).replace(/#(\d+)/g, (_, n) => (AMO.item(+n) ? ref(AMO.item(+n)) : "#" + n));
const end = (s) => (/[。？！]$/.test(s.replace(/<[^>]+>/g, "")) ? s : s + "。");
const who = (id) => AMO.ownerName(id);
const rawCount = AMO.raw.events.length;

// ---------- 一件事写成一句 ----------
function clause(e, prev) {
  const it = e.item && AMO.item(e.item), A = who(e.actor);
  const same = prev && prev.item === e.item;
  const again = prev && prev.actor === e.actor && prev.kind === e.kind ? "又" : "";
  if (e.kind === "created" && it) {
    const t = ent(it, esc(it.title));
    const team = it.owner.startsWith("team:") ? it.owner.slice(5) : "";
    if (it.type === "conclusion") return `${A}${again}记下一条结论：${t}`;
    if (it.type === "task") { const dep = AMO.links(it.id).out.find((l) => l.rel === "depends"); return `${A}${again}记了一件待办：${t}${dep ? `，要等 ${ref(dep.item)} 定了再做` : ""}`; }
    if (it.type === "bug") return `${A}${again}发现了一个问题：${t}`;
    if (it.type === "finding") return `${A}${again}注意到${t}${team ? `，请${team}帮忙确认` : ""}`;
    if (team) return `${A}去问${team}：${t}`;
    return `${A}${again}来问你：${t}`;
  }
  if (e.kind === "answered" && it) {
    const a = it.ask?.answer, o = a && it.ask.options.find((x) => x.id === a.option);
    return `你回答了${who(it.source)}的问题（${ref(it)}），选的是「${esc(o ? o.label : "")}」${a?.note ? `，还补了一句：「${esc(a.note)}」` : ""}`;
  }
  if (e.kind === "concluded" && it) {
    const tx = e.text.replace(/^做完[，,]?/, "");
    return e.text.startsWith("做完") ? `${A}做完了${same ? "" : " " + ref(it)}，${refs(tx)}` : `${A}来报${same ? "" : " " + ref(it)}：${refs(e.text)}`;
  }
  if (e.kind === "status" && it && e.actor === "human") {
    const note = e.text.split("：")[1];
    return `你把「${ent(it, esc(it.title))}」搁置了${note ? "，" + esc(note) : ""}`;
  }
  if (e.kind === "status" && it) return `${refs(e.text)}${same ? "" : "（" + ref(it) + "）"}`;
  if (e.kind === "comment") {
    if (e.actor === "human") return `你在 ${ref(it)} 旁边写了一句：「${esc(e.text)}」`;
    return e.text.startsWith("整理完：") ? `${A}整理完一遍：${refs(e.text.slice(4))}` : `${A}留了句话：「${refs(e.text)}」`;
  }
  return refs(e.text);
}
// 一段里接连几件事，时间说法轮着用，免得句句「紧接着」
function when(e, prev, first, k) {
  const t = P(e.at);
  if (first) return `${period(t.h)} ${clock(t.h, t.mi)}`;
  const g = mins(prev.at, e.at);
  if (g <= 5) return ["接着", "没过几分钟", "随后", "又过了一会儿"][k % 4];
  if (g <= 20) return k % 2 ? clock(t.h, t.mi) : `过了 ${g} 分钟`;
  if (g < 55) return `${g} 分钟后`;
  if (g <= 65) return "一小时后";
  return `${period(P(prev.at).h) === period(t.h) ? "" : period(t.h) + " "}${clock(t.h, t.mi)}`;
}

// ---------- 按天、按时段拼成段落 ----------
function buildDays() {
  const evs = AMO.data.events.slice(0, rawCount).sort((a, b) => a.at.localeCompare(b.at));
  const seen = AMO.lastSeen(), days = {};
  for (const e of evs) (days[P(e.at).key] ||= []).push(e);
  if (!days[today]) days[today] = [];
  const out = [];
  for (const key of Object.keys(days).sort()) {
    const blocks = [], list = days[key];
    let para = null, dividerDone = false;
    const flush = () => { if (para) blocks.push(para); para = null; };
    list.forEach((e) => {
      const after = e.at > seen;
      if (after && !dividerDone && seen.slice(0, 10) <= key && P(seen).key === key) { flush(); blocks.push({ kind: "divider" }); dividerDone = true; }
      const prev = para && para.evs[para.evs.length - 1];
      if (!para || para.evs.length >= 4 || mins(prev.at, e.at) > 80 || coarse(P(prev.at).h) !== coarse(P(e.at).h) || (after && !(prev.at > seen))) { flush(); para = { kind: "p", evs: [], after }; }
      const pv = para.evs[para.evs.length - 1];
      para.evs.push(e);
      (para.parts ||= []).push(`${when(e, pv, !pv, para.evs.length)}，${end(clause(e, pv))}`);
    });
    flush();
    // 上次看过的时间落在两天之间：分隔线放在这一天开头
    if (!dividerDone && P(seen).key < key && blocks.length && !out.some((d) => d.hasDivider)) { blocks.unshift({ kind: "divider" }); dividerDone = true; }
    if (key === today) blocks.push(...todayTail());
    out.push({ key, blocks, hasDivider: dividerDone });
  }
  return out;
}
// 今天末尾：此刻谁在干什么、还挂着的；然后是我自己记的
function todayTail() {
  const n = P(AMO.NOW), tail = [];
  const busy = AMO.data.agents.filter((a) => a.status !== "idle").map((a) => `${esc(a.name)}${a.status === "waiting" ? "" : "在"}${refs(a.doing.replace("：", "，"))}`);
  const needs = AMO.needsYou(), waiting = AMO.items((i) => i.status === "waiting");
  const wb = {}; for (const i of waiting) (wb[i.owner] ||= []).push(ref(i));
  let s = `写到这里是${period(n.h)} ${clock(n.h, n.mi)}。${busy.length ? busy.join("；") + "。" : ""}`;
  s += needs.length ? `还有 ${needs.length} 件等你定，最要紧的是 ${ref(needs[0])}。` : "要你定的都定了。";
  const ws = Object.entries(wb).map(([o, r]) => `${r.join("、")} 在等${who(o)}回话`);
  if (ws.length) s += ws.join("，") + "。";
  tail.push({ kind: "p", parts: [s], cls: "now", after: true });
  const mine = AMO.data.events.slice(rawCount);
  if (mine.length) tail.push({ kind: "me", parts: mine.map(myLine) });
  return tail;
}
function myLine(e) {
  const it = AMO.item(e.item), t = hmm(e.at);
  if (e.kind === "answered") { const a = it.ask?.answer, o = a && it.ask.options.find((x) => x.id === a.option); return `${t}，${ref(it)} 我选了「${esc(o?.label || "")}」${a?.note ? `，附了一句「${esc(a.note)}」` : ""}，交给了${esc(who(it.source))}。`; }
  if (e.kind === "comment") return `${t}，我在 ${ref(it)} 旁边写了：「${esc(e.text.replace(/^你批注：/, ""))}」`;
  if (e.text.startsWith("你搁置了")) { const note = e.text.split("：")[1]; return `${t}，${ref(it)} 先搁着${note ? "，" + esc(note) : ""}。`; }
  if (e.text.startsWith("你重新打开")) return `${t}，我把 ${ref(it)} 重新打开了。`;
  return `${t}，${esc(e.text)}。`;
}

function blockHtml(b) {
  if (b.kind === "divider") {
    const t = P(AMO.lastSeen());
    return `<div class="blk divider"><svg viewBox="0 0 500 30" preserveAspectRatio="none"><path d="M2 16 C 40 6, 70 24, 110 14 S 180 6, 220 15 S 300 24, 340 13 S 420 8, 460 16 S 490 18, 498 12"/><path d="M8 20 C 60 14, 120 22, 200 18 S 330 14, 420 19" style="stroke-width:1;opacity:.5"/></svg><span>你上次看到这里 · ${t.key === today ? "今天" : "昨晚"} ${clock(t.h, t.mi)}</span></div>`;
  }
  if (b.kind === "me") return `<div class="blk me">${b.parts.map((p) => `<p>${p}</p>`).join("")}<div class="sig">—— 我</div></div>`;
  const inner = b.parts.join("");
  return `<div class="blk ${b.cls || ""}"><p>${b.after ? `<span class="hlt">${inner}</span>` : inner}</p></div>`;
}

// ---------- 分页：今天要落在右页 ----------
function dateHead(key, cont) {
  const [y, m, d] = key.split("-").map(Number), wd = WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return `${m} 月 ${d} 日<small>${wd}${key === today ? ' · <span class="today">今天</span>' : ""}${cont ? " · 续" : ""}</small>`;
}
function paginate(days, pageEl) {
  const pages = [];
  const cap = pageEl.clientHeight - 32 - 32 - 64; // 上下留白 + 日期行
  for (const day of days) {
    let cur = { key: day.key, html: [], h: 0, cont: false };
    for (const b of day.blocks) {
      pageEl.querySelector(".body").innerHTML = blockHtml(b);
      // 量的时候它是最后一块、没有下边距，补上 32
      const h = Math.ceil(pageEl.querySelector(".body").firstElementChild.offsetHeight / 32) * 32 + 32;
      if (cur.html.length && cur.h + h > cap + 32) { pages.push(cur); cur = { key: day.key, html: [], h: 0, cont: true }; }
      cur.html.push(blockHtml(b)); cur.h += h;
    }
    pages.push(cur);
  }
  const before = pages.filter((p) => p.key < today).length;
  if (before % 2 === 0) pages.unshift({ cover: true });
  return pages;
}
function pageHtml(p, side, no) {
  if (!p) return `<div class="page ${side}"></div>`;
  if (p.cover) return `<div class="page ${side} cover"><div class="lbl">这一本记的是</div><h2>${esc(AMO.data.context.title)}</h2><p>${esc(AMO.data.context.goal)}</p><div class="pno">${no}</div></div>`;
  return `<div class="page ${side}"><div class="head"><div class="date">${dateHead(p.key, p.cont)}</div></div><div class="body">${p.html.join("")}</div><div class="pno">${no}</div></div>`;
}

let pages = [], spread = -1, cardId = null, slipOpen = false, dir = "";
const narrow = () => matchMedia("(max-width:900px)").matches;
function render(opts = {}) {
  const book = $("#book");
  const days = buildDays();
  if (narrow()) {
    book.innerHTML = `${ribbonHtml()}<div class="spread"><div class="page">${days.map((d) => `<div class="head"><div class="date">${dateHead(d.key)}</div></div><div class="body">${d.blocks.map(blockHtml).join("")}</div>`).join("")}</div></div>`;
  } else {
    // 用一张看不见的页量高度
    book.innerHTML = `<div class="spread measure" style="width:${book.clientWidth - 24}px;height:${book.clientHeight - 24}px"><div class="page l"><div class="body"></div></div></div>`;
    pages = paginate(days, book.querySelector(".measure .page"));
    const nS = Math.ceil(pages.length / 2);
    const todayIdx = pages.findIndex((p) => p.key === today);
    if (spread < 0) spread = Math.floor(todayIdx / 2);
    if (opts.toEnd) spread = nS - 1;
    spread = Math.max(0, Math.min(nS - 1, spread));
    const L = pages[spread * 2], R = pages[spread * 2 + 1];
    book.innerHTML = `${ribbonHtml()}
      <button class="turn prev" ${spread ? "" : "disabled"} onclick="flip(-1)" title="往前翻（←）">‹</button>
      <div class="spread ${dir}">${pageHtml(L, "l", spread * 2 + 1)}${pageHtml(R, "r", spread * 2 + 2)}</div>
      <button class="turn next" ${spread < nS - 1 ? "" : "disabled"} onclick="flip(1)" title="往后翻（→）">›</button>`;
  }
  dir = "";
  if (slipOpen) book.insertAdjacentHTML("beforeend", slipHtml());
  if (cardId) showCard(cardId, null, opts.toEnd);
}
function flip(d) { const nS = Math.ceil(pages.length / 2); const s = Math.max(0, Math.min(nS - 1, spread + d)); if (s === spread) return; spread = s; dir = d < 0 ? "in-l" : "in-r"; cardId = null; slipOpen = false; render(); }

// ---------- 书签丝带 ----------
const todays = () => AMO.raw.items.filter((i) => i.status === "needs_you").map((i) => AMO.item(i.id)).sort(AMO.byWeight);
function ribbonHtml() { const n = AMO.needsYou().length; return `<button class="ribbon ${slipOpen ? "on" : ""}" onclick="slipOpen=!slipOpen;cardId=null;render()">今天要你定的 <b>${n}</b> 件</button>`; }
function slipHtml() {
  const list = todays();
  return `<div class="slip"><div class="h">今天要你定的 · 夹在这一页</div>${list.map((it, k) => {
    const st = it.status === "needs_you" ? `<span class="s">!</span>` : `<span class="s done">${AMO.STATUS[it.status].sym}</span>`;
    const sub = it.status === "needs_you" ? `${k === 0 ? "最要紧 · " : ""}${who(it.source)}问的${AMO.isNew(it) ? " · 昨晚之后新来的" : " · 昨天就在等"}` : it.status === "parked" ? "搁置了" : `已交${who(it.owner)}，在进行中`;
    return `<button data-card="${it.id}">${st}<span>${ref(it)} ${esc(it.title)}<small>${sub}</small></span></button>`;
  }).join("")}</div>`;
}

// ---------- 页边卡片 ----------
function cardHtml(it) {
  const st = AMO.STATUS[it.status], a = it.ask, ans = a?.answer, done = it.status !== "needs_you";
  const L = AMO.links(it.id), rel = [...L.out, ...L.in];
  let ask = "";
  if (a) {
    ask = `<h4>${done ? "你的回答" : "要你定"}</h4><div class="q">${refs(a.question)}</div>` + a.options.map((o, k) => {
      const ch = ans && ans.option === o.id, rec = o.id === a.recommend;
      return `<button class="opt ${ch ? "ch" : done ? "dim" : ""}" ${done ? "disabled" : ""} data-ans="${it.id}" data-opt="${o.id}">${rec ? `<span class="rec">推荐</span>` : ch ? `<span class="rec">✓ 你选的</span>` : ""}${ch ? "✓ " : ""}${esc(o.label)}${o.detail ? `<span class="d">${esc(o.detail)}</span>` : ""}</button>${rec && !done ? `<div class="why">${refs(a.why)}</div>` : ""}`;
    }).join("");
  }
  const row = it.status === "parked" ? `<div class="row"><span>– 搁置着</span><button data-reopen="${it.id}">重新打开</button></div>`
    : done && ans ? `<div class="row"><span>◐ 已交回${esc(who(it.owner))}，在进行中</span><button data-reopen="${it.id}">改主意</button></div>`
    : it.status === "needs_you" ? `<input class="note" placeholder="附一句话（可不填）"><div class="row"><span></span><button data-park="${it.id}">先搁置</button></div>`
    : it.status !== "settled" ? `<div class="row"><span>${st.sym} ${st.label}：${esc(who(it.owner))}</span><button data-park="${it.id}">搁置</button></div>` : "";
  return `<button class="x" data-close title="收起（Esc）">×</button>
    <div class="kick">${esc(AMO.area(it.area)?.name || "")} · ${AMO.TYPE[it.type].label} · <span class="st">${st.sym} ${st.label}</span>${AMO.isNew(it) ? " · 新" : ""}</div>
    <h3>${ref(it)} ${esc(it.title)}</h3>
    <p class="sum">${refs(it.summary)}</p>
    ${it.body ? `<div class="body">${AMO.md(it.body)}</div>` : ""}
    ${it.conclusion ? `<h4>${it.status === "parked" ? "为什么搁置" : "结论"}</h4><div>${refs(it.conclusion)}</div>` : ""}
    ${ask}${row}
    ${it.evidence?.length ? `<h4>证据</h4><ul>${it.evidence.map((e) => `<li><span class="k">${AMO.EVIDENCE[e.kind] || e.kind}</span><code>${esc(e.ref)}</code> ${esc(e.note || "")}</li>`).join("")}</ul>` : ""}
    ${rel.length ? `<h4>关联</h4><ul>${rel.map((l) => `<li><span class="k">${l.label}</span>${ent(l.item, "#" + l.item.num + " " + esc(l.item.title))} <span class="k">${AMO.STATUS[l.item.status].sym} ${AMO.STATUS[l.item.status].label}</span></li>`).join("")}</ul>` : ""}
    <div class="who">${esc(who(it.source))}提的 · 现在在${esc(who(it.owner))}手里</div>`;
}
function showCard(id, anchor, avoidMe) {
  const it = AMO.item(id); if (!it) return;
  cardId = id;
  const book = $("#book");
  book.querySelectorAll(".card").forEach((c) => c.remove());
  book.querySelectorAll("a.ent.on").forEach((a) => a.classList.remove("on"));
  const c = document.createElement("div"); c.className = "card"; c.innerHTML = cardHtml(it);
  book.appendChild(c);
  // 卡片贴在链接所在那一页的外侧页边；找不到链接（从丝带打开）就贴在右页
  const a = anchor || book.querySelector(`.spread a.ent[data-id="${id}"]`);
  const bb = book.getBoundingClientRect();
  let side = "r", y = 150;
  if (a && a.closest(".page")) { a.classList.add("on"); side = a.closest(".page").classList.contains("l") ? "l" : "r"; y = a.getBoundingClientRect().top - bb.top - 40; }
  if (anchor && anchor.closest(".slip")) { side = "r"; y = 90; }
  // 刚回答完：卡片让开日记末尾新写的那段
  const me = avoidMe && book.querySelector(".spread .me");
  if (me) { side = me.closest(".page").classList.contains("l") ? "r" : "l"; y = 60; }
  c.style.left = side === "r" ? `${bb.width - 380 + 34}px` : "-34px";
  c.style.top = `${Math.max(8, Math.min(y, bb.height - c.offsetHeight - 8))}px`;
}

// ---------- 交互 ----------
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("[data-close]")) { cardId = null; render(); return; }
  const card = t.closest("[data-card]");
  if (card) { slipOpen = false; render(); showCard(card.dataset.card, null); return; }
  const a = t.closest("a.ent,a.amo-ref");
  if (a) { e.preventDefault(); const it = a.dataset.id ? AMO.item(a.dataset.id) : AMO.item(+a.dataset.num); if (it) { slipOpen && (slipOpen = false, render()); showCard(it.id, a.closest(".card,.slip") ? null : a); } return; }
  const b = t.closest("[data-ans]");
  if (b && !b.disabled) { const note = (b.closest(".card").querySelector(".note")?.value || "").trim(); AMO.answer(b.dataset.ans, b.dataset.opt, note); return; }
  const pk = t.closest("[data-park]"); if (pk) { const note = (pk.closest(".card").querySelector(".note")?.value || "").trim(); AMO.park(pk.dataset.park, note); return; }
  const ro = t.closest("[data-reopen]"); if (ro) { AMO.reopen(ro.dataset.reopen); return; }
  if (!t.closest(".card,.slip,.ribbon") && (cardId || slipOpen)) { cardId = null; slipOpen = false; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea")) return;
  if (e.key === "ArrowLeft") flip(-1);
  else if (e.key === "ArrowRight") flip(1);
  else if (e.key === "Escape") { cardId = null; slipOpen = false; render(); }
});
// 人回答、搁置之后：翻到最后一页，看日记末尾多出的那段
AMO.on(() => render({ toEnd: true }));
addEventListener("resize", () => render());
render();
</script>
<footer>数据：studio/plans/userlayer/sample.json（假数据）· 规范：studio/plans/userlayer/README.md</footer>
