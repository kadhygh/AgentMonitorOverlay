<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 24 464 464" width="512" height="512">
  <!-- AMO 平台 候选 A「工具架」(2026-10-28): the family's 取景框 corners around a 2×2 shelf of tool tiles — three in
       Studio's ink blue, one in clay for the one that is new or being installed. No face, so it never reads as Studio. -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#22201c" flood-opacity="0.26"/></filter>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5a92"/><stop offset="1" stop-color="#1b3557"/></linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#fbfaf7" stroke-width="44" opacity="0.9">
      <path d="M80 168 V96 Q80 80 96 80 H168"/><path d="M344 80 H416 Q432 80 432 96 V168"/>
      <path d="M432 344 V416 Q432 432 416 432 H344"/><path d="M168 432 H96 Q80 432 80 416 V344"/>
    </g>
    <g stroke="#22201c" stroke-width="28">
      <path d="M80 168 V96 Q80 80 96 80 H168"/><path d="M344 80 H416 Q432 80 432 96 V168"/>
      <path d="M432 344 V416 Q432 432 416 432 H344"/><path d="M168 432 H96 Q80 432 80 416 V344"/>
    </g>
  </g>
  <g filter="url(#sh)">
    <rect x="142" y="142" width="104" height="104" rx="30" fill="url(#blue)"/>
    <rect x="266" y="142" width="104" height="104" rx="30" fill="#D97757"/>
    <rect x="142" y="266" width="104" height="104" rx="30" fill="url(#blue)"/>
    <rect x="266" y="266" width="104" height="104" rx="30" fill="url(#blue)"/>
  </g>
  <g fill="#fff" opacity="0.14">
    <rect x="152" y="150" width="84" height="26" rx="13"/><rect x="152" y="274" width="84" height="26" rx="13"/><rect x="276" y="274" width="84" height="26" rx="13"/>
  </g>
  <rect x="276" y="150" width="84" height="26" rx="13" fill="#fff" opacity="0.2"/>
</svg>
