<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 24 464 464" width="512" height="512">
  <!-- AMO 平台 候选 B「装进来」(2026-10-28): Studio's ink-blue tile inside the 取景框, but the face is replaced by a paper
       arrow dropping into a tray — the place tools are installed and updated from. A clay dot where Studio keeps its red
       recording dot says "something new is waiting". -->
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#22201c" flood-opacity="0.28"/></filter>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5a92"/><stop offset="1" stop-color="#1b3557"/></linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#fbfaf7" stroke-width="44" opacity="0.9">
      <path d="M80 168 V96 Q80 80 96 80 H168"/><path d="M344 80 H416 Q432 80 432 96 V168"/>
      <path d="M432 344 V416 Q432 432 416 432 H344"/><path d="M168 432 H96 Q80 432 80 416 V344"/>
    </g>
    <g stroke="#22201c" stroke-width="28">
      <path d="M80 168 V96 Q80 80 96 80 H168"/><path d="M344 80 H416 Q432 80 432 96 V168"/>
      <path d="M432 344 V416 Q432 432 416 432 H344"/><path d="M168 432 H96 Q80 432 80 416 V344"/>
    </g>
  </g>
  <g filter="url(#sh)"><rect x="148" y="148" width="216" height="216" rx="60" fill="url(#blue)"/></g>
  <rect x="166" y="160" width="180" height="40" rx="20" fill="#fff" opacity="0.14"/>
  <g fill="none" stroke="#fbfaf7" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 196 V286"/><path d="M212 246 L256 290 L300 246"/>
    <path d="M196 300 V322 H316 V300"/>
  </g>
  <circle cx="380" cy="132" r="24" fill="#D97757" stroke="#fbfaf7" stroke-width="10"/>
